name: Apply redesign stylesheet

on:
  push:
    branches: [main]
    paths:
      - 'redesign.css'
      - 'index.html'
      - '.github/workflows/apply-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Attach redesign stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<link rel="stylesheet" href="redesign.css">'
          if link not in s:
              marker = '</head>'
              if marker not in s:
                  raise SystemExit('index.html: </head> not found')
              s = s.replace(marker, '  ' + link + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit injected stylesheet link
        run: |
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply visual redesign stylesheet'
          git push
