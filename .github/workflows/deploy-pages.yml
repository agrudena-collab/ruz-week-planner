name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["RUZ Daily Schedule"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout published source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Attach dark reference redesign
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = '<link rel="stylesheet" href="redesign.css">'
          if marker not in s:
              s = s.replace('</head>', f'  {marker}\n</head>', 1)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Repair archive after group loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = "/* ARCHIVE_RUNTIME_REPAIR_V2 */"
          if marker not in s:
              patch = r'''<script>
          /* ARCHIVE_RUNTIME_REPAIR_V2 */
          (() => {
            const loadArchiveSafe = async () => {
              if (typeof window.loadArchive !== "function") return;
              try { await window.loadArchive(); } catch (_) {}
            };

            const repair = () => {
              if (window.__archiveRepairInstalledV2) return true;
              if (typeof window.loadSchedule !== "function") return false;

              const originalLoadSchedule = window.loadSchedule;
              window.loadSchedule = async function(...args) {
                const result = await originalLoadSchedule.apply(this, args);
                await loadArchiveSafe();
                return result;
              };

              if (window.__ruzApp && typeof window.__ruzApp.loadGroup === "function") {
                const originalLoadGroup = window.__ruzApp.loadGroup;
                window.__ruzApp.loadGroup = async function(...args) {
                  const result = await originalLoadGroup.apply(this, args);
                  await loadArchiveSafe();
                  return result;
                };
              }

              window.__archiveRepairInstalledV2 = true;
              return true;
            };

            const timer = setInterval(() => {
              if (repair()) clearInterval(timer);
            }, 100);

            setTimeout(loadArchiveSafe, 1500);
          })();
          </script>'''
              s = s.replace('</body>', patch + '\n</body>', 1)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
