name: Archive passed lessons

on:
  workflow_dispatch:
  schedule:
    # Каждый день в 03:10 по Москве
    - cron: "10 0 * * *"

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive passed lessons
        shell: python
        run: |
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          schedule_file = Path("group_schedules/164606.json")
          archive_file = Path("archive.json")

          if not schedule_file.exists():
              raise SystemExit("group_schedules/164606.json not found")

          if not archive_file.exists():
              archive_file.write_text("[]", encoding="utf-8")

          with schedule_file.open("r", encoding="utf-8") as f:
              source = json.load(f)

          with archive_file.open("r", encoding="utf-8") as f:
              archive = json.load(f)

          # group_schedules/164606.json хранится как объект
          # {"id": "164606", "name": "МеждОт25-2", "lessons": [...]}
          if isinstance(source, dict):
              schedule = source.get("lessons", [])
          elif isinstance(source, list):
              schedule = source
          else:
              raise SystemExit("group_schedules/164606.json has invalid format")

          if not isinstance(schedule, list):
              raise SystemExit("group_schedules/164606.json lessons must be an array")

          if not isinstance(archive, list):
              raise SystemExit("archive.json must contain an array")

          today = datetime.now(
              ZoneInfo("Europe/Moscow")
          ).date().isoformat()

          def lesson_key(lesson):
              return (
                  lesson.get("date", ""),
                  lesson.get("beginLesson", ""),
                  lesson.get("endLesson", ""),
                  lesson.get("discipline", ""),
                  lesson.get("lecturer", ""),
                  lesson.get("auditorium", ""),
                  lesson.get("building", ""),
                  lesson.get("typeLesson", ""),
                  lesson.get("lessonOid", "")
              )

          existing = {
              lesson_key(lesson)
              for lesson in archive
              if isinstance(lesson, dict)
          }

          added = 0

          for lesson in schedule:
              if not isinstance(lesson, dict):
                  continue

              lesson_date = lesson.get("date")

              if not lesson_date or lesson_date >= today:
                  continue

              key = lesson_key(lesson)

              if key in existing:
                  continue

              archive.append(lesson)
              existing.add(key)
              added += 1

          archive.sort(
              key=lambda lesson: (
                  lesson.get("date", ""),
                  lesson.get("beginLesson", "")
              )
          )

          with archive_file.open("w", encoding="utf-8") as f:
              json.dump(
                  archive,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print(f"Today's date in Moscow: {today}")
          print(f"New lessons archived: {added}")
          print(f"Total archived lessons: {len(archive)}")

      - name: Save archive to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive.json

          if git diff --cached --quiet; then
            echo "No new lessons to archive"
            exit 0
          fi

          git commit -m "Update lesson archive"
          git push
