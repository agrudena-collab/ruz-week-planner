name: RUZ Daily Schedule

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Update groups catalog
        run: python groups_loader.py

      - name: Build schedules for all groups
        run: python build_group_schedules.py

      - name: Save previous schedule
        run: |
          git show HEAD:schedule.json > schedule_previous.json 2>/dev/null || echo '[]' > schedule_previous.json

      - name: Run RUZ client
        run: python ruz_client.py

      - name: Validate schedule output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("schedule.json")
          if not path.exists():
              raise SystemExit("schedule.json was not created")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"schedule.json is invalid JSON: {exc}")

          if not isinstance(data, list) or not data:
              raise SystemExit("schedule.json must contain a non-empty array")

          group_schedules = Path("group_schedules.json")
          if not group_schedules.exists():
              raise SystemExit("group_schedules.json was not created")

          multi = json.loads(group_schedules.read_text(encoding="utf-8"))
          if not isinstance(multi, dict) or not isinstance(multi.get("groups"), dict) or not multi["groups"]:
              raise SystemExit("group_schedules.json must contain a non-empty groups object")

          print(f"Validated current schedule: {len(data)} lessons")
          print(f"Validated group schedules: {len(multi['groups'])} groups")
          PY

      - name: Run planner
        run: python planner.py

      - name: Detect schedule changes
        run: python changes_detector.py

      - name: Install schedule changes view
        run: python inject_changes_view.py

      - name: Save schedule and changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add groups.json group_schedules.json schedule.json changes.json index.html
          git diff --cached --quiet || git commit -m "Update groups, schedules and changes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
