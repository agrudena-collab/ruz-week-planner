name: RUZ Daily Schedule

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Validate Python sources
        run: python -m py_compile groups_loader.py build_group_schedules.py ruz_client.py planner.py changes_detector.py repair_group_picker.py inject_changes_view.py

      - name: Update groups catalog
        run: python groups_loader.py

      - name: Build schedules for all groups
        run: python build_group_schedules.py

      - name: Save previous schedule
        run: |
          git show HEAD:schedule.json > schedule_previous.json 2>/dev/null || echo '[]' > schedule_previous.json

      - name: Run RUZ client
        run: python ruz_client.py

      - name: Validate schedule output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schedule = Path("schedule.json")
          if not schedule.exists():
              raise SystemExit("schedule.json was not created")
          data = json.loads(schedule.read_text(encoding="utf-8"))
          if not isinstance(data, list) or not data:
              raise SystemExit("schedule.json must contain a non-empty array")

          combined = Path("group_schedules.json")
          if not combined.exists():
              raise SystemExit("group_schedules.json was not created")
          multi = json.loads(combined.read_text(encoding="utf-8"))
          if not isinstance(multi, dict) or not isinstance(multi.get("groups"), dict) or not multi["groups"]:
              raise SystemExit("group_schedules.json must contain a non-empty groups object")

          groups = json.loads(Path("groups.json").read_text(encoding="utf-8"))
          lazy_dir = Path("group_schedules")
          if not lazy_dir.is_dir():
              raise SystemExit("group_schedules/ directory was not created")

          missing = []
          invalid = []
          for group in groups:
              path = lazy_dir / f"{group['id']}.json"
              if not path.exists():
                  missing.append(str(group['id']))
                  continue
              try:
                  item = json.loads(path.read_text(encoding="utf-8"))
                  if str(item.get("id")) != str(group["id"]) or not isinstance(item.get("lessons"), list):
                      invalid.append(str(group['id']))
              except json.JSONDecodeError:
                  invalid.append(str(group['id']))

          if missing:
              raise SystemExit(f"Missing per-group schedule files: {missing[:10]}")
          if invalid:
              raise SystemExit(f"Invalid per-group schedule files: {invalid[:10]}")

          print(f"Validated current schedule: {len(data)} lessons")
          print(f"Validated group schedules: {len(multi['groups'])} groups")
          print(f"Validated lazy-load files: {len(groups)} groups")
          PY

      - name: Run planner
        run: python planner.py

      - name: Detect schedule changes
        run: python changes_detector.py

      - name: Install schedule changes view
        run: python inject_changes_view.py

      - name: Install native group selector
        run: python repair_group_picker.py

      - name: Validate generated frontend
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          if html.count('id="groupPickerButton"') != 1:
              raise SystemExit("groupPickerButton must exist exactly once")
          if '<select class="group-picker" id="groupPickerButton"' not in html:
              raise SystemExit("native group selector is missing")
          if html.count("GROUP_PICKER_NATIVE") != 2:
              raise SystemExit("native group selector markers are missing or duplicated")

          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")

          for index, script in enumerate(scripts):
              path = Path(f"/tmp/index-script-{index}.js")
              path.write_text(script, encoding="utf-8")
              result = subprocess.run(["node", "--check", str(path)], text=True, capture_output=True)
              if result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(f"JavaScript syntax error in inline script {index}")

          print(f"Validated {len(scripts)} inline JavaScript blocks")
          PY

      - name: Save schedule and changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add groups.json group_schedules.json group_schedules schedule.json changes.json index.html
          git diff --cached --quiet || git commit -m "Update groups, schedules and changes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
