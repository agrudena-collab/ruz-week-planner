name: Test RUZ

on:
  workflow_dispatch:

jobs:
  test-ruz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Run RUZ client
        run: python ruz_client.py
