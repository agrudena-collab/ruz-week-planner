name: RUZ Daily Schedule

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Update groups catalog
        run: python groups_loader.py

      - name: Save previous schedule
        run: |
          git show HEAD:schedule.json > schedule_previous.json 2>/dev/null || echo '[]' > schedule_previous.json

      - name: Run RUZ client
        run: python ruz_client.py

      - name: Run planner
        run: python planner.py

      - name: Detect schedule changes
        run: python changes_detector.py

      - name: Install schedule changes view
        run: python inject_changes_view.py

      - name: Save schedule and changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add groups.json schedule.json changes.json index.html
          git diff --cached --quiet || git commit -m "Update groups, schedule and changes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
