name: RUZ Daily Schedule

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Validate Python sources
        run: python -m py_compile groups_loader.py build_group_schedules.py ruz_client.py planner.py changes_detector.py repair_group_picker.py inject_changes_view.py

      - name: Update groups catalog
        run: python groups_loader.py

      - name: Build schedules for all groups
        run: python build_group_schedules.py

      - name: Save previous schedule
        run: |
          git show HEAD:schedule.json > schedule_previous.json 2>/dev/null || echo '[]' > schedule_previous.json

      - name: Run RUZ client
        run: python ruz_client.py

      - name: Validate schedule output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schedule = Path("schedule.json")
          if not schedule.exists():
              raise SystemExit("schedule.json was not created")
          data = json.loads(schedule.read_text(encoding="utf-8"))
          if not isinstance(data, list) or not data:
              raise SystemExit("schedule.json must contain a non-empty array")

          combined = Path("group_schedules.json")
          if not combined.exists():
              raise SystemExit("group_schedules.json was not created")
          multi = json.loads(combined.read_text(encoding="utf-8"))
          if not isinstance(multi, dict) or not isinstance(multi.get("groups"), dict) or not multi["groups"]:
              raise SystemExit("group_schedules.json must contain a non-empty groups object")

          groups = json.loads(Path("groups.json").read_text(encoding="utf-8"))
          if not isinstance(groups, list) or not groups:
              raise SystemExit("groups.json must contain a non-empty array")

          lazy_dir = Path("group_schedules")
          if not lazy_dir.is_dir():
              raise SystemExit("group_schedules/ directory was not created")

          expected_ids = {str(group["id"]) for group in groups}
          actual_ids = {str(group_id) for group_id in multi["groups"].keys()}
          if actual_ids != expected_ids:
              missing = sorted(expected_ids - actual_ids)
              extra = sorted(actual_ids - expected_ids)
              raise SystemExit(f"Combined group IDs mismatch; missing={missing[:10]} extra={extra[:10]}")

          missing = []
          invalid = []
          for group in groups:
              group_id = str(group["id"])
              path = lazy_dir / f"{group_id}.json"
              if not path.exists():
                  missing.append(group_id)
                  continue
              try:
                  item = json.loads(path.read_text(encoding="utf-8"))
                  if str(item.get("id")) != group_id:
                      invalid.append(f"{group_id}: id")
                  if str(item.get("name")) != str(group["name"]):
                      invalid.append(f"{group_id}: name")
                  if not isinstance(item.get("lessons"), list):
                      invalid.append(f"{group_id}: lessons")
              except json.JSONDecodeError:
                  invalid.append(f"{group_id}: invalid JSON")

          if missing:
              raise SystemExit(f"Missing per-group schedule files: {missing[:10]}")
          if invalid:
              raise SystemExit(f"Invalid per-group schedule files: {invalid[:10]}")

          failures = multi.get("failed", [])
          if not isinstance(failures, list):
              raise SystemExit("group_schedules.json failed field must be an array")
          fallback_count = sum(1 for item in failures if isinstance(item, dict) and item.get("fallback"))
          hard_failures = [item for item in failures if not isinstance(item, dict) or not item.get("fallback")]
          if hard_failures:
              raise SystemExit(f"Groups without current or fallback schedule: {hard_failures[:5]}")

          print(f"Validated current schedule: {len(data)} lessons")
          print(f"Validated group schedules: {len(multi['groups'])} groups")
          print(f"Validated lazy-load files: {len(groups)} groups")
          print(f"RUZ fallback schedules in use: {fallback_count}")

      - name: Run planner
        run: python planner.py

      - name: Detect schedule changes
        run: python changes_detector.py

      - name: Install schedule changes view
        run: python inject_changes_view.py

      - name: Install native group selector
        run: python repair_group_picker.py

      - name: Validate generated frontend
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          groups = json.loads(Path("groups.json").read_text(encoding="utf-8"))
          if html.count('id="groupPickerButton"') != 1:
              raise SystemExit("groupPickerButton must exist exactly once")
          if '<select class="group-picker" id="groupPickerButton"' not in html:
              raise SystemExit("native group selector is missing")

          options = re.findall(r'<option value="([^"]+)"(?: selected)?>(.*?)</option>', html, flags=re.S | re.I)
          expected_ids = {str(group["id"]) for group in groups}
          option_ids = {value for value, _ in options}
          if option_ids != expected_ids:
              missing = sorted(expected_ids - option_ids)
              extra = sorted(option_ids - expected_ids)
              raise SystemExit(f"Frontend group options mismatch; missing={missing[:10]} extra={extra[:10]}")
          if len(options) != len(groups):
              raise SystemExit(f"Frontend group option count mismatch: {len(options)} != {len(groups)}")

          if '<option value="164606" selected>' not in html:
              raise SystemExit("Default group 164606 is missing from the native selector")

          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")

          for index, script in enumerate(scripts):
              path = Path(f"/tmp/index-script-{index}.js")
              path.write_text(script, encoding="utf-8")
              result = subprocess.run(["node", "--check", str(path)], text=True, capture_output=True)
              if result.returncode != 0:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(f"JavaScript syntax error in inline script {index}")

          print(f"Validated one native group selector, {len(options)} group options and {len(scripts)} inline JavaScript blocks")
          PY

      - name: Save schedule and changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add groups.json group_schedules.json group_schedules schedule.json changes.json index.html
          git diff --cached --quiet || git commit -m "Update groups, schedules and changes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
