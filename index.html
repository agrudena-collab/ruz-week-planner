<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Расписание — МеждОт25-2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 32px;
    }

    .subtitle {
      color: #6e6e73;
      font-size: 16px;
    }

    .updated {
      color: #6e6e73;
      font-size: 13px;
      margin-top: 7px;
    }

    /* Кнопки */

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: #e5e5ea;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 24px;
      position: sticky;
      top: 8px;
      z-index: 10;
    }

    .tab {
      border: none;
      background: transparent;
      color: #6e6e73;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 4px;
      border-radius: 11px;
      cursor: pointer;
      transition: 0.15s;
    }

    .tab.active {
      background: white;
      color: #1d1d1f;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .tab:active {
      transform: scale(0.97);
    }

    /* Дни */

    .day {
      margin-bottom: 28px;
    }

    .date {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: capitalize;
    }

    .today-label {
      display: inline-block;
      background: #007aff;
      color: white;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Пара */

    .lesson {
      background: white;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.055);
    }

    .time {
      font-size: 15px;
      font-weight: 700;
      color: #007aff;
      margin-bottom: 7px;
    }

    .discipline {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .info {
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.65;
    }

    .empty {
      text-align: center;
      color: #6e6e73;
      padding: 55px 20px;
      font-size: 16px;
    }

    .error {
      background: #fff0f0;
      color: #c00;
      padding: 16px;
      border-radius: 12px;
    }

    .loading {
      text-align: center;
      color: #6e6e73;
      padding: 50px 0;
    }

    /* Кнопка обновления */

    .refresh {
      border: none;
      background: #007aff;
      color: white;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 15px;
      border-radius: 11px;
      cursor: pointer;
      float: right;
      margin-top: -48px;
    }

    .refresh:active {
      transform: scale(0.97);
    }

    @media (max-width: 650px) {

      .container {
        padding: 20px 14px 40px;
      }

      h1 {
        font-size: 28px;
      }

      .tabs {
        grid-template-columns: repeat(5, 1fr);
      }

      .tab {
        font-size: 12px;
        padding: 10px 2px;
      }

      .date {
        font-size: 20px;
      }

      .lesson {
        padding: 15px;
      }

      .discipline {
        font-size: 17px;
      }

      .refresh {
        margin-top: -45px;
        font-size: 14px;
      }
    }

    @media (max-width: 420px) {

      .tab {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>

    <h1>Расписание</h1>

    <div class="subtitle">
      МеждОт25-2
    </div>

    <div class="updated" id="updated">
      Загружаем расписание...
    </div>

    <button class="refresh" onclick="loadSchedule()">
      ↻ Обновить
    </button>

  </header>


  <!-- НАВИГАЦИЯ -->

  <div class="tabs">

    <button
      class="tab active"
      data-mode="nearest"
      onclick="setMode('nearest')">
      Ближайшее
    </button>

    <button
      class="tab"
      data-mode="today"
      onclick="setMode('today')">
      Сегодня
    </button>

    <button
      class="tab"
      data-mode="tomorrow"
      onclick="setMode('tomorrow')">
      Завтра
    </button>

    <button
      class="tab"
      data-mode="week"
      onclick="setMode('week')">
      Неделя
    </button>

    <button
      class="tab"
      data-mode="month"
      onclick="setMode('month')">
      Месяц
    </button>

  </div>


  <main id="schedule">

    <div class="loading">
      Загружаем расписание...
    </div>

  </main>

</div>


<script>

  let allLessons = [];

  let currentMode = "nearest";


  /* --------------------------------------------------
     ТЕКУЩАЯ ДАТА
     -------------------------------------------------- */

  function getLocalDate() {

    const now = new Date();

    const year = now.getFullYear();

    const month = String(now.getMonth() + 1).padStart(2, "0");

    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  /* --------------------------------------------------
     ДОБАВИТЬ ДНИ К ДАТЕ
     -------------------------------------------------- */

  function addDays(dateString, days) {

    const date = new Date(dateString + "T12:00:00");

    date.setDate(date.getDate() + days);

    const year = date.getFullYear();

    const month = String(date.getMonth() + 1).padStart(2, "0");

    const day = String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  /* --------------------------------------------------
     ФОРМАТ ДАТЫ
     -------------------------------------------------- */

  function formatDate(dateString) {

    const date = new Date(dateString + "T12:00:00");

    return date.toLocaleDateString(
      "ru-RU",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );
  }


  /* --------------------------------------------------
     ЗАГРУЗКА
     -------------------------------------------------- */

  async function loadSchedule() {

    const container = document.getElementById("schedule");

    const updated = document.getElementById("updated");

    container.innerHTML = `
      <div class="loading">
        Загружаем расписание...
      </div>
    `;

    try {

      /*
       * timestamp нужен, чтобы браузер не показывал
       * старый закэшированный schedule.json.
       */

      const response = await fetch(
        "schedule.json?t=" + Date.now()
      );

      if (!response.ok) {

        throw new Error(
          "Не удалось загрузить schedule.json"
        );

      }

      const schedule = await response.json();


      if (!Array.isArray(schedule)) {

        throw new Error(
          "schedule.json имеет неправильный формат"
        );

      }


      allLessons = schedule
        .filter(lesson => lesson.date)
        .sort((a, b) => {

          const dateCompare =
            a.date.localeCompare(b.date);

          if (dateCompare !== 0) {
            return dateCompare;
          }

          return (
            (a.beginLesson || "")
              .localeCompare(
                b.beginLesson || ""
              )
          );

        });


      updated.textContent =
        "Актуальное расписание • обновлено сейчас";


      render();


    } catch (error) {

      container.innerHTML = `
        <div class="error">
          <strong>Ошибка загрузки расписания</strong>
          <br><br>
          ${error.message}
        </div>
      `;

      updated.textContent =
        "Не удалось обновить расписание";

      console.error(error);

    }

  }


  /* --------------------------------------------------
     ПЕРЕКЛЮЧЕНИЕ РЕЖИМА
     -------------------------------------------------- */

  function setMode(mode) {

    currentMode = mode;


    document
      .querySelectorAll(".tab")
      .forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.mode === mode
        );

      });


    render();

  }


  /* --------------------------------------------------
     ПОЛУЧЕНИЕ ДАТ ДЛЯ РЕЖИМА
     -------------------------------------------------- */

  function getFilteredLessons() {

    if (!allLessons.length) {
      return [];
    }


    const today = getLocalDate();


    /* БЛИЖАЙШЕЕ */

    if (currentMode === "nearest") {

      const futureDates = [
        ...new Set(
          allLessons
            .map(lesson => lesson.date)
            .filter(date => date >= today)
        )
      ].sort();


      if (!futureDates.length) {
        return [];
      }


      const nearestDate = futureDates[0];


      return allLessons.filter(
        lesson => lesson.date === nearestDate
      );

    }


    /* СЕГОДНЯ */

    if (currentMode === "today") {

      return allLessons.filter(
        lesson => lesson.date === today
      );

    }


    /* ЗАВТРА */

    if (currentMode === "tomorrow") {

      const tomorrow = addDays(today, 1);

      return allLessons.filter(
        lesson => lesson.date === tomorrow
      );

    }


    /* НЕДЕЛЯ */

    if (currentMode === "week") {

      const endDate = addDays(today, 6);

      return allLessons.filter(
        lesson =>
          lesson.date >= today &&
          lesson.date <= endDate
      );

    }


    /* МЕСЯЦ */

    if (currentMode === "month") {

      const endDate = addDays(today, 29);

      return allLessons.filter(
        lesson =>
          lesson.date >= today &&
          lesson.date <= endDate
      );

    }


    return [];

  }


  /* --------------------------------------------------
     ОТОБРАЖЕНИЕ
     -------------------------------------------------- */

  function render() {

    const container =
      document.getElementById("schedule");


    const lessons =
      getFilteredLessons();


    if (!lessons.length) {

      let message =
        "Занятий нет.";


      if (currentMode === "nearest") {

        message =
          "Ближайших занятий нет.";

      }

      if (currentMode === "today") {

        message =
          "Сегодня занятий нет.";

      }

      if (currentMode === "tomorrow") {

        message =
          "Завтра занятий нет.";

      }

      if (currentMode === "week") {

        message =
          "На ближайшие 7 дней занятий нет.";

      }

      if (currentMode === "month") {

        message =
          "На ближайшие 30 дней занятий нет.";

      }


      container.innerHTML = `
        <div class="empty">
          ${message}
        </div>
      `;

      return;

    }


    /*
     * Группируем занятия по датам.
     */

    const grouped = {};


    for (const lesson of lessons) {

      if (!grouped[lesson.date]) {

        grouped[lesson.date] = [];

      }

      grouped[lesson.date].push(lesson);

    }


    const dates =
      Object.keys(grouped).sort();


    container.innerHTML = "";


    const today = getLocalDate();


    for (const date of dates) {

      const day =
        document.createElement("section");

      day.className = "day";


      const isToday =
        date === today;


      day.innerHTML = `
        <div class="date">

          ${formatDate(date)}

          ${
            isToday
              ? '<span class="today-label">СЕГОДНЯ</span>'
              : ""
          }

        </div>
      `;


      /*
       * Сортируем пары по времени.
       */

      grouped[date].sort(
        (a, b) =>
          (a.beginLesson || "")
            .localeCompare(
              b.beginLesson || ""
            )
      );


      for (
        const lesson
        of grouped[date]
      ) {

        const lessonElement =
          document.createElement("div");

        lessonElement.className =
          "lesson";


        const begin =
          lesson.beginLesson || "";


        const end =
          lesson.endLesson || "";


        const discipline =
          lesson.discipline ||
          "Предмет не указан";


        const lecturer =
          lesson.lecturer ||
          "Преподаватель не указан";


        const auditorium =
          lesson.auditorium || "";


        const building =
          lesson.building || "";


        lessonElement.innerHTML = `

          <div class="time">
            ${begin}–${end}
          </div>

          <div class="discipline">
            ${discipline}
          </div>

          <div class="info">

            👨‍🏫 ${lecturer}

            ${
              auditorium
                ? `<br>🏫 ${auditorium}`
                : ""
            }

            ${
              building
                ? `<br>📍 ${building}`
                : ""
            }

          </div>

        `;


        day.appendChild(
          lessonElement
        );

      }


      container.appendChild(day);

    }

  }


  /* --------------------------------------------------
     СТАРТ
     -------------------------------------------------- */

  loadSchedule();

</script>

</body>
</html>
