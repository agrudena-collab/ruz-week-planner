<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Расписание">
<meta name="theme-color" content="#07090f">
<link rel="apple-touch-icon" href="icon.png">
<title>Расписание · МеждОт25-2</title>

<style>
:root{
  --bg:#07090f;
  --text:#f7f8fb;
  --muted:#8e96a8;
  --line:rgba(255,255,255,.09);
  --blue:#4f8cff;
  --purple:#9b6cff;
  --green:#27df91;
  --yellow:#ffd166;
  --pink:#ff5ca8;
  --cyan:#42d9ff;
  --shadow:0 25px 70px rgba(0,0,0,.35)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 15% 0%,rgba(79,140,255,.22),transparent 28%),
    radial-gradient(circle at 90% 15%,rgba(155,108,255,.18),transparent 25%),
    var(--bg);
  min-height:100vh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom)
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.28;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:38px 38px
}

button,input,select{font:inherit}

.container{
  width:min(1050px,calc(100% - 28px));
  margin:auto;
  padding:18px 0 80px
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px
}

.brand{
  display:flex;
  align-items:center;
  gap:13px
}

.menu-button{
  width:50px;
  height:50px;
  border:1px solid var(--line);
  border-radius:17px;
  background:
    linear-gradient(
      135deg,
      rgba(79,140,255,.25),
      rgba(155,108,255,.25)
    );
  color:#fff;
  display:grid;
  place-items:center;
  font-size:25px;
  cursor:pointer;
  box-shadow:0 10px 35px rgba(79,140,255,.18);
  transition:.2s
}

.menu-button:active{
  transform:scale(.94)
}

.title{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px
}

.group{
  color:var(--muted);
  font-weight:650;
  margin-top:3px
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px
}

.updated{
  color:var(--muted);
  font-size:12px
}

.refresh{
  border:0;
  border-radius:14px;
  padding:11px 14px;
  background:#fff;
  color:#080a0f;
  font-weight:800;
  cursor:pointer
}

.refresh.loading{
  opacity:.55
}

/* =========================
   MENU
========================= */

.menu-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(7px);
  opacity:0;
  pointer-events:none;
  transition:.25s
}

.menu-overlay.open{
  opacity:1;
  pointer-events:auto
}

.side-menu{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:101;
  width:min(380px,88vw);
  background:linear-gradient(160deg,#101421,#090b12);
  border-right:1px solid rgba(255,255,255,.08);
  box-shadow:25px 0 70px rgba(0,0,0,.45);
  transform:translateX(-105%);
  transition:transform .28s cubic-bezier(.22,.8,.25,1);
  padding:
    calc(20px + env(safe-area-inset-top))
    20px
    calc(20px + env(safe-area-inset-bottom))
}

.side-menu.open{
  transform:translateX(0)
}

.menu-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px
}

.menu-title{
  font-size:25px;
  font-weight:900
}

.menu-close{
  width:44px;
  height:44px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.055);
  color:#fff;
  font-size:25px;
  cursor:pointer
}

.menu-list{
  display:flex;
  flex-direction:column;
  gap:7px
}

.menu-item{
  width:100%;
  border:0;
  background:transparent;
  color:#b9c0ce;
  text-align:left;
  padding:14px 16px;
  border-radius:15px;
  font-size:17px;
  font-weight:800;
  cursor:pointer
}

.menu-item:hover{
  color:#fff;
  background:rgba(255,255,255,.055)
}

.menu-item.active{
  color:#111;
  background:#fff;
  box-shadow:0 7px 25px rgba(255,255,255,.1)
}

.menu-divider{
  height:1px;
  background:var(--line);
  margin:8px 0
}

.menu-footer{
  position:absolute;
  left:20px;
  right:20px;
  bottom:calc(20px + env(safe-area-inset-bottom));
  color:#606878;
  text-align:center;
  font-size:11px
}

/* =========================
   HERO
========================= */

.hero{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:30px;
  padding:30px;
  margin-bottom:13px;
  background:
    linear-gradient(
      135deg,
      rgba(24,30,47,.96),
      rgba(12,15,25,.92)
    );
  box-shadow:var(--shadow);
  backdrop-filter:blur(20px)
}

.hero:after{
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  border-radius:50%;
  right:-130px;
  top:-170px;
  background:
    radial-gradient(
      circle,
      rgba(79,140,255,.35),
      transparent 65%
    );
  filter:blur(5px)
}

.hero-content{
  position:relative;
  z-index:1
}

.eyebrow{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:var(--cyan);
  font-weight:900;
  margin-bottom:12px
}

.live{
  display:inline-flex;
  align-items:center;
  gap:8px;
  color:#07120d;
  background:var(--green);
  padding:7px 10px;
  border-radius:10px;
  font-size:11px;
  font-weight:900;
  margin-bottom:12px
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#07120d
}

.hero-time{
  font-size:58px;
  line-height:1;
  font-weight:950;
  letter-spacing:-3px;
  margin-bottom:12px
}

.hero-subject{
  font-size:28px;
  font-weight:900;
  max-width:750px;
  margin-bottom:12px
}

.hero-countdown{
  display:inline-flex;
  align-items:center;
  gap:9px;
  margin-bottom:18px;
  padding:10px 13px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(255,255,255,.065);
  color:#cbd1dd;
  font-size:13px;
  font-weight:800
}

.hero-countdown strong{
  color:var(--green);
  font-size:17px;
  font-variant-numeric:tabular-nums
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px
}

.chip{
  padding:9px 11px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.055);
  border-radius:12px;
  color:#cbd1dd;
  font-size:13px;
  font-weight:650
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px
}

.stat{
  border:1px solid var(--line);
  background:rgba(16,19,28,.78);
  border-radius:20px;
  padding:17px;
  box-shadow:0 12px 30px rgba(0,0,0,.18)
}

.stat-value{
  font-size:25px;
  font-weight:900
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-top:4px
}

/* =========================
   SEARCH / FILTER
========================= */

.toolbar{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:9px;
  margin-bottom:14px
}

.search{
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:11px 13px;
  background:rgba(16,19,28,.82);
  border:1px solid var(--line);
  border-radius:14px
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:14px
}

.search input::placeholder{
  color:#697184
}

.filter-select{
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(16,19,28,.82);
  color:#dce2ed;
  padding:0 12px;
  outline:0;
  min-width:130px
}

.clear-btn{
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.055);
  color:#b9c0ce;
  padding:0 14px;
  cursor:pointer
}

.clear-btn:hover{
  color:#fff
}

/* =========================
   DATE NAVIGATION
========================= */

.date-nav{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:22px
}

.date-nav button{
  width:43px;
  height:40px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.055);
  color:#fff;
  cursor:pointer
}

.date-nav button:active{
  transform:scale(.96)
}

.date-nav-main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(16,19,28,.72);
  font-weight:850
}

.date-nav-main small{
  color:var(--muted);
  font-weight:650;
  margin-left:7px
}

/* =========================
   DAYS
========================= */

.day{
  margin-bottom:34px
}

.day-heading{
  display:flex;
  justify-content:space-between;
  align-items:end;
  padding:0 4px 11px
}

.weekday{
  font-size:23px;
  font-weight:900;
  text-transform:capitalize
}

.date{
  color:var(--muted);
  font-size:13px;
  margin-top:3px
}

.count{
  color:#b8c0cf;
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  padding:7px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:800
}

/* =========================
   LESSON CARDS
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px
}

.lesson{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  background:
    linear-gradient(
      145deg,
      rgba(20,24,35,.96),
      rgba(12,15,23,.92)
    );
  box-shadow:0 14px 35px rgba(0,0,0,.2);
  transition:.2s
}

.lesson:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,.18)
}

.lesson:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--accent,var(--blue))
}

.lesson:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  right:-90px;
  bottom:-100px;
  background:var(--accent,var(--blue));
  opacity:.12;
  filter:blur(15px)
}

.lesson.current{
  border-color:rgba(39,223,145,.60);
  box-shadow:
    0 0 0 1px rgba(39,223,145,.14),
    0 20px 55px rgba(39,223,145,.12)
}

.lesson.future{
  border-color:rgba(79,140,255,.13)
}

.lesson.ended{
  opacity:.55;
  filter:saturate(.65)
}

.lesson-top{
  display:flex;
  justify-content:space-between;
  gap:12px
}

.time{
  color:var(--accent,var(--blue));
  font-weight:900;
  font-size:15px
}

.subject{
  font-size:20px;
  font-weight:900;
  line-height:1.18;
  margin:9px 0 8px;
  max-width:90%
}

/* =========================
   TYPES
========================= */

.lesson-type{
  display:inline-flex;
  align-items:center;
  width:max-content;
  margin-bottom:13px;
  padding:6px 9px;
  border-radius:9px;
  font-size:10px;
  font-weight:900;
  color:#dce2ed;
  background:rgba(255,255,255,.065);
  border:1px solid rgba(255,255,255,.08)
}

.lesson-type.lecture{
  color:#8fc0ff;
  background:rgba(79,140,255,.11);
  border-color:rgba(79,140,255,.18)
}

.lesson-type.seminar{
  color:#c4a5ff;
  background:rgba(155,108,255,.11);
  border-color:rgba(155,108,255,.18)
}

.lesson-type.military{
  color:#7ff0bd;
  background:rgba(39,223,145,.10);
  border-color:rgba(39,223,145,.18)
}

/* =========================
   STATUS
========================= */

.badge{
  height:max-content;
  padding:6px 8px;
  border-radius:9px;
  font-size:9px;
  font-weight:950;
  white-space:nowrap
}

.badge.now{
  color:#07120d;
  background:var(--green);
  box-shadow:0 0 15px rgba(39,223,145,.18)
}

.badge.future{
  color:#aebfff;
  background:rgba(79,140,255,.14);
  border:1px solid rgba(79,140,255,.22)
}

.badge.done{
  color:#aeb6c5;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.08)
}
/* =========================
   META
========================= */

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.meta span{
  font-size:11px;
  color:#aeb6c5;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.06);
  padding:7px 9px;
  border-radius:10px
}

/* =========================
   EXAMS
========================= */

.exam-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px
}

.exam-card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px;
  padding:20px;
  background:
    linear-gradient(
      145deg,
      rgba(31,25,48,.96),
      rgba(14,14,24,.94)
    );
  box-shadow:0 14px 35px rgba(0,0,0,.2)
}

.exam-card:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--purple)
}

.exam-date{
  color:#c4a5ff;
  font-size:12px;
  font-weight:850;
  margin-bottom:10px;
  text-transform:capitalize
}

.exam-time{
  color:#9b6cff;
  font-size:15px;
  font-weight:900;
  margin-bottom:8px
}

.exam-subject{
  font-size:21px;
  font-weight:900;
  line-height:1.18;
  margin-bottom:10px
}

.exam-type{
  display:inline-flex;
  width:max-content;
  padding:7px 9px;
  border-radius:10px;
  color:#d8c9ff;
  background:rgba(155,108,255,.11);
  border:1px solid rgba(155,108,255,.18);
  font-size:11px;
  font-weight:850;
  margin-bottom:13px
}

.exam-meta{
  display:flex;
  flex-wrap:wrap;
  gap:7px
}

.exam-meta span{
  font-size:11px;
  color:#aeb6c5;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.06);
  padding:7px 9px;
  border-radius:10px
}

/* =========================
   SCHEDULE CHANGES
========================= */

.changes-list{
  display:grid;
  gap:11px
}

.change-card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px;
  padding:18px;
  background:
    linear-gradient(
      145deg,
      rgba(24,28,40,.96),
      rgba(12,15,23,.94)
    );
  box-shadow:0 14px 35px rgba(0,0,0,.2)
}

.change-card:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--cyan)
}

.change-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px
}

.change-subject{
  font-size:19px;
  font-weight:900;
  line-height:1.2
}

.change-date{
  color:var(--muted);
  font-size:12px;
  margin-top:4px
}

.change-badge{
  flex:none;
  padding:6px 8px;
  border-radius:9px;
  color:#07120d;
  background:var(--cyan);
  font-size:9px;
  font-weight:950;
  white-space:nowrap
}

.change-row{
  display:grid;
  grid-template-columns:110px 1fr;
  gap:10px;
  padding:10px 0;
  border-top:1px solid var(--line)
}

.change-label{
  color:#aeb6c5;
  font-size:12px;
  font-weight:800
}

.change-values{
  min-width:0;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:7px;
  font-size:12px
}

.change-old{
  color:#9da5b5;
  text-decoration:line-through;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.06);
  padding:6px 8px;
  border-radius:9px
}

.change-new{
  color:#dfffee;
  background:rgba(39,223,145,.10);
  border:1px solid rgba(39,223,145,.18);
  padding:6px 8px;
  border-radius:9px
}

.change-arrow{
  color:#697184
}

/* =========================
   ARCHIVE / EMPTY
========================= */

.archive-header{
  margin-bottom:20px
}

.archive-title{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px
}

.archive-subtitle{
  color:var(--muted);
  margin-top:5px;
  font-size:13px
}

.empty,
.error{
  padding:45px 20px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:22px;
  background:rgba(16,19,28,.75);
  color:var(--muted)
}

.empty strong,
.error strong{
  display:block;
  color:var(--text);
  font-size:19px;
  margin-bottom:7px
}

.source{
  text-align:center;
  color:#606878;
  font-size:11px;
  margin-top:35px
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .container{
    width:calc(100% - 18px);
    padding-top:10px
  }

  .menu-button{
    width:44px;
    height:44px;
    border-radius:14px;
    font-size:22px
  }

  .title{
    font-size:24px
  }

  .group{
    font-size:13px
  }

  .updated{
    display:none
  }

  .refresh{
    padding:10px 12px;
    font-size:12px
  }

  .hero{
    padding:21px;
    border-radius:24px
  }

  .hero-time{
    font-size:42px;
    letter-spacing:-2px
  }

  .hero-subject{
    font-size:22px
  }

  .hero-countdown{
    font-size:12px
  }

  .hero-countdown strong{
    font-size:15px
  }

  .stats{
    gap:7px
  }

  .stat{
    padding:13px;
    border-radius:16px
  }

  .stat-value{
    font-size:20px
  }

  .stat-label{
    font-size:10px
  }

  .toolbar{
    grid-template-columns:1fr 1fr
  }

  .search{
    grid-column:1/-1
  }

  .filter-select{
    min-width:0
  }

  .clear-btn{
    min-height:42px
  }

  .grid{
    grid-template-columns:1fr
  }

  .exam-grid{
    grid-template-columns:1fr
  }

  .change-row{
    grid-template-columns:1fr;
    gap:5px
  }

  .change-head{
    gap:8px
  }

  .change-subject{
    font-size:17px
  }

  .exam-card{
    border-radius:19px
  }

  .lesson{
    border-radius:19px
  }

  .weekday{
    font-size:22px
  }

  .side-menu{
    width:min(350px,86vw)
  }

  .date-nav-main{
    font-size:13px
  }

  .date-nav-main small{
    display:none
  }
}

@media(max-width:380px){

  .title{
    font-size:21px
  }

  .group{
    font-size:11px
  }

  .refresh{
    font-size:11px
  }

  .hero-time{
    font-size:36px
  }
}
</style>
</head>

<body>

<div
  class="menu-overlay"
  id="menuOverlay"
></div>


<aside
  class="side-menu"
  id="sideMenu"
>

  <div class="menu-header">

    <div class="menu-title">
      Расписание
    </div>

    <button
      class="menu-close"
      id="menuClose"
      aria-label="Закрыть меню"
    >

<script>  
 const TARGET_GROUP =
  "МеждОт25-2";


let schedule = [];

let archive = [];

let exams = [];

let changes = [];

let currentView =
  "nearest";

let selectedDate =
  new Date();

let searchText =
  "";

let typeFilter =
  "all";

let lastHeroKey =
  "";


/* =========================
   BASIC HELPERS
========================= */

const $ =
  id =>
    document.getElementById(
      id
    );


const pad =
  n =>
    String(n).padStart(
      2,
      "0"
    );


function localDateString(
  d = new Date()
){

  return (

    d.getFullYear()

    + "-"

    + pad(
      d.getMonth() + 1
    )

    + "-"

    + pad(
      d.getDate()
    )

  );

}


function addDays(
  d,
  n
){

  const x =
    new Date(d);

  x.setDate(
    x.getDate() + n
  );

  return x;

}


function dateFromString(
  v
){

  return new Date(
    v + "T00:00:00"
  );

}


function formatDate(
  v
){

  return dateFromString(
    v
  )
  .toLocaleDateString(
    "ru-RU",
    {
      day:"numeric",
      month:"long"
    }
  );

}


function formatFullDate(
  v
){

  return dateFromString(
    v
  )
  .toLocaleDateString(
    "ru-RU",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}


function formatWeekday(
  v
){

  return dateFromString(
    v
  )
  .toLocaleDateString(
    "ru-RU",
    {
      weekday:"long"
    }
  );

}


function esc(
  v
){

  return String(
    v ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


function dt(
  lesson,
  field
){

  return new Date(
    `${lesson.date}T${lesson[field]}:00`
  );

}


/* =========================
   STATUS
========================= */

function current(
  lesson
){

  const now =
    new Date();

  return (

    now >=
    dt(
      lesson,
      "beginLesson"
    )

    &&

    now <
    dt(
      lesson,
      "endLesson"
    )

  );

}


function ended(
  lesson
){

  return (

    new Date()
    >=
    dt(
      lesson,
      "endLesson"
    )

  );

}


function lessonStatus(
  lesson
){

  if(
    current(
      lesson
    )
  ){

    return "current";

  }


  if(
    ended(
      lesson
    )
  ){

    return "ended";

  }


  return "future";

}


/* =========================
   SORT
========================= */

function sort(
  lessons
){

  return [
    ...lessons
  ].sort(

    (
      a,
      b
    ) =>

      (
        a.date || ""
      )
      .localeCompare(
        b.date || ""
      )

      ||

      (
        a.beginLesson || ""
      )
      .localeCompare(
        b.beginLesson || ""
      )

  );

}


/* =========================
   COUNTDOWN
========================= */

function countdown(
  milliseconds
){

  let seconds =
    Math.max(
      0,
      Math.floor(
        milliseconds /
        1000
      )
    );


  const days =
    Math.floor(
      seconds /
      86400
    );


  seconds %=
    86400;


  const hours =
    Math.floor(
      seconds /
      3600
    );


  seconds %=
    3600;


  const minutes =
    Math.floor(
      seconds /
      60
    );


  seconds %=
    60;


  if(
    days
    > 0
  ){

    return (

      `${days}д ` +

      `${pad(
        hours
      )}ч ` +

      `${pad(
        minutes
      )}м`

    );

  }


  return (

    `${pad(
      hours
    )}:` +

    `${pad(
      minutes
    )}:` +

    `${pad(
      seconds
    )}`

  );

}


/* =========================
   LESSON TYPE
========================= */

function lessonType(
  lesson
){

  const raw =
    String(
      lesson.kindOfWork ??
      ""
    ).trim();


  if(
    !raw
  ){

    return null;

  }


  const value =
    raw.toLowerCase();


  if(
    value === "лекции"
    ||
    value === "лекция"
  ){

    return {

      text:
        "Лекция",

      className:
        "lecture",

      icon:
        "🎓",

      key:
        "lecture"

    };

  }


  if(
    value.includes(
      "практичес"
    )
    ||
    value.includes(
      "семинар"
    )
  ){

    return {

      text:
        "Семинар",

      className:
        "seminar",

      icon:
        "📝",

      key:
        "seminar"

    };

  }


  if(
    value.includes(
      "военная подготовка"
    )
  ){

    return {

      text:
        "Военная подготовка",

      className:
        "military",

      icon:
        "🪖",

      key:
        "military"

    };

  }


  return {

    text:
      raw,

    className:
      "",

    icon:
      "🎓",

    key:
      "other"

  };

}


/* =========================
   SUBJECT COLORS
========================= */

function accent(
  subject = ""
){

  const s =
    subject.toLowerCase();


  if(
    /статист|математ|анализ/
    .test(s)
  ){

    return "#9b6cff";

  }


  if(
    /китай|кит|язык/
    .test(s)
  ){

    return "#ff5ca8";

  }


  if(
    /англ|english/
    .test(s)
  ){

    return "#42d9ff";

  }


  if(
    /бух|учет|финанс/
    .test(s)
  ){

    return "#ffd166";

  }


  if(
    /военн|физ|спорт/
    .test(s)
  ){

    return "#27df91";

  }


  return "#4f8cff";

}


/* =========================
   GROUP FILTER
========================= */

function belongsToTargetGroup(
  lesson
){

  const group =
    String(
      lesson.group ??
      ""
    ).trim();


  if(
    group ===
    TARGET_GROUP
  ){

    return true;

  }


  const stream =
    String(
      lesson.stream ??
      ""
    )
    .replace(
      /[\[\]"']/g,
      ""
    );


  const parts =
    stream
      .split(
        /[;,]/
      )
      .map(
        value =>
          value.trim()
      )
      .filter(
        Boolean
      );


  return (

    parts.includes(
      TARGET_GROUP
    )

    ||

    stream.includes(
      TARGET_GROUP
    )

  );

}


/* =========================
   SEARCH FILTER
========================= */

function matchesFilters(
  lesson
){

  const type =
    lessonType(
      lesson
    );


  if(
    typeFilter !==
    "all"
  ){

    if(
      !type
      ||
      type.key !==
      typeFilter
    ){

      return false;

    }

  }


  if(
    !searchText
  ){

    return true;

  }


  const query =
    searchText.toLowerCase();


  return [

    lesson.discipline,

    lesson.lecturer,

    lesson.auditorium,

    lesson.building,

    lesson.kindOfWork

  ]

  .some(
    value =>
      String(
        value ?? ""
      )
      .toLowerCase()
      .includes(
        query
      )
  );

}


function filtered(
  lessons
){

  return lessons.filter(
    matchesFilters
  );

}


/* =========================
   NEXT LESSON
========================= */

function nextLesson(){

  const sorted =
    sort(
      schedule
    );


  const currentLesson =
    sorted.find(
      lesson =>
        current(
          lesson
        )
    );


  if(
    currentLesson
  ){

    return {

      lesson:
        currentLesson,

      current:
        true

    };

  }


  const future =
    sorted.find(
      lesson =>
        !ended(
          lesson
        )
    );


  if(
    future
  ){

    return {

      lesson:
        future,

      current:
        false

    };

  }


  return null;

}

/* =========================
   STATS
========================= */

function renderStats(){

  const today =
    localDateString();


  const lessons =
    schedule.filter(
      lesson =>
        lesson.date ===
        today
    );


  const minutes =
    lessons.reduce(

      (
        total,
        lesson
      ) =>

        total +

        Math.max(

          0,

          (
            dt(
              lesson,
              "endLesson"
            )

            -

            dt(
              lesson,
              "beginLesson"
            )
          )

          / 60000

        ),

      0

    );


  const hours =
    Math.floor(
      minutes /
      60
    );


  const mins =
    Math.round(
      minutes %
      60
    );


  const buildings =
    new Set(

      lessons

        .map(
          lesson =>
            lesson.building
        )

        .filter(
          Boolean
        )

    ).size;


  $(
    "stats"
  ).innerHTML = `

    <div class="stat">

      <div class="stat-value">

        ${lessons.length}

      </div>

      <div class="stat-label">

        пар сегодня

      </div>

    </div>


    <div class="stat">

      <div class="stat-value">

        ${
          hours
          ? `${hours}ч ${mins}м`
          : `${mins}м`
        }

      </div>

      <div class="stat-label">

        учебного времени

      </div>

    </div>


    <div class="stat">

      <div class="stat-value">

        ${buildings}

      </div>

      <div class="stat-label">

        корпуса сегодня

      </div>

    </div>

  `;

}


/* =========================
   STATUS BADGE
========================= */

function statusBadge(

){

   LESSON CARD

/* =========================
   GROUP + RENDER
========================= */

function groupAndRender(
  lessons
){

  const container =
    $(
      "schedule"
    );


  if(
    !lessons.length
  ){

    container.innerHTML = `

      <div class="empty">

        <strong>
          Занятий нет
        </strong>

        В выбранном периоде
        ничего не найдено.

      </div>

    `;

    return;

  }


  const grouped = {};


  lessons.forEach(
    lesson => {

      if(
        !grouped[
          lesson.date
        ]
      ){

        grouped[
          lesson.date
        ] = [];

      }


      grouped[
        lesson.date
      ].push(
        lesson
      );

    }
  );


  container.innerHTML =

    Object.keys(
      grouped
    )

    .sort()

    .map(

      date => `

        <section class="day">

          <div class="day-heading">

            <div>

              <div class="weekday">

                ${esc(
                  formatWeekday(
                    date
                  )
                )}

              </div>

              <div class="date">

                ${esc(
                  formatDate(
                    date
                  )
                )}

              </div>

            </div>


            <div class="count">

              ${
                grouped[
                  date
                ].length
              }

              ${
                grouped[
                  date
                ].length === 1
                ? "пара"
                : grouped[
                    date
                  ].length < 5
                ? "пары"
                : "пар"
              }

            </div>

          </div>


          <div class="grid">

            ${
              sort(
                grouped[
                  date
                ]
              )

              .map(
                lessonCard
              )

              .join("")
            }

          </div>

        </section>

      `

    )

    .join("");

} 
/* =========================
   DATE RANGE
========================= */

function getBaseLessons(){

  return schedule.filter(
    lesson =>
      belongsToTargetGroup(
        lesson
      )
  );

}


function getLessonsForDate(
  date
){

  const value =
    localDateString(
      date
    );


  return filtered(
    getBaseLessons()
      .filter(
        lesson =>
          lesson.date ===
          value
      )
  );

}


function getWeekStart(
  date
){

  const d =
    new Date(
      date
    );


  const day =
    d.getDay();


  const diff =
    day === 0
      ? -6
      : 1 - day;


  d.setDate(
    d.getDate() +
    diff
  );


  return d;

}


function getWeekLessons(
  date
){

  const start =
    getWeekStart(
      date
    );


  const end =
    addDays(
      start,
      6
    );


  const startValue =
    localDateString(
      start
    );


  const endValue =
    localDateString(
      end
    );


  return filtered(

    getBaseLessons()
      .filter(
        lesson =>
          lesson.date >=
          startValue
          &&
          lesson.date <=
          endValue
      )

  );

}


function getMonthLessons(
  date
){

  const year =
    date.getFullYear();


  const month =
    date.getMonth();


  return filtered(

    getBaseLessons()
      .filter(
        lesson => {

          const d =
            dateFromString(
              lesson.date
            );


          return (

            d.getFullYear() ===
            year

            &&

            d.getMonth() ===
            month

          );

        }
      )

  );

}


/* =========================
   VIEW TITLE

function updateViewTitle(){

function changeKey(
  lesson
){

  const subject =
    String(
      lesson.discipline ||
      lesson.subject ||
      ""
    )
    .trim()
    .toLowerCase();


  return [

    lesson.date ||
    "",

    subject

  ].join("|");

}


function indexLessonsByKey(
  list
){

  const counters =
    new Map();


  const result =
    new Map();


  [...list]

    .sort(
      (a,b) =>

        changeKey(a)
          .localeCompare(
            changeKey(b)
          )

        ||

        (
          a.beginLesson ||
          ""
        )
        .localeCompare(
          b.beginLesson ||
          ""
        )

    )

    .forEach(
      lesson => {

        const baseKey =
          changeKey(
            lesson
          );


        const index =
          counters.get(
            baseKey
          ) || 0;


        const key =
          `${baseKey}|${index}`;


        counters.set(
          baseKey,
          index + 1
        );


        result.set(
          key,
          lesson
        );

      }
    );


  return result;

}


function normaliseChange(
  value
){

  return String(
    value ?? ""
  ).trim();

}


function detectLocalChanges(
  previous,
  current
){

  if(
    !Array.isArray(
      previous
    )
    ||
    !previous.length
  ){

    return [];

  }


  const oldByKey =
    indexLessonsByKey(
      previous
    );


  const currentByKey =
    indexLessonsByKey(
      current
    );


  const detected = [];


  currentByKey.forEach(
    (
      lesson,
      key
    ) => {

      const oldLesson =
        oldByKey.get(
          key
        );


      if(
        !oldLesson
      ){

        return;

      }


      const fieldChanges =
        [];


      CHANGE_FIELDS.forEach(
        field => {

          const oldValue =
            normaliseChange(
              field.get(
                oldLesson
              )
            );


          const newValue =
            normaliseChange(
              field.get(
                lesson
              )
            );


          if(

            fieldChanges.push({

                oldValue ||

/* =========================

========================= */

function getBaseLessons(){

  return schedule.filter(
    lesson =>
      belongsToTargetGroup(
        lesson
      )
  );

}


function getLessonsForDate(
  date
){

  const value =
    localDateString(
      date
    );


  return filtered(
    getBaseLessons()
      .filter(
        lesson =>
          lesson.date ===
          value
      )
  );

}


function getWeekStart(
  date
){

  const d =
    new Date(
      date
    );


  const day =
    d.getDay();


  const diff =
    day === 0
      ? -6
      : 1 - day;


  d.setDate(
    d.getDate() +
    diff
  );


  return d;

}


function getWeekLessons(
  date
){

  const start =
    getWeekStart(
      date
    );


  const end =
    addDays(
      start,
      6
    );


  const startValue =
    localDateString(
      start
    );


  const endValue =
    localDateString(
      end
    );


  return filtered(

    getBaseLessons()
      .filter(
        lesson =>
          lesson.date >=
          startValue
          &&
          lesson.date <=
          endValue
      )

  );

}


function getMonthLessons(
  date
){

  const year =
    date.getFullYear();


  const month =
    date.getMonth();


  return filtered(

    getBaseLessons()
      .filter(
        lesson => {

          const d =
            dateFromString(
              lesson.date
            );


          return (

            d.getFullYear() ===
            year

            &&

            d.getMonth() ===
            month

          );

        }
      )

  );

}

    currentView ===
    "nearest"
      ? "none"
      : "flex";


  updateViewTitle();


  if(
    currentView ===
    "nearest"
  ){

    renderNext();

    renderStats();


    const lessons =
      filtered(
        getBaseLessons()
      );


    groupAndRender(
      lessons
    );


    return;

  }


  if(
    currentView ===
    "today"
  ){

    const lessons =
      getLessonsForDate(
        new Date()
      );


    renderStats();


    groupAndRender(
      lessons
    );


    return;

  }


  if(
    currentView ===
    "tomorrow"
  ){

    const tomorrow =
      addDays(
        new Date(),
        1
      );


    const lessons =
      getLessonsForDate(
        tomorrow
      );


    groupAndRender(
      lessons
    );


    return;

  }


  if(
    currentView ===
    "week"
  ){

    const lessons =
      getWeekLessons(
        selectedDate
      );


    groupAndRender(
      lessons
    );


    return;

  }


  if(
    currentView ===
    "month"
  ){

    const lessons =
      getMonthLessons(
        selectedDate
      );


    groupAndRender(
      lessons
    );


    return;

  }

}


/* =========================
   NAVIGATION
========================= */

function shiftPeriod(
  direction
){

  if(
    currentView ===
    "today"
  ){

    selectedDate =
      addDays(
        new Date(),
        direction
      );

    currentView =
      "week";

  }


  else if(
    currentView ===
    "tomorrow"
  ){

    selectedDate =
      addDays(
        new Date(),
        1 +
        direction
      );

    currentView =
      "week";

  }


  else if(
    currentView ===
    "week"
  ){

    selectedDate =
      addDays(
        selectedDate,
        direction * 7
      );

  }


  else if(
    currentView ===
    "month"
  ){

    const next =
      new Date(
        selectedDate
      );

    next.setMonth(
      next.getMonth() +
      direction
    );

    selectedDate =
      next;

  }


  else{

    selectedDate =
      addDays(
        selectedDate,
        direction
      );

  }


  renderSchedule();

}

async function loadSchedule(){

  const button =
    $(
      "refreshButton"
    );


  try{

    button.classList.add(
      "loading"
    );


    button.textContent =
      "↻ Загрузка...";


    const response =
      await fetch(
        "schedule.json?t=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(
        data
      )
    ){

      throw new Error(
        "schedule.json должен содержать массив"
      );

    }


    schedule =
      sort(

        data.filter(
          lesson =>

            lesson.date
            &&

            lesson.beginLesson
            &&

            lesson.endLesson
            &&

            belongsToTargetGroup(
              lesson
            )

        )

      );


    $(
      "updated"
    ).textContent =

      "Обновлено в " +

      new Date()
        .toLocaleTimeString(
          "ru-RU",
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );


  }

  catch(
    error
  ){

    console.error(
      "Schedule loading error:",
      error
    );


    if(
      currentView !==
      "archive"

      &&

      currentView !==
      "exams"

      &&

      currentView !==
      "changes"
    ){

      $(
        "schedule"
      ).innerHTML = `

        <div
          class="error"
        >

          <strong>

            Не удалось загрузить расписание

          </strong>


          ${esc(
            error.message
          )}

        </div>

      `;

    }

  }

  finally{

    button.classList.remove(
      "loading"
    );


    button.textContent =
      "↻ Обновить";

  }

}

/* =========================

========================= */

async function loadChanges(){

  let externalChanges =
    [];


  try{

    const response =
      await fetch(
        "changes.json?t=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );


    if(
      response.ok
    ){

      const data =
        await response.json();


      externalChanges =
        normaliseExternalChanges(
          data
        );

    }

  }

  catch(
    error
  ){

    console.warn(
      "Changes loading error:",
      error
    );

  }


  const history =
    readChangesHistory();


  changes = [

    ...externalChanges,

    ...history

  ];

}


/* =========================
   LOAD ALL
========================= */

async function loadAll(){

  const previousSchedule =
    readScheduleSnapshot();


  await Promise.all([

    loadSchedule(),

    loadArchive(),

    loadExams(),

    loadChanges()

  ]);


  /*
    Сравниваем предыдущую
    версию расписания
    с новой.
  */

  const localChanges =
    detectLocalChanges(
      previousSchedule,
      schedule
    );


  if(
    localChanges.length
  ){

    const history =
      readChangesHistory();


    const mergedHistory = [

      ...localChanges,

      ...history

    ];


    const uniqueHistory =
      [];


    const seen =
      new Set();


    mergedHistory.forEach(
      item => {

        const key = [

          item.date,

          item.discipline,

          ...(
            item.changes ||
            []
          )
          .map(
            change =>
              `${change.field}:${change.oldValue}:${change.newValue}`
          )

        ].join(
          "|"
        );


        if(
          !seen.has(
            key
          )
        ){

          seen.add(
            key
          );


          uniqueHistory.push(
            item
          );

        }

      }
    );


    saveChangesHistory(

      uniqueHistory.slice(
        0,
        100
      )

    );


    changes = [

      ...changes,

      ...localChanges

    ];

  }


  /*
    Сохраняем текущую
    версию как предыдущую
    для следующего обновления.
  */

  saveScheduleSnapshot();


  renderSchedule();


  lastHeroKey =
    heroKey();

}


/* =========================
   HERO UPDATE
========================= */

function heroKey(){

  const result =
    nextLesson();


  if(
    !result
  ){

    return "";

  }


  return [

    result.lesson.date,

    result.lesson.beginLesson,

    result.lesson.endLesson,

    result.current
      ? "current"
      : "next"

  ].join(
    "|"
  );

}


function updateHero(){

  if(
    currentView !==
    "nearest"
  ){

    return;

  }


  const result =
    nextLesson();


  const key =
    heroKey();


  if(
    key !==
    lastHeroKey
  ){

    renderNext();


    lastHeroKey =
      key;


    return;

  }


  if(
    !result
  ){

    return;

  }


  const target =

    result.current

    ?

    dt(
      result.lesson,
      "endLesson"
    )

    :

    dt(
      result.lesson,
      "beginLesson"
    );


  const element =
    $(
      "heroCountdown"
    );


  if(
    element
  ){

    element.textContent =
      countdown(
        target -
        new Date()
      );

  }

}
