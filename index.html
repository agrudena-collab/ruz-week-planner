<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Расписание — МеждОт25-2</title>

  <style>
    :root {
      --bg: #f1f3f6;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #737780;
      --line: #e4e6eb;
      --blue: #007aff;
      --blue-soft: #eaf3ff;
      --green: #20a464;
      --green-soft: #eaf8f0;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    /* HEADER */

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 22px;
    }

    .title-block h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: -0.8px;
    }

    .group-name {
      margin-top: 7px;
      font-size: 17px;
      color: var(--muted);
      font-weight: 500;
    }

    .updated {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .refresh-button {
      border: 0;
      background: var(--blue);
      color: white;
      border-radius: 13px;
      padding: 11px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s ease, opacity .15s ease;
    }

    .refresh-button:hover {
      transform: translateY(-1px);
    }

    .refresh-button:active {
      transform: scale(.97);
    }

    .refresh-button.loading {
      opacity: .65;
      pointer-events: none;
    }

    /* NEXT LESSON */

    .next-card {
      background: linear-gradient(135deg, #ffffff 0%, #f5f9ff 100%);
      border: 1px solid #dceaff;
      border-radius: 22px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 6px 24px rgba(0, 122, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .next-card::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -70px;
      top: -70px;
      border-radius: 50%;
      background: rgba(0, 122, 255, 0.05);
      pointer-events: none;
    }

    .next-label {
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .7px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .next-time {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.7px;
      margin-bottom: 4px;
    }

    .next-discipline {
      font-size: 20px;
      font-weight: 750;
      margin-bottom: 13px;
    }

    .next-info {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .next-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      margin-bottom: 11px;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
    }

    .next-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    /* TABS */

    .tabs-wrap {
      position: sticky;
      top: 10px;
      z-index: 20;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 5px;
      background: #e4e6eb;
      border-radius: 16px;
      border: 1px solid rgba(0, 0, 0, .03);
      box-shadow: 0 3px 14px rgba(0, 0, 0, .06);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 1;
      min-width: 105px;
      border: 0;
      background: transparent;
      color: #666a72;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s ease;
      white-space: nowrap;
    }

    .tab.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    /* DAY */

    .day {
      margin-bottom: 30px;
    }

    .day-header {
      margin-bottom: 11px;
      padding: 0 3px;
    }

    .weekday {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.3px;
      text-transform: capitalize;
    }

    .full-date {
      margin-top: 2px;
      color: var(--muted);
      font-size: 14px;
    }

    /* LESSON */

    .lesson {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 17px 18px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .lesson:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    .lesson.current {
      border: 2px solid var(--green);
      background: #fbfffd;
      box-shadow: 0 5px 20px rgba(32, 164, 100, .12);
    }

    .lesson-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .time {
      color: var(--blue);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.2px;
      margin-bottom: 7px;
    }

    .discipline {
      font-size: 18px;
      font-weight: 750;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .current-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      background: var(--green-soft);
      color: var(--green);
      border-radius: 9px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .current-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
    }

    .info {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    /* EMPTY */

    .empty {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 38px 20px;
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    .empty-icon {
      font-size: 30px;
      margin-bottom: 9px;
    }

    .empty-title {
      color: var(--text);
      font-weight: 750;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .error {
      background: #fff1f1;
      color: #c62828;
      border: 1px solid #ffd2d2;
      padding: 16px;
      border-radius: 15px;
      line-height: 1.5;
    }

    /* FOOTER */

    .source {
      margin-top: 30px;
      text-align: center;
      color: #999da5;
      font-size: 12px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .container {
        width: min(100% - 20px, 920px);
        padding-top: 18px;
      }

      header {
        align-items: center;
        margin-bottom: 17px;
      }

      .title-block h1 {
        font-size: 29px;
      }

      .group-name {
        font-size: 15px;
      }

      .updated {
        font-size: 12px;
      }

      .refresh-button {
        padding: 10px 12px;
        font-size: 13px;
      }

      .next-card {
        padding: 18px;
        border-radius: 19px;
      }

      .next-time {
        font-size: 27px;
      }

      .next-discipline {
        font-size: 18px;
      }

      .tabs-wrap {
        top: 5px;
      }

      .tabs {
        border-radius: 14px;
      }

      .tab {
        min-width: 92px;
        font-size: 13px;
        padding: 10px 8px;
      }

      .weekday {
        font-size: 19px;
      }

      .lesson {
        padding: 15px;
        border-radius: 16px;
      }

      .discipline {
        font-size: 17px;
      }

      .info {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="title-block">
        <h1>Расписание</h1>
        <div class="group-name">МеждОт25-2</div>
        <div class="updated" id="updated">Загрузка расписания...</div>
      </div>

      <button class="refresh-button" id="refreshButton">
        ↻ Обновить
      </button>
    </header>

    <div id="nextLesson"></div>

    <div class="tabs-wrap">
      <nav class="tabs">
        <button class="tab active" data-view="nearest">
          Ближайшее
        </button>

        <button class="tab" data-view="today">
          Сегодня
        </button>

        <button class="tab" data-view="tomorrow">
          Завтра
        </button>

        <button class="tab" data-view="week">
          Неделя
        </button>

        <button class="tab" data-view="month">
          Месяц
        </button>
      </nav>
    </div>

    <main id="schedule">
      <div class="empty">
        Загружаем расписание...
      </div>
    </main>

    <div class="source">
      Источник: официальный РУЗ Финансового университета
    </div>

  </div>

  <script>

    let schedule = [];
    let currentView = "nearest";

    /*
      -----------------------------
      ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
      -----------------------------
    */

    function pad(number) {
      return String(number).padStart(2, "0");
    }

    function localDateString(date = new Date()) {
      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-");
    }

    function addDays(date, amount) {
      const result = new Date(date);
      result.setDate(result.getDate() + amount);
      return result;
    }

    function dateFromString(value) {
      return new Date(value + "T00:00:00");
    }

    function formatDate(dateString) {
      const date = dateFromString(dateString);

      return date.toLocaleDateString("ru-RU", {
        day: "numeric",
        month: "long"
      });
    }

    function formatWeekday(dateString) {
      const date = dateFromString(dateString);

      return date.toLocaleDateString("ru-RU", {
        weekday: "long"
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function lessonDateTime(lesson, field) {
      return new Date(
        `${lesson.date}T${lesson[field]}:00`
      );
    }

    function isLessonCurrent(lesson) {
      const now = new Date();

      const start = lessonDateTime(lesson, "beginLesson");
      const end = lessonDateTime(lesson, "endLesson");

      return now >= start && now < end;
    }

    function lessonHasEnded(lesson) {
      return new Date() >= lessonDateTime(
        lesson,
        "endLesson"
      );
    }

    function sortSchedule(list) {
      return [...list].sort((a, b) => {

        const dateCompare =
          (a.date || "").localeCompare(b.date || "");

        if (dateCompare !== 0) {
          return dateCompare;
        }

        return (a.beginLesson || "")
          .localeCompare(b.beginLesson || "");
      });
    }

    /*
      -----------------------------
      СЛЕДУЮЩАЯ ПАРА
      -----------------------------
    */

    function findNextLesson() {

      const sorted = sortSchedule(schedule);

      // Сначала ищем текущую пару.
      const current = sorted.find(
        lesson => isLessonCurrent(lesson)
      );

      if (current) {
        return {
          lesson: current,
          current: true
        };
      }

      // Затем ближайшую ещё не начавшуюся.
      const next = sorted.find(
        lesson => !lessonHasEnded(lesson)
      );

      if (next) {
        return {
          lesson: next,
          current: false
        };
      }

      return null;
    }

    function renderNextLesson() {

      const container =
        document.getElementById("nextLesson");

      const result = findNextLesson();

      if (!result) {
        container.innerHTML = "";
        return;
      }

      const lesson = result.lesson;

      const status = result.current
        ? `
          <div class="next-status">
            <span class="next-status-dot"></span>
            СЕЙЧАС ИДЁТ
          </div>
        `
        : `
          <div class="next-label">
            Следующая пара
          </div>
        `;

      container.innerHTML = `
        <section class="next-card">

          ${status}

          <div class="next-time">
            ${escapeHtml(lesson.beginLesson)}
            –
            ${escapeHtml(lesson.endLesson)}
          </div>

          <div class="next-discipline">
            ${escapeHtml(
              lesson.discipline || "Предмет не указан"
            )}
          </div>

          <div class="next-info">

            <div>
              📅
              ${formatWeekday(lesson.date)},
              ${formatDate(lesson.date)}
            </div>

            <div>
              👨‍🏫
              ${escapeHtml(
                lesson.lecturer ||
                "Преподаватель не указан"
              )}
            </div>

            ${
              lesson.auditorium
              ? `
                <div>
                  🏫
                  ${escapeHtml(lesson.auditorium)}
                </div>
              `
              : ""
            }

            ${
              lesson.building
              ? `
                <div>
                  📍
                  ${escapeHtml(lesson.building)}
                </div>
              `
              : ""
            }

          </div>

        </section>
      `;
    }

    /*
      -----------------------------
      ГРУППИРОВКА
      -----------------------------
    */

    function groupByDate(list) {

      const grouped = {};

      for (const lesson of list) {

        if (!lesson.date) {
          continue;
        }

        if (!grouped[lesson.date]) {
          grouped[lesson.date] = [];
        }

        grouped[lesson.date].push(lesson);
      }

      return grouped;
    }

    /*
      -----------------------------
      КАРТОЧКА ПАРЫ
      -----------------------------
    */

    function lessonHtml(lesson) {

      const current = isLessonCurrent(lesson);

      return `
        <article class="lesson ${current ? "current" : ""}">

          <div class="lesson-header">

            <div>
              <div class="time">
                ${escapeHtml(lesson.beginLesson || "")}
                –
                ${escapeHtml(lesson.endLesson || "")}
              </div>

              <div class="discipline">
                ${escapeHtml(
                  lesson.discipline ||
                  "Предмет не указан"
                )}
              </div>
            </div>

            ${
              current
              ? `
                <div class="current-badge">
                  СЕЙЧАС ИДЁТ
                </div>
              `
              : ""
            }

          </div>

          <div class="info">

            ${
              lesson.lecturer
              ? `
                <div>
                  👨‍🏫
                  ${escapeHtml(lesson.lecturer)}
                </div>
              `
              : ""
            }

            ${
              lesson.auditorium
              ? `
                <div>
                  🏫
                  ${escapeHtml(lesson.auditorium)}
                </div>
              `
              : ""
            }

            ${
              lesson.building
              ? `
                <div>
                  📍
                  ${escapeHtml(lesson.building)}
                </div>
              `
              : ""
            }

          </div>

        </article>
      `;
    }

    /*
      -----------------------------
      ОТОБРАЖЕНИЕ ДНЯ
      -----------------------------
    */

    function renderDay(date, lessons) {

      const sorted = sortSchedule(lessons);

      return `
        <section class="day">

          <div class="day-header">

            <div class="weekday">
              ${escapeHtml(formatWeekday(date))}
            </div>

            <div class="full-date">
              ${escapeHtml(formatDate(date))}
            </div>

          </div>

          ${sorted.map(lessonHtml).join("")}

        </section>
      `;
    }

    /*
      -----------------------------
      ПУСТОЕ СОСТОЯНИЕ
      -----------------------------
    */

    function renderEmpty(title, text) {

      return `
        <div class="empty">

          <div class="empty-icon">
            📚
          </div>

          <div class="empty-title">
            ${escapeHtml(title)}
          </div>

          <div>
            ${escapeHtml(text)}
          </div>

        </div>
      `;
    }

    /*
      -----------------------------
      ФИЛЬТРЫ
      -----------------------------
    */

    function getLessonsForView() {

      const today = new Date();
      const todayString = localDateString(today);

      if (currentView === "today") {

        return schedule.filter(
          lesson => lesson.date === todayString
        );
      }

      if (currentView === "tomorrow") {

        const tomorrow =
          localDateString(addDays(today, 1));

        return schedule.filter(
          lesson => lesson.date === tomorrow
        );
      }

      if (currentView === "week") {

        const start = today;
        const end = addDays(today, 7);

        return schedule.filter(lesson => {

          const date = dateFromString(lesson.date);

          return date >=
            new Date(
              start.getFullYear(),
              start.getMonth(),
              start.getDate()
            )
            &&
            date <
            new Date(
              end.getFullYear(),
              end.getMonth(),
              end.getDate()
            );
        });
      }

      if (currentView === "month") {

        const end = addDays(today, 30);

        return schedule.filter(lesson => {

          const date = dateFromString(lesson.date);

          return date >=
            new Date(
              today.getFullYear(),
              today.getMonth(),
              today.getDate()
            )
            &&
            date <= end;
        });
      }

      /*
        Ближайшее:
        берём ближайший учебный день,
        в котором есть занятия.
      */

      const sorted = sortSchedule(schedule);

      const todayString2 =
        localDateString(today);

      const futureDates = [
        ...new Set(
          sorted
            .filter(
              lesson => lesson.date >= todayString2
            )
            .map(
              lesson => lesson.date
            )
        )
      ];

      if (!futureDates.length) {
        return [];
      }

      const nearestDate = futureDates[0];

      return sorted.filter(
        lesson => lesson.date === nearestDate
      );
    }

    /*
      -----------------------------
      ОСНОВНОЙ RENDER
      -----------------------------
    */

    function renderSchedule() {

      const container =
        document.getElementById("schedule");

      const lessons =
        getLessonsForView();

      if (!lessons.length) {

        if (currentView === "today") {

          container.innerHTML =
            renderEmpty(
              "Сегодня занятий нет",
              "Отличный день для отдыха 😎"
            );

        } else if (currentView === "tomorrow") {

          container.innerHTML =
            renderEmpty(
              "Завтра занятий нет",
              "В расписании пока ничего нет."
            );

        } else if (currentView === "week") {

          container.innerHTML =
            renderEmpty(
              "На этой неделе занятий нет",
              "В расписании нет занятий на ближайшие 7 дней."
            );

        } else {

          container.innerHTML =
            renderEmpty(
              "Расписание не найдено",
              "Попробуйте обновить расписание."
            );
        }

        return;
      }

      const grouped =
        groupByDate(lessons);

      const dates =
        Object.keys(grouped).sort();

      container.innerHTML =
        dates
          .map(
            date =>
              renderDay(date, grouped[date])
          )
          .join("");
    }

    /*
      -----------------------------
      ЗАГРУЗКА
      -----------------------------
    */

    async function loadSchedule() {

      const button =
        document.getElementById("refreshButton");

      const updated =
        document.getElementById("updated");

      button.classList.add("loading");
      button.textContent = "↻ Обновление...";

      try {

        const response =
          await fetch(
            "schedule.json?t=" +
            Date.now()
          );

        if (!response.ok) {
          throw new Error(
            "Не удалось загрузить schedule.json"
          );
        }

        const data =
          await response.json();

        if (!Array.isArray(data)) {
          throw new Error(
            "schedule.json имеет неверный формат"
          );
        }

        schedule =
          sortSchedule(data);

        updated.textContent =
          "Актуальное расписание • обновлено в " +
          new Date().toLocaleTimeString(
            "ru-RU",
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

        renderNextLesson();
        renderSchedule();

      } catch (error) {

        document.getElementById(
          "schedule"
        ).innerHTML = `
          <div class="error">
            <strong>
              Ошибка загрузки расписания
            </strong>
            <br>
            ${escapeHtml(error.message)}
          </div>
        `;

        console.error(error);

      } finally {

        button.classList.remove("loading");
        button.textContent = "↻ Обновить";
      }
    }

    /*
      -----------------------------
      TABS
      -----------------------------
    */

    document
      .querySelectorAll(".tab")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".tab")
              .forEach(
                item =>
                  item.classList.remove("active")
              );

            button.classList.add("active");

            currentView =
              button.dataset.view;

            renderSchedule();
          }
        );
      });

    /*
      -----------------------------
      REFRESH
      -----------------------------
    */

    document
      .getElementById("refreshButton")
      .addEventListener(
        "click",
        loadSchedule
      );

    /*
      -----------------------------
      АВТОМАТИЧЕСКОЕ ОБНОВЛЕНИЕ
      -----------------------------
    */

    loadSchedule();

    // Перерисовываем статус текущей пары
    // каждую минуту.
    setInterval(() => {

      renderNextLesson();
      renderSchedule();

    }, 60 * 1000);

  </script>

</body>
</html>
