<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Расписание — МеждОт25-2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    header {
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 31px;
    }

    .subtitle {
      color: #6e6e73;
      font-size: 16px;
    }

    .updated {
      color: #8e8e93;
      font-size: 13px;
      margin-top: 7px;
    }

    .refresh {
      float: right;
      border: none;
      background: #007aff;
      color: white;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 11px;
      cursor: pointer;
    }

    /* Следующая пара */

    .next-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin: 18px 0;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .next-label {
      color: #007aff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .next-time {
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .next-subject {
      font-size: 20px;
      font-weight: 750;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .next-info {
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.6;
    }

    .live {
      border: 2px solid #34c759;
    }

    .live .next-label {
      color: #34c759;
    }

    /* Навигация */

    .tabs-wrapper {
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 24px;
    }

    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tabs {
      display: flex;
      gap: 4px;
      min-width: max-content;
      background: #e5e5ea;
      padding: 4px;
      border-radius: 14px;
    }

    .tab {
      border: none;
      background: transparent;
      color: #6e6e73;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: white;
      color: #1d1d1f;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    /* Дни */

    .day {
      margin-bottom: 28px;
    }

    .date {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: capitalize;
    }

    .today-label {
      display: inline-block;
      background: #007aff;
      color: white;
      padding: 4px 8px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* Пара */

    .lesson {
      background: white;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.055);
      border: 2px solid transparent;
    }

    .lesson.current {
      border-color: #34c759;
    }

    .lesson.current .time {
      color: #34c759;
    }

    .time {
      font-size: 15px;
      font-weight: 700;
      color: #007aff;
      margin-bottom: 7px;
    }

    .discipline {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .info {
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.65;
    }

    .lesson-status {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 8px;
      background: #34c759;
      color: white;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .empty {
      text-align: center;
      color: #6e6e73;
      padding: 55px 20px;
      font-size: 16px;
    }

    .loading {
      text-align: center;
      color: #6e6e73;
      padding: 50px 0;
    }

    .error {
      background: #fff0f0;
      color: #c00;
      padding: 16px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 14px 40px;
      }

      h1 {
        font-size: 28px;
      }

      .next-time {
        font-size: 23px;
      }

      .next-subject {
        font-size: 18px;
      }

      .tab {
        font-size: 13px;
        padding: 10px 14px;
      }

      .lesson {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>

    <button class="refresh" onclick="loadSchedule()">
      ↻ Обновить
    </button>

    <h1>Расписание</h1>

    <div class="subtitle">
      МеждОт25-2
    </div>

    <div class="updated" id="updated">
      Загружаем расписание...
    </div>

  </header>


  <!-- Следующая пара -->

  <div id="next-card"></div>


  <!-- Навигация -->

  <div class="tabs-wrapper">

    <div class="tabs">

      <button
        class="tab active"
        data-mode="nearest"
        onclick="setMode('nearest')">
        Ближайшее
      </button>

      <button
        class="tab"
        data-mode="today"
        onclick="setMode('today')">
        Сегодня
      </button>

      <button
        class="tab"
        data-mode="tomorrow"
        onclick="setMode('tomorrow')">
        Завтра
      </button>

      <button
        class="tab"
        data-mode="week"
        onclick="setMode('week')">
        Неделя
      </button>

      <button
        class="tab"
        data-mode="month"
        onclick="setMode('month')">
        Месяц
      </button>

    </div>

  </div>


  <main id="schedule">

    <div class="loading">
      Загружаем расписание...
    </div>

  </main>

</div>


<script>

let allLessons = [];
let currentMode = "nearest";


/* -------------------------------
   ДАТА
-------------------------------- */

function getLocalDate() {

  const now = new Date();

  const year = now.getFullYear();

  const month =
    String(now.getMonth() + 1).padStart(2, "0");

  const day =
    String(now.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function addDays(dateString, days) {

  const date =
    new Date(dateString + "T12:00:00");

  date.setDate(
    date.getDate() + days
  );

  const year =
    date.getFullYear();

  const month =
    String(date.getMonth() + 1).padStart(2, "0");

  const day =
    String(date.getDate()).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function formatDate(dateString) {

  const date =
    new Date(dateString + "T12:00:00");

  return date.toLocaleDateString(
    "ru-RU",
    {
      weekday: "long",
      day: "numeric",
      month: "long"
    }
  );
}


/* -------------------------------
   ВРЕМЯ ПАРЫ
-------------------------------- */

function lessonTimeToMinutes(time) {

  if (!time) return null;

  const parts =
    time.split(":");

  if (parts.length < 2) return null;

  return (
    Number(parts[0]) * 60 +
    Number(parts[1])
  );
}


function getCurrentMinutes() {

  const now = new Date();

  return (
    now.getHours() * 60 +
    now.getMinutes()
  );
}


/* -------------------------------
   СЛЕДУЮЩАЯ / ТЕКУЩАЯ ПАРА
-------------------------------- */

function findNextLesson() {

  const today =
    getLocalDate();

  const now =
    getCurrentMinutes();


  /*
   * Сначала проверяем сегодняшние пары.
   */

  const todayLessons =
    allLessons
      .filter(
        lesson =>
          lesson.date === today
      )
      .sort(
        (a, b) =>
          lessonTimeToMinutes(
            a.beginLesson
          ) -
          lessonTimeToMinutes(
            b.beginLesson
          )
      );


  /*
   * Если сейчас идёт пара —
   * возвращаем её.
   */

  for (
    const lesson of todayLessons
  ) {

    const begin =
      lessonTimeToMinutes(
        lesson.beginLesson
      );

    const end =
      lessonTimeToMinutes(
        lesson.endLesson
      );

    if (
      begin !== null &&
      end !== null &&
      now >= begin &&
      now < end
    ) {

      return {
        lesson,
        current: true
      };

    }

  }


  /*
   * Ищем следующую сегодняшнюю.
   */

  for (
    const lesson of todayLessons
  ) {

    const begin =
      lessonTimeToMinutes(
        lesson.beginLesson
      );

    if (
      begin !== null &&
      begin > now
    ) {

      return {
        lesson,
        current: false
      };

    }

  }


  /*
   * Сегодня больше пар нет.
   * Ищем ближайшую будущую.
   */

  const future =
    allLessons
      .filter(
        lesson =>
          lesson.date > today
      )
      .sort(
        (a, b) => {

          if (
            a.date !== b.date
          ) {

            return a.date.localeCompare(
              b.date
            );

          }

          return (
            lessonTimeToMinutes(
              a.beginLesson
            ) -
            lessonTimeToMinutes(
              b.beginLesson
            )
          );

        }
      );


  if (future.length) {

    return {
      lesson: future[0],
      current: false
    };

  }


  return null;
}


/* -------------------------------
   КАРТОЧКА СЛЕДУЮЩЕЙ ПАРЫ
-------------------------------- */

function renderNextLesson() {

  const container =
    document.getElementById(
      "next-card"
    );


  const result =
    findNextLesson();


  if (!result) {

    container.innerHTML = "";

    return;
  }


  const lesson =
    result.lesson;


  const current =
    result.current;


  const label =
    current
      ? "Сейчас идёт"
      : "Следующая пара";


  const dateText =
    formatDate(
      lesson.date
    );


  const timeText =
    `${lesson.beginLesson || ""}–${lesson.endLesson || ""}`;


  const discipline =
    lesson.discipline ||
    "Предмет не указан";


  const lecturer =
    lesson.lecturer ||
    "Преподаватель не указан";


  const auditorium =
    lesson.auditorium || "";


  const building =
    lesson.building || "";


  container.innerHTML = `

    <div class="next-card ${current ? "live" : ""}">

      <div class="next-label">
        ${label}
      </div>

      <div class="next-time">
        ${timeText}
      </div>

      <div class="next-subject">
        ${discipline}
      </div>

      <div class="next-info">

        📅 ${dateText}

        <br>

        👨‍🏫 ${lecturer}

        ${
          auditorium
            ? `<br>🏫 ${auditorium}`
            : ""
        }

        ${
          building
            ? `<br>📍 ${building}`
            : ""
        }

      </div>

    </div>

  `;
}


/* -------------------------------
   КАРТОЧКА ОБЫЧНОЙ ПАРЫ
-------------------------------- */

function createLessonElement(
  lesson
) {

  const element =
    document.createElement(
      "div"
    );


  element.className =
    "lesson";


  const today =
    getLocalDate();


  const now =
    getCurrentMinutes();


  let isCurrent = false;


  if (
    lesson.date === today
  ) {

    const begin =
      lessonTimeToMinutes(
        lesson.beginLesson
      );

    const end =
      lessonTimeToMinutes(
        lesson.endLesson
      );


    if (
      begin !== null &&
      end !== null &&
      now >= begin &&
      now < end
    ) {

      isCurrent = true;

    }

  }


  if (isCurrent) {

    element.classList.add(
      "current"
    );

  }


  const discipline =
    lesson.discipline ||
    "Предмет не указан";


  const lecturer =
    lesson.lecturer ||
    "Преподаватель не указан";


  const auditorium =
    lesson.auditorium || "";


  const building =
    lesson.building || "";


  element.innerHTML = `

    <div class="time">
      ${lesson.beginLesson || ""}
      –
      ${lesson.endLesson || ""}
    </div>

    <div class="discipline">
      ${discipline}
    </div>

    <div class="info">

      👨‍🏫 ${lecturer}

      ${
        auditorium
          ? `<br>🏫 ${auditorium}`
          : ""
      }

      ${
        building
          ? `<br>📍 ${building}`
          : ""
      }

    </div>

    ${
      isCurrent
        ? `<div class="lesson-status">
             Сейчас идёт
           </div>`
        : ""
    }

  `;


  return element;
}


/* -------------------------------
   РЕНДЕР
-------------------------------- */

function render() {

  const container =
    document.getElementById(
      "schedule"
    );


  let lessons = [];


  const today =
    getLocalDate();


  if (
    currentMode === "nearest"
  ) {

    const futureDates =
      [
        ...new Set(
          allLessons
            .map(
              lesson =>
                lesson.date
            )
            .filter(
              date =>
                date >= today
            )
        )
      ].sort();


    if (
      futureDates.length
    ) {

      lessons =
        allLessons.filter(
          lesson =>
            lesson.date ===
            futureDates[0]
        );

    }

  }


  if (
    currentMode === "today"
  ) {

    lessons =
      allLessons.filter(
        lesson =>
          lesson.date === today
      );

  }


  if (
    currentMode === "tomorrow"
  ) {

    const tomorrow =
      addDays(
        today,
        1
      );


    lessons =
      allLessons.filter(
        lesson =>
          lesson.date === tomorrow
      );

  }


  if (
    currentMode === "week"
  ) {

    const end =
      addDays(
        today,
        6
      );


    lessons =
      allLessons.filter(
        lesson =>
          lesson.date >= today &&
          lesson.date <= end
      );

  }


  if (
    currentMode === "month"
  ) {

    const end =
      addDays(
        today,
        29
      );


    lessons =
      allLessons.filter(
        lesson =>
          lesson.date >= today &&
          lesson.date <= end
      );

  }


  if (!lessons.length) {

    let text =
      "Занятий нет.";


    if (
      currentMode === "today"
    ) {

      text =
        "Сегодня занятий нет.";

    }


    if (
      currentMode === "tomorrow"
    ) {

      text =
        "Завтра занятий нет.";

    }


    if (
      currentMode === "week"
    ) {

      text =
        "На ближайшие 7 дней занятий нет.";

    }


    if (
      currentMode === "month"
    ) {

      text =
        "На ближайшие 30 дней занятий нет.";

    }


    if (
      currentMode === "nearest"
    ) {

      text =
        "Ближайших занятий нет.";

    }


    container.innerHTML = `
      <div class="empty">
        ${text}
      </div>
    `;


    return;

  }


  /*
   * Группировка по датам.
   */

  const grouped = {};


  for (
    const lesson
    of lessons
  ) {

    if (
      !grouped[lesson.date]
    ) {

      grouped[lesson.date] =
        [];

    }


    grouped[lesson.date].push(
      lesson
    );

  }


  const dates =
    Object.keys(grouped)
      .sort();


  container.innerHTML = "";


  for (
    const date
    of dates
  ) {

    const day =
      document.createElement(
        "section"
      );


    day.className =
      "day";


    const dateElement =
      document.createElement(
        "div"
      );


    dateElement.className =
      "date";


    dateElement.innerHTML = `

      ${formatDate(date)}

      ${
        date === today
          ? '<span class="today-label">СЕГОДНЯ</span>'
          : ""
      }

    `;


    day.appendChild(
      dateElement
    );


    grouped[date].sort(
      (a, b) =>
        (
          lessonTimeToMinutes(
            a.beginLesson
          ) || 0
        ) -
        (
          lessonTimeToMinutes(
            b.beginLesson
          ) || 0
        )
    );


    for (
      const lesson
      of grouped[date]
    ) {

      day.appendChild(
        createLessonElement(
          lesson
        )
      );

    }


    container.appendChild(
      day
    );

  }

}


/* -------------------------------
   ВКЛАДКИ
-------------------------------- */

function setMode(mode) {

  currentMode =
    mode;


  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      tab => {

        tab.classList.toggle(
          "active",
          tab.dataset.mode ===
          mode
        );

      }
    );


  render();

}


/* -------------------------------
   ЗАГРУЗКА
-------------------------------- */

async function loadSchedule() {

  const container =
    document.getElementById(
      "schedule"
    );


  container.innerHTML = `
    <div class="loading">
      Загружаем расписание...
    </div>
  `;


  try {

    const response =
      await fetch(
        "schedule.json?t=" +
        Date.now()
      );


    if (!response.ok) {

      throw new Error(
        "Не удалось загрузить schedule.json"
      );

    }


    const schedule =
      await response.json();


    if (
      !Array.isArray(schedule)
    ) {

      throw new Error(
        "schedule.json имеет неправильный формат"
      );

    }


    allLessons =
      schedule
        .filter(
          lesson =>
            lesson.date
        );


    const now =
      new Date();


    document.getElementById(
      "updated"
    ).textContent =
      "Актуальное расписание • " +
      "обновлено в " +
      now.toLocaleTimeString(
        "ru-RU",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );


    renderNextLesson();

    render();


  } catch (error) {

    container.innerHTML = `
      <div class="error">

        Ошибка загрузки расписания:
        <br><br>

        ${error.message}

      </div>
    `;

    console.error(error);

  }

}


/* -------------------------------
   ЗАПУСК
-------------------------------- */

loadSchedule();


/*
 * Обновляем статус текущей пары
 * каждую минуту.
 */

setInterval(
  () => {

    renderNextLesson();

    render();

  },
  60 * 1000
);


/*
 * Проверяем новый schedule.json
 * каждые 5 минут.
 */

setInterval(
  loadSchedule,
  5 * 60 * 1000
);

</script>

</body>
</html>
