<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#0b1020"
>

<title>Расписание — МеждОт25-2</title>

<style>

:root{
  --bg:#080b14;
  --panel:#0d1220;
  --panel2:#111827;
  --line:rgba(255,255,255,.09);
  --text:#f5f7fb;
  --muted:#8993a7;
  --soft:#b9c1d0;
  --white:#fff;

  --radius:24px;

  --shadow:
    0 18px 55px
    rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  margin:0;

  color:var(--text);

  background:

    radial-gradient(
      circle at 20% -10%,
      rgba(91,107,255,.12),
      transparent 32%
    ),

    radial-gradient(
      circle at 100% 0%,
      rgba(44,211,153,.06),
      transparent 28%
    ),

    var(--bg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Inter,
    "Segoe UI",
    Arial,
    sans-serif;

  -webkit-font-smoothing:
    antialiased;

  min-height:100vh;
}

button,
input,
select{
  font:inherit;
}

.app{

  max-width:1100px;

  margin:auto;

  padding:
    18px
    18px
    60px;
}

.top{

  position:sticky;

  top:0;

  z-index:20;

  padding:
    8px
    0
    14px;

  background:
    linear-gradient(
      var(--bg) 72%,
      transparent
    );

  backdrop-filter:
    blur(12px);
}


/* =========================
   HEADER
========================= */

.header{

  display:flex;

  align-items:flex-end;

  justify-content:space-between;

  gap:18px;

  margin-bottom:16px;
}

.brand{

  display:flex;

  align-items:center;

  gap:13px;
}

.menu-button{

  width:50px;

  height:50px;

  border:
    1px solid var(--line);

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #6d72ff,
      #8b5cf6
    );

  color:#fff;

  display:grid;

  place-items:center;

  font-size:23px;

  cursor:pointer;

  box-shadow:
    0 10px 30px
    rgba(104,91,255,.25);

  transition:
    transform .2s;
}

.menu-button:active{
  transform:scale(.97);
}

h1{

  font-size:28px;

  line-height:1.05;

  margin:
    0
    0
    5px;

  letter-spacing:-.8px;
}

.subtitle{

  color:var(--muted);

  font-size:14px;
}

.updated{

  color:var(--muted);

  font-size:13px;

  text-align:right;
}

.refresh{

  margin-top:6px;

  border:
    1px solid var(--line);

  background:#121827;

  padding:
    9px
    13px;

  border-radius:13px;

  cursor:pointer;

  font-weight:700;
}

.refresh:active{
  transform:scale(.98);
}


/* =========================
   TABS
========================= */

.tabs{

  display:flex;

  gap:5px;

  padding:5px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid var(--line);

  border-radius:17px;

  overflow:auto;
}

.tab{

  flex:
    1 0 120px;

  border:0;

  background:transparent;

  color:var(--muted);

  padding:
    11px
    8px;

  border-radius:12px;

  cursor:pointer;

  font-weight:750;

  font-size:14px;

  white-space:nowrap;
}

.tab.active{

  background:#f7f8fb;

  color:#111827;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.2);
}


/* =========================
   CONTENT
========================= */

.content{
  padding-top:8px;
}


/* =========================
   HERO
========================= */

.hero{

  --accent:#7c83ff;
  --accent2:#9aa0ff;

  position:relative;

  overflow:hidden;

  border:
    1px solid var(--line);

  border-radius:
    var(--radius);

  padding:24px;

  margin-bottom:18px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.06),
      rgba(255,255,255,.018)
    );

  box-shadow:var(--shadow);
}

.hero::before{

  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:4px;

  background:
    var(--accent);
}

.hero::after{

  content:"";

  position:absolute;

  width:240px;

  height:160px;

  right:-60px;

  top:-35px;

  border-radius:50%;

  background:
    var(--accent);

  opacity:.09;

  filter:blur(25px);
}

.hero > *{
  position:relative;
  z-index:1;
}

.eyebrow{

  color:var(--accent2);

  font-size:11px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:1.3px;

  margin-bottom:10px;
}

.hero-time{

  font-size:38px;

  line-height:1;

  font-weight:950;

  letter-spacing:-2px;

  margin-bottom:10px;
}

.hero-subject{

  font-size:25px;

  line-height:1.15;

  font-weight:900;

  margin-bottom:13px;
}

.hero-countdown{

  display:inline-flex;

  align-items:center;

  gap:8px;

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.055);

  border-radius:12px;

  padding:
    9px
    12px;

  color:var(--soft);

  font-size:13px;

  font-weight:800;

  margin-bottom:14px;
}

.hero-countdown strong{

  color:#6fe8ba;

  font-size:16px;

  font-variant-numeric:
    tabular-nums;
}

.chips{

  display:flex;

  flex-wrap:wrap;

  gap:7px;
}

.chip{

  border:
    1px solid
    rgba(255,255,255,.085);

  background:
    rgba(0,0,0,.16);

  color:#aeb7c7;

  border-radius:10px;

  padding:
    7px
    9px;

  font-size:12px;

  white-space:nowrap;
}


/* =========================
   DAYS
========================= */

.day{
  margin:24px 0 0;
}

.day-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin:
    0
    4px
    11px;
}

.day-title{

  font-size:20px;

  font-weight:850;

  letter-spacing:-.35px;
}

.day-date{

  color:var(--muted);

  font-size:13px;

  margin-top:3px;
}

.count{

  color:var(--muted);

  font-size:12px;

  border:
    1px solid var(--line);

  padding:
    6px
    9px;

  border-radius:999px;
}


/* =========================
   CARDS
========================= */

.cards{

  display:grid;

  gap:11px;
}

.card{

  --accent:#7c83ff;
  --accent2:#9aa0ff;

  position:relative;

  overflow:hidden;

  border:
    1px solid var(--line);

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  box-shadow:
    0 8px 26px
    rgba(0,0,0,.16);

  cursor:pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease;
}

.card:hover{

  transform:
    translateY(-2px);

  border-color:
    color-mix(
      in srgb,
      var(--accent) 38%,
      transparent
    );
}

.card.open{

  border-color:
    color-mix(
      in srgb,
      var(--accent) 50%,
      transparent
    );

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );
}

.card::before{

  content:"";

  position:absolute;

  inset:
    0
    auto
    0
    0;

  width:4px;

  background:
    var(--accent);
}

.card.current{

  border-color:
    rgba(44,211,153,.55);

  box-shadow:
    0
    0
    0
    1px
    rgba(44,211,153,.1);
}

.card.ended{
  opacity:.5;
}

.card-main{

  padding:
    18px
    18px
    16px
    21px;

  position:relative;

  min-height:145px;
}

.time{

  font-size:16px;

  font-weight:850;

  color:var(--accent2);

  letter-spacing:.2px;
}

.subject{

  font-size:21px;

  line-height:1.13;

  font-weight:850;

  letter-spacing:-.45px;

  margin:
    8px
    0
    14px;

  max-width:75%;
}

.meta{

  display:flex;

  flex-wrap:wrap;

  gap:7px;
}

.pill{

  border:
    1px solid
    rgba(255,255,255,.085);

  background:
    rgba(0,0,0,.16);

  color:#aeb7c7;

  border-radius:10px;

  padding:
    6px
    9px;

  font-size:12px;

  white-space:nowrap;
}

.pill b{

  color:#dce1eb;

  font-weight:700;
}

.motif{

  position:absolute;

  right:15px;

  top:15px;

  width:150px;

  height:95px;

  opacity:.4;

  pointer-events:none;
}


/* =========================
   STATUS
========================= */

.status-now{

  color:#72eabd;

  border-color:
    rgba(44,211,153,.25);

  background:
    rgba(44,211,153,.08);
}

.status-future{

  color:#9ea9ff;

  background:
    rgba(91,107,255,.08);
}

.status-ended{

  color:#7f899d;

  background:
    rgba(255,255,255,.04);
}


/* =========================
   DETAILS
========================= */

.card-details{

  display:grid;

  grid-template-rows:
    0fr;

  transition:
    grid-template-rows
    .28s
    ease;
}

.card.open .card-details{

  grid-template-rows:
    1fr;
}

.details-inner{

  overflow:hidden;
}

.details{

  border-top:
    1px solid var(--line);

  padding:
    15px
    18px
    17px
    21px;

  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(
        0,
        1fr
      )
    );

  gap:
    11px
    20px;
}

.detail-label{

  font-size:11px;

  color:#737e92;

  text-transform:uppercase;

  letter-spacing:.8px;

  margin-bottom:3px;
}

.detail-value{

  font-size:13px;

  color:#e2e6ed;

  line-height:1.35;
}


/* =========================
   STATISTICS
========================= */

.stats-page{

  display:flex;

  flex-direction:column;

  gap:14px;
}

.stats-panel{

  border:
    1px solid var(--line);

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  padding:18px;
}

.stats-title{

  margin:
    0
    0
    14px;

  font-size:21px;
}

.periods{

  display:flex;

  gap:7px;

  overflow:auto;

  margin-bottom:15px;
}

.period-btn{

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.04);

  color:var(--muted);

  padding:
    9px
    13px;

  border-radius:11px;

  cursor:pointer;

  white-space:nowrap;

  font-weight:750;
}

.period-btn.active{

  background:#f7f8fb;

  color:#111827;
}

.stat-grid{

  display:grid;

  grid-template-columns:
    repeat(
      4,
      1fr
    );

  gap:9px;
}

.stat-box{

  border:
    1px solid var(--line);

  border-radius:16px;

  background:
    rgba(0,0,0,.12);

  padding:13px;
}

.stat-box b{

  display:block;

  font-size:22px;

  margin-bottom:4px;
}

.stat-box span{

  color:var(--muted);

  font-size:11px;
}

.chart-list{

  display:flex;

  flex-direction:column;

  gap:10px;
}

.chart-row{

  display:grid;

  grid-template-columns:
    170px
    1fr
    32px;

  gap:9px;

  align-items:center;

  font-size:12px;
}

.chart-track{

  height:8px;

  border-radius:99px;

  background:
    rgba(255,255,255,.07);

  overflow:hidden;
}

.chart-fill{

  height:100%;

  border-radius:99px;

  background:
    linear-gradient(
      90deg,
      #6d72ff,
      #8b5cf6
    );
}


/* =========================
   NOTIFICATIONS
========================= */

.notify-page{

  display:flex;

  flex-direction:column;

  gap:14px;
}

.notify-panel{

  border:
    1px solid var(--line);

  border-radius:22px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  padding:18px;
}

.notify-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:14px;

  padding:
    14px
    0;

  border-bottom:
    1px solid var(--line);
}

.notify-row:last-child{
  border-bottom:0;
}

.notify-title{
  font-weight:800;
}

.notify-sub{

  margin-top:4px;

  color:var(--muted);

  font-size:12px;

  line-height:1.4;
}

.switch{

  position:relative;

  width:50px;

  height:30px;

  flex:none;
}

.switch input{

  opacity:0;

  width:0;

  height:0;
}

.slider{

  position:absolute;

  inset:0;

  border-radius:99px;

  background:#343b4d;

  cursor:pointer;

  transition:.2s;
}

.slider::before{

  content:"";

  position:absolute;

  width:22px;

  height:22px;

  left:4px;

  top:4px;

  border-radius:50%;

  background:#fff;

  transition:.2s;
}

.switch input:checked +
.slider{

  background:#2cd399;
}

.switch input:checked +
.slider::before{

  transform:
    translateX(20px);
}

.notify-actions{

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  margin-top:14px;
}

.notify-btn{

  border:
    1px solid var(--line);

  background:#121827;

  color:#fff;

  padding:
    10px
    13px;

  border-radius:12px;

  cursor:pointer;

  font-weight:750;
}

.notify-select{

  border:
    1px solid var(--line);

  background:#121827;

  color:#fff;

  padding:
    9px
    11px;

  border-radius:12px;

  outline:0;
}

.notice{

  color:var(--muted);

  font-size:12px;

  line-height:1.5;
}


/* =========================
   EMPTY
========================= */

.empty{

  border:
    1px dashed var(--line);

  border-radius:20px;

  padding:
    34px
    20px;

  color:var(--muted);

  text-align:center;
}

.loading{

  text-align:center;

  color:var(--muted);

  padding:
    60px
    0;
}

.error{

  border:
    1px
    solid
    rgba(255,90,90,.28);

  background:
    rgba(255,80,80,.07);

  padding:18px;

  border-radius:18px;

  color:#ffb5b5;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .app{

    padding:
      12px
      12px
      45px;
  }

  .header{

    align-items:flex-start;
  }

  .updated{
    display:none;
  }

  h1{
    font-size:25px;
  }

  .tabs{
    overflow:auto;
  }

  .tab{

    flex-basis:
      105px;

    font-size:12px;

    padding:
      10px
      4px;
  }

  .hero{
    padding:20px;
  }

  .hero-time{
    font-size:32px;
  }

  .hero-subject{
    font-size:21px;
  }

  .subject{
    font-size:19px;

    max-width:82%;
  }

  .details{
    grid-template-columns:1fr;
  }

  .motif{

    right:5px;

    opacity:.25;

    width:125px;
  }

  .stat-grid{

    grid-template-columns:
      repeat(
        2,
        1fr
      );
  }

  .chart-row{

    grid-template-columns:
      1fr
      auto;
  }

  .chart-track{

    grid-column:
      1 / -1;

    grid-row:2;
  }
}

@media(prefers-reduced-motion:reduce){

  *{

    scroll-behavior:auto!important;

    transition:none!important;
  }
}

</style>
</head>


<body>

<div class="app">

  <div class="top">

    <div class="header">

      <div class="brand">

        <button
          class="menu-button"
          id="menuToggle"
          aria-label="Меню"
        >
          ☰
        </button>

        <div>

          <h1>
            Расписание
          </h1>

          <div class="subtitle">
            МеждОт25-2
          </div>

        </div>

      </div>


      <div class="updated">

        <div id="updatedText">
          Загрузка…
        </div>

        <button
          class="refresh"
          id="refresh"
        >
          ↻ Обновить
        </button>

      </div>

    </div>


    <div
      class="tabs"
      id="tabs"
    >

      <button
        class="tab active"
        data-view="nearest"
      >
        Ближайшее
      </button>

      <button
        class="tab"
        data-view="today"
      >
        Сегодня
      </button>

      <button
        class="tab"
        data-view="tomorrow"
      >
        Завтра
      </button>

      <button
        class="tab"
        data-view="week"
      >
        Неделя
      </button>

      <button
        class="tab"
        data-view="month"
      >
        Месяц
      </button>

      <button
        class="tab"
        data-view="stats"
      >
        Статистика
      </button>

      <button
        class="tab"
        data-view="notifications"
      >
        Уведомления
      </button>

    </div>

  </div>


  <main
    class="content"
    id="content"
  >

    <div class="loading">
      Загружаю расписание…
    </div>

  </main>

</div>


<script>

const state = {

  data: [],

  view: "nearest"

};


let statsPeriod =
  localStorage.getItem(
    "statsPeriod"
  ) || "week";


let notificationSettings = {

  enabled: false,

  minutes: 15

};


try{

  notificationSettings =
    Object.assign(

      notificationSettings,

      JSON.parse(
        localStorage.getItem(
          "notificationSettings"
        ) || "{}"
      )

    );

}
catch{

}


let notificationTimers = [];


/* =========================
   DAYS / MONTHS
========================= */

const RU_DAYS = [

  "Воскресенье",

  "Понедельник",

  "Вторник",

  "Среда",

  "Четверг",

  "Пятница",

  "Суббота"

];


const RU_MONTHS = [

  "января",

  "февраля",

  "марта",

  "апреля",

  "мая",

  "июня",

  "июля",

  "августа",

  "сентября",

  "октября",

  "ноября",

  "декабря"

];


/* =========================
   THEMES
========================= */

const THEMES = {

  "Военная подготовка":{
    a:"#32d69b",
    b:"#65efbf",
    icon:"military"
  },

  "Бухгалтерский учет и отчетность":{
    a:"#f1c84b",
    b:"#ffe17a",
    icon:"ledger"
  },

  "Статистика":{
    a:"#9a78ff",
    b:"#c1a9ff",
    icon:"stats"
  },

  "Анализ данных":{
    a:"#42a5ff",
    b:"#79c4ff",
    icon:"data"
  },

  "Иностранный язык в сфере международных экономических отношений":{
    a:"#e36b8f",
    b:"#ff9ab6",
    icon:"language"
  },

  "Концепции современного естествознания":{
    a:"#55c9d7",
    b:"#8cebf4",
    icon:"science"
  },

  "Налоги и налоговая система Российской Федерации":{
    a:"#ff8b55",
    b:"#ffb083",
    icon:"tax"
  },

  "Принятие стратегических решений в области национальной политики":{
    a:"#c995ff",
    b:"#e0bcff",
    icon:"strategy"
  },

  "Экономическая теория":{
    a:"#4fcf87",
    b:"#8be5ad",
    icon:"economy"
  }

};


function themeFor(
  subject
){

  return (
    THEMES[
      subject
    ]

    ||

    {

      a:"#8b93ff",
      b:"#b3b9ff",
      icon:"default"

    }

  );

}


/* =========================
   HELPERS
========================= */

function esc(
  value
){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    symbol => ({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    }[symbol])

  );

}


function parseDate(
  value
){

  const [
    year,
    month,
    day
  ] =
    value
      .split("-")
      .map(Number);


  return new Date(
    year,
    month - 1,
    day
  );

}


function dateKey(
  date
){

  return date
    .toISOString()
    .slice(
      0,
      10
    );

}


function dateText(
  date
){

  return (

    `${date.getDate()} ` +

    RU_MONTHS[
      date.getMonth()
    ]

  );

}


function nowDate(){

  const date =
    new Date();

  date.setHours(
    0,
    0,
    0,
    0
  );

  return date;

}


function tomorrow(){

  const date =
    nowDate();

  date.setDate(
    date.getDate() + 1
  );

  return date;

}


function formatUpdated(){

  return (

    "Обновлено в " +

    new Date()
      .toLocaleTimeString(
        "ru-RU",
        {
          hour:"2-digit",
          minute:"2-digit"
        }
      )

  );

}


/* =========================
   STATUS
========================= */

function lessonStatus(
  lesson
){

  const now =
    new Date();


  const start =
    new Date(
      `${lesson.date}T${lesson.beginLesson}:00`
    );


  const end =
    new Date(
      `${lesson.date}T${lesson.endLesson}:00`
    );


  if(
    now >= start &&
    now < end
  ){

    return "current";

  }


  if(
    now >= end
  ){

    return "ended";

  }


  return "future";

}


/* =========================
   COUNTDOWN
========================= */

function countdown(
  milliseconds
){

  let seconds =
    Math.max(
      0,
      Math.floor(
        milliseconds / 1000
      )
    );


  const days =
    Math.floor(
      seconds / 86400
    );


  seconds %= 86400;


  const hours =
    Math.floor(
      seconds / 3600
    );


  seconds %= 3600;


  const minutes =
    Math.floor(
      seconds / 60
    );


  seconds %= 60;


  if(
    days > 0
  ){

    return (

      `${days}д ` +

      `${String(
        hours
      ).padStart(
        2,
        "0"
      )}ч ` +

      `${String(
        minutes
      ).padStart(
        2,
        "0"
      )}м`

    );

  }


  return (

    `${String(
      hours
    ).padStart(
      2,
      "0"
    )}:` +

    `${String(
      minutes
    ).padStart(
      2,
      "0"
    )}:` +

    `${String(
      seconds
    ).padStart(
      2,
      "0"
    )}`

  );

}


/* =========================
   LESSON TYPE
========================= */

function typeInfo(
  value
){

  const raw =
    String(
      value || ""
    ).trim();


  const text =
    raw.toLowerCase();


  if(
    !raw
  ){

    return "";

  }


  if(
    text.includes(
      "лекц"
    )
  ){

    return "🎓 Лекция";

  }


  if(
    text.includes(
      "семинар"
    )
    ||
    text.includes(
      "практичес"
    )
  ){

    return "📝 Семинар";

  }


  if(
    text.includes(
      "военная подготовка"
    )
  ){

    return "🪖 Военная подготовка";

  }


  return `🎓 ${raw}`;

}


/* =========================
   FIND NEXT
========================= */

function nextLesson(){

  const lessons =
    state.data
      .slice()
      .sort(
        (
          a,
          b
        ) =>

          (
            a.date +
            a.beginLesson
          ).localeCompare(

            b.date +
            b.beginLesson

          )

      );


  const current =
    lessons.find(
      lesson =>
        lessonStatus(
          lesson
        ) ===
        "current"
    );


  if(
    current
  ){

    return {

      lesson:current,

      current:true

    };

  }


  const next =
    lessons.find(
      lesson =>
        lessonStatus(
          lesson
        ) ===
        "future"
    );


  if(
    next
  ){

    return {

      lesson:next,

      current:false

    };

  }


  return null;

}

/* =========================
   GROUP BY DATE
========================= */

function groupByDate(
  items
){

  const map =
    new Map();


  items
    .sort(
      (
        a,
        b
      ) =>

        (
          a.date +
          a.beginLesson
        ).localeCompare(

          b.date +
          b.beginLesson

        )
    )
    .forEach(
      lesson => {

        if(
          !map.has(
            lesson.date
          )
        ){

          map.set(
            lesson.date,
            []
          );

        }


        map
          .get(
            lesson.date
          )
          .push(
            lesson
          );

      }
    );


  return map;

}

/* =========================
   VIEW ITEMS
========================= */

function currentItems(){

  const all =
    state.data
      .slice()
      .sort(
        (
          a,
          b
        ) =>

          (
            a.date +
            a.beginLesson
          ).localeCompare(

            b.date +
            b.beginLesson

          )
      );


  const today =
    nowDate();


  const todayKey =
    dateKey(
      today
    );


  const tomorrowKey =
    dateKey(
      tomorrow()
    );


  if(
    state.view ===
    "today"
  ){

    return all.filter(
      lesson =>
        lesson.date ===
        todayKey
    );

  }


  if(
    state.view ===
    "tomorrow"
  ){

    return all.filter(
      lesson =>
        lesson.date ===
        tomorrowKey
    );

  }


  if(
    state.view ===
    "week"
  ){

    const end =
      new Date(
        today
      );

    end.setDate(
      end.getDate() + 6
    );


    return all.filter(
      lesson => {

        const date =
          parseDate(
            lesson.date
          );


        return (

          date >=
          today

          &&

          date <=
          end

        );

      }
    );

  }


  if(
    state.view ===
    "month"
  ){

    return all.filter(
      lesson => {

        const date =
          parseDate(
            lesson.date
          );


        return (

          date.getFullYear() ===
          today.getFullYear()

          &&

          date.getMonth() ===
          today.getMonth()

        );

      }
    );

  }


  const next =
    nextLesson();


  if(
    !next
  ){

    return [];

  }


  return [

    next.lesson,

    ...all.filter(
      lesson =>
        lesson.date ===
        next.lesson.date
        &&
        lesson !==
        next.lesson
    )

  ].slice(
    0,
    8
  );

}

/* =========================
   STATISTICS DATA
========================= */

function statisticsItems(){

  const now =
    new Date();


  const start =
    new Date(
      now
    );


  const end =
    new Date(
      now
    );


  if(
    statsPeriod ===
    "week"
  ){

    const mondayIndex =
      (
        now.getDay() +
        6
      ) % 7;


    start.setDate(
      now.getDate() -
      mondayIndex
    );


    end.setDate(
      start.getDate() +
      6
    );

  }


  else if(
    statsPeriod ===
    "month"
  ){

    start.setDate(
      1
    );


    end.setMonth(
      start.getMonth() +
      1
    );


    end.setDate(
      0
    );

  }


  else{

    /*
      Для семестра берём
      текущий учебный год.
    */

    if(
      now.getMonth() < 7
    ){

      start.setFullYear(
        now.getFullYear() - 1
      );

      start.setMonth(
        8,
        1
      );

      end.setFullYear(
        now.getFullYear()
      );

      end.setMonth(
        1,
        28
      );

    }

    else{

      start.setFullYear(
        now.getFullYear()
      );

      start.setMonth(
        8,
        1
      );

      end.setFullYear(
        now.getFullYear() + 1
      );

      end.setMonth(
        1,
        28
      );

    }

  }


  const startKey =
    dateKey(
      start
    );


  const endKey =
    dateKey(
      end
    );


  return state.data.filter(
    lesson =>
      lesson.date >=
      startKey
      &&
      lesson.date <=
      endKey
  );

}

/* =========================
   NOTIFICATIONS
========================= */

function saveNotificationSettings(){

  localStorage.setItem(

    "notificationSettings",

    JSON.stringify(
      notificationSettings
    )

  );

}


async function requestNotifications(){

  if(
    !(
      "Notification"
      in
      window
    )
  ){

    alert(
      "Этот браузер не поддерживает уведомления."
    );

    return;

  }


  const permission =
    await Notification.requestPermission();


  if(
    permission ===
    "granted"
  ){

    notificationSettings.enabled =
      true;


    saveNotificationSettings();


    scheduleNotifications();


    renderNotifications();

  }

  else{

    alert(
      "Разрешение на уведомления не получено."
    );

  }

}


function scheduleNotifications(){

  notificationTimers
    .forEach(
      clearTimeout
    );


  notificationTimers = [];


  if(
    !notificationSettings.enabled
    ||
    !(
      "Notification"
      in
      window
    )
    ||
    Notification.permission !==
    "granted"
  ){

    return;

  }


  const now =
    Date.now();


  state.data
    .slice()
    .sort(
      (
        a,
        b
      ) =>

        (
          a.date +
          a.beginLesson
        ).localeCompare(

          b.date +
          b.beginLesson

        )
    )
    .forEach(
      lesson => {

        const start =
          new Date(
            `${lesson.date}T${lesson.beginLesson}:00`
          ).getTime();


        const trigger =
          start -
          (
            notificationSettings.minutes *
            60000
          );


        if(
          trigger >
          now
          &&
          trigger <
          (
            now +
            7 *
            24 *
            60 *
            60 *
            1000
          )
        ){

          const timer =
            setTimeout(
              () => {

                new Notification(
                  "Скоро пара",
                  {
                    body:
                      `${lesson.discipline} · ${lesson.beginLesson}–${lesson.endLesson}`,

                    icon:
                      "icon.png"
                  }
                );


                scheduleNotifications();

              },

              trigger -
              now
            );


          notificationTimers.push(
            timer
          );

        }

      }
    );

}


function renderNotifications(){

  document.getElementById(
    "content"
  ).innerHTML = `

    <div
      class="notify-page"
    >

      <section
        class="notify-panel"
      >

        <h2
          style="
            margin:
              0
              0
              5px;
          "
        >

          🔔 Уведомления

        </h2>


        <div
          class="notice"
        >

          Настройки сохраняются
          только на этом устройстве.

        </div>


        <div
          class="notify-row"
        >

          <div>

            <div
              class="notify-title"
            >
              Напоминать о парах
            </div>

            <div
              class="notify-sub"
            >

              Показывать уведомление
              перед началом занятия.

            </div>

          </div>


          <label

              ${
                notificationSettings.enabled
                ? "checked"

              }

            <span

            ></span>

          </label>

        </div>


        <div
          class="notify-row"
        >

          <div>

            <div
              class="notify-title"
            >
              Напомнить за
            </div>

            <div
              class="notify-sub"
            >
              Время до начала пары.
            </div>

          </div>


          <select
            class="notify-select"
            id="notifyMinutes"
          >

            <option
              value="5"
              ${
                notificationSettings.minutes === 5
                ? "selected"
                : ""
              }
            >
              5 минут
            </option>

            <option
              value="10"
              ${
                notificationSettings.minutes === 10
                ? "selected"
                : ""
              }
            >
              10 минут
            </option>

            <option
              value="15"
              ${
                notificationSettings.minutes === 15
                ? "selected"
                : ""
              }
            >
              15 минут
            </option>

            <option
              value="30"
              ${
                notificationSettings.minutes === 30
                ? "selected"
                : ""
              }
            >
              30 минут
            </option>

          </select>

        </div>


        <div
          class="notify-actions"
        >

          <button
            class="notify-btn"
            id="allowNotif"
          >
            🔔 Разрешить уведомления
          </button>


          <button
            class="notify-btn"
            id="testNotif"
          >
            Проверить
          </button>

        </div>


        <div
          class="notice"
          style="
            margin-top:14px;
          "
        >

          Это первая версия уведомлений:
          они планируются, пока страница
          открыта. Настоящие фоновые
          Push-уведомления для iPhone/iPad
          подключим следующим этапом.

        </div>

      </section>

    </div>

  `;


  document
    .getElementById(
      "notifyToggle"
    )
    .addEventListener(
      "change",
      async event => {

        if(
          event.target.checked
        ){

          await requestNotifications();

        }

        else{

          notificationSettings.enabled =
            false;


          saveNotificationSettings();


          scheduleNotifications();


          renderNotifications();

        }

      }
    );


  document
    .getElementById(
      "notifyMinutes"
    )
    .addEventListener(
      "change",
      event => {

        notificationSettings.minutes =
          Number(
            event.target.value
          );


        saveNotificationSettings();


        scheduleNotifications();

      }
    );


  document
    .getElementById(
      "allowNotif"
    )
    .addEventListener(
      "click",
      requestNotifications
    );


  document
    .getElementById(
      "testNotif"
    )
    .addEventListener(
      "click",
      async () => {

        if(
          notificationSettings.enabled ===
          false
        ){

          await requestNotifications();

        }


        if(
          "Notification"
          in
          window
          &&
          Notification.permission ===
          "granted"
        ){

          new Notification(
            "Расписание",
            {

              body:
                "Тестовое уведомление работает.",

              icon:
                "icon.png"

            }
          );

        }

      }
    );

}


/* =========================
   RENDER
========================= */

function render(){

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "active",

          button.dataset.view ===
          state.view

        );

      }
    );


  if(
    state.view ===
    "nearest"
  ){

    renderNearest();

    return;

  }


  if(
    state.view ===
    "stats"
  ){

    renderStats();

    return;

  }


  if(
    state.view ===
    "notifications"
  ){

    renderNotifications();

    return;

  }


  renderList(
    currentItems()
  );

}


/* =========================
   LOAD DATA
========================= */

async function load(){

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="loading">

      Загружаю расписание…

    </div>

  `;


  try{

    const response =
      await fetch(
        "./schedule.json?ts=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(
        data
      )
    ){

      throw new Error(
        "schedule.json должен содержать массив"
      );

    }


    state.data =
      data;


    document.getElementById(
      "updatedText"
    ).textContent =
      formatUpdated();


    render();


    scheduleNotifications();

  }

  catch(
    error
  ){

    document.getElementById(
      "content"
    ).innerHTML = `

      <div
        class="error"
      >

        <b>
          Не удалось загрузить
          schedule.json.
        </b>

        <br><br>

        Проверь, что
        <code>
          index.html
        </code>
        и
        <code>
          schedule.json
        </code>
        находятся в одной папке.

        <br><br>

        Ошибка:
        ${esc(
          error.message
        )}

      </div>

    `;

  }

}


/* =========================
   TABS
========================= */

document
  .getElementById(
    "tabs"
  )
  .addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          ".tab"
        );


      if(
        !button
      ){

        return;

      }


      state.view =
        button.dataset.view;


      render();

    }
  );


/* =========================
   MENU BUTTON
========================= */

document
  .getElementById(
    "menuToggle"
  )
  .addEventListener(
    "click",
    () => {

      alert(
        "В следующем обновлении сюда можно вынести боковое меню."
      );

    }
  );


/* =========================
   REFRESH
========================= */

document
  .getElementById(
    "refresh"
  )
  .addEventListener(
    "click",
    load
  );


/* =========================
   LIVE TIMER
========================= */

setInterval(
  () => {

    if(
      state.view ===
      "nearest"
    ){

      renderNearest();

    }

  },
  1000
);


/* =========================
   DATA UPDATE
========================= */

setInterval(
  load,
  5 * 60 * 1000
);


/* =========================
   START
========================= */

load();

</script>
