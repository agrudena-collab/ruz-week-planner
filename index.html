<!DOCTYPE html>
<html lang="ru">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#070910"
  >

  <title>РУЗ · МеждОт25-2</title>


  <style>

    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {

      --bg: #070910;

      --surface: #10131d;

      --surface-2: #141925;

      --surface-3: #191e2b;

      --text: #f6f7fb;

      --muted: #8d96a8;

      --muted-2: #687184;

      --line: rgba(255,255,255,.085);

      --line-strong: rgba(255,255,255,.14);

      --blue: #5b8cff;

      --purple: #9b70ff;

      --cyan: #43d9ff;

      --green: #2de39a;

      --red: #e65b63;

      --gold: #e6bc58;

      --pink: #ff68ad;

      --shadow:
        0 24px 70px rgba(0,0,0,.35);

      --radius-xl: 30px;

      --radius-lg: 23px;

      --radius-md: 17px;

    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      min-height: 100vh;

      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

      background:

        radial-gradient(
          circle at 8% 0%,
          rgba(91,140,255,.19),
          transparent 28%
        ),

        radial-gradient(
          circle at 92% 12%,
          rgba(155,112,255,.14),
          transparent 25%
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(67,217,255,.07),
          transparent 30%
        ),

        var(--bg);

      overflow-x: hidden;
    }


    body::before {

      content: "";

      position: fixed;

      inset: 0;

      z-index: -2;

      pointer-events: none;

      opacity: .23;

      background-image:

        linear-gradient(
          rgba(255,255,255,.025) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255,255,255,.025) 1px,
          transparent 1px
        );

      background-size: 42px 42px;
    }


    body::after {

      content: "";

      position: fixed;

      width: 520px;

      height: 520px;

      right: -280px;

      top: 30%;

      border-radius: 50%;

      pointer-events: none;

      background:
        radial-gradient(
          circle,
          rgba(91,140,255,.09),
          transparent 70%
        );

      filter: blur(20px);

      z-index: -1;
    }


    button {
      font: inherit;
    }


    /* =========================================================
       CONTAINER
    ========================================================= */

    .container {

      width:
        min(
          1080px,
          calc(100% - 28px)
        );

      margin: 0 auto;

      padding:
        25px
        0
        80px;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 20px;
    }


    .brand {

      display: flex;

      align-items: center;

      gap: 13px;
    }


    .logo {

      position: relative;

      width: 51px;

      height: 51px;

      flex: 0 0 auto;

      display: grid;

      place-items: center;

      border-radius: 17px;

      font-size: 22px;

      font-weight: 950;

      color: white;

      background:
        linear-gradient(
          135deg,
          #4e88ff,
          #9a68ff
        );

      box-shadow:
        0 12px 35px
        rgba(79,135,255,.28);

      overflow: hidden;
    }


    .logo::after {

      content: "";

      position: absolute;

      width: 35px;

      height: 35px;

      border-radius: 50%;

      right: -17px;

      top: -17px;

      background:
        rgba(255,255,255,.2);
    }


    .title {

      font-size: 30px;

      line-height: 1;

      font-weight: 950;

      letter-spacing: -1.2px;
    }


    .group {

      margin-top: 5px;

      color: var(--muted);

      font-size: 14px;

      font-weight: 650;
    }


    .header-right {

      display: flex;

      align-items: center;

      gap: 10px;
    }


    .updated {

      color: var(--muted);

      font-size: 12px;

      white-space: nowrap;
    }


    .refresh {

      border: 0;

      border-radius: 14px;

      padding:
        11px
        15px;

      color: #0a0c11;

      background: #ffffff;

      font-size: 13px;

      font-weight: 850;

      cursor: pointer;

      transition:
        transform .18s ease,
        opacity .18s ease,
        box-shadow .18s ease;
    }


    .refresh:hover {

      box-shadow:
        0 8px 25px
        rgba(255,255,255,.13);
    }


    .refresh:active {

      transform: scale(.95);
    }


    .refresh.loading {

      opacity: .55;

      pointer-events: none;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {

      position: relative;

      overflow: hidden;

      margin-bottom: 12px;

      padding: 31px;

      border:
        1px solid var(--line);

      border-radius: var(--radius-xl);

      background:

        linear-gradient(
          135deg,
          rgba(24,30,47,.96),
          rgba(10,13,21,.94)
        );

      box-shadow: var(--shadow);

      backdrop-filter: blur(20px);
    }


    .hero::before {

      content: "";

      position: absolute;

      width: 420px;

      height: 420px;

      right: -180px;

      top: -210px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(79,140,255,.28),
          transparent 67%
        );

      filter: blur(5px);

      pointer-events: none;
    }


    .hero::after {

      content: "";

      position: absolute;

      width: 200px;

      height: 200px;

      left: -130px;

      bottom: -140px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(155,112,255,.14),
          transparent 70%
        );

      pointer-events: none;
    }


    .hero-content {

      position: relative;

      z-index: 2;
    }


    .eyebrow {

      margin-bottom: 11px;

      color: var(--cyan);

      font-size: 11px;

      font-weight: 900;

      letter-spacing: 1.7px;

      text-transform: uppercase;
    }


    .live {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 12px;

      padding:
        7px
        10px;

      border-radius: 10px;

      color: #06140d;

      background: var(--green);

      font-size: 10px;

      font-weight: 950;

      letter-spacing: .4px;
    }


    .live-dot {

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background: #06140d;

      box-shadow:
        0 0 0 5px
        rgba(6,20,13,.12);
    }


    .hero-time {

      margin-bottom: 12px;

      font-size: 59px;

      line-height: .95;

      font-weight: 950;

      letter-spacing: -3.5px;
    }


    .hero-subject {

      max-width: 800px;

      margin-bottom: 18px;

      font-size: 28px;

      line-height: 1.18;

      font-weight: 900;

      letter-spacing: -.5px;
    }


    .hero-info {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;
    }


    .hero-chip {

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding:
        8px
        11px;

      border:
        1px solid var(--line);

      border-radius: 11px;

      color: #cbd1dd;

      background:
        rgba(255,255,255,.055);

      font-size: 12px;

      font-weight: 650;
    }


    /* =========================================================
       STATS
    ========================================================= */

    .stats {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-bottom: 21px;
    }


    .stat {

      position: relative;

      overflow: hidden;

      padding: 17px;

      border:
        1px solid var(--line);

      border-radius: 20px;

      background:
        rgba(16,19,29,.78);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.18);

      backdrop-filter: blur(15px);
    }


    .stat::after {

      content: "";

      position: absolute;

      width: 80px;

      height: 80px;

      right: -40px;

      bottom: -45px;

      border-radius: 50%;

      background:
        rgba(91,140,255,.09);
    }


    .stat-value {

      font-size: 25px;

      font-weight: 950;

      letter-spacing: -.7px;
    }


    .stat-label {

      margin-top: 4px;

      color: var(--muted);

      font-size: 11px;

      font-weight: 650;
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    .tabs-wrap {

      position: sticky;

      top: 7px;

      z-index: 50;

      margin-bottom: 28px;
    }


    .tabs {

      display: flex;

      gap: 5px;

      padding: 5px;

      overflow-x: auto;

      border:
        1px solid var(--line);

      border-radius: 17px;

      background:
        rgba(12,15,23,.82);

      box-shadow:
        0 12px 30px
        rgba(0,0,0,.16);

      backdrop-filter: blur(22px);

      scrollbar-width: none;
    }


    .tabs::-webkit-scrollbar {
      display: none;
    }


    .tab {

      flex: 1;

      min-width: 105px;

      padding:
        11px
        14px;

      border: 0;

      border-radius: 12px;

      color: var(--muted);

      background: transparent;

      font-size: 13px;

      font-weight: 850;

      white-space: nowrap;

      cursor: pointer;

      transition:
        color .2s ease,
        background .2s ease,
        transform .2s ease;
    }


    .tab:hover {

      color: #fff;
    }


    .tab:active {

      transform: scale(.97);
    }


    .tab.active {

      color: #111319;

      background: #fff;

      box-shadow:
        0 4px 18px
        rgba(255,255,255,.1);
    }


    /* =========================================================
       DAY
    ========================================================= */

    .day {

      margin-bottom: 35px;

      animation:
        dayAppear .35s ease both;
    }


    @keyframes dayAppear {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    .day-heading {

      display: flex;

      justify-content: space-between;

      align-items: flex-end;

      gap: 15px;

      padding:
        0
        4px
        11px;
    }


    .weekday {

      font-size: 23px;

      line-height: 1.1;

      font-weight: 950;

      text-transform: capitalize;

      letter-spacing: -.5px;
    }


    .date {

      margin-top: 4px;

      color: var(--muted);

      font-size: 12px;

      font-weight: 600;
    }


    .day-count {

      padding:
        7px
        10px;

      border:
        1px solid var(--line);

      border-radius: 11px;

      color: #b7bfce;

      background:
        rgba(255,255,255,.045);

      font-size: 10px;

      font-weight: 850;

      white-space: nowrap;
    }


    /* =========================================================
       LESSON GRID
    ========================================================= */

    .lesson-grid {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 11px;
    }


    /* =========================================================
       BASE LESSON CARD
    ========================================================= */

    .lesson {

      --accent: var(--blue);

      position: relative;

      overflow: hidden;

      padding: 18px;

      border:
        1px solid var(--line);

      border-radius: var(--radius-lg);

      background:

        linear-gradient(
          145deg,
          rgba(20,24,35,.97),
          rgba(11,14,22,.95)
        );

      box-shadow:
        0 14px 35px
        rgba(0,0,0,.22);

      cursor: pointer;

      isolation: isolate;

      transition:
        transform .24s ease,
        border-color .24s ease,
        box-shadow .24s ease;
    }


    .lesson:hover {

      transform:
        translateY(-3px);

      border-color:
        rgba(255,255,255,.16);

      box-shadow:
        0 20px 48px
        rgba(0,0,0,.31);
    }


    .lesson:active {

      transform:
        scale(.988);
    }


    /* Цветовая линия */

    .lesson::before {

      content: "";

      position: absolute;

      left: 0;

      top: 0;

      bottom: 0;

      width: 4px;

      background:
        var(--accent);

      z-index: 4;
    }


    /* Общий glow */

    .lesson::after {

      content: "";

      position: absolute;

      width: 170px;

      height: 170px;

      right: -100px;

      bottom: -110px;

      border-radius: 50%;

      background:
        var(--accent);

      opacity: .075;

      filter: blur(16px);

      pointer-events: none;

      z-index: -1;
    }


    .lesson-visual {

      position: absolute;

      inset: 0;

      overflow: hidden;

      pointer-events: none;

      z-index: -1;
    }


    .lesson-top {

      position: relative;

      z-index: 3;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 13px;
    }


    .lesson-main {

      min-width: 0;
    }


    .lesson-time {

      color:
        var(--accent);

      font-size: 14px;

      font-weight: 900;

      letter-spacing: -.1px;
    }


    .lesson-subject {

      margin-top: 8px;

      margin-bottom: 13px;

      max-width: 92%;

      font-size: 19px;

      line-height: 1.22;

      font-weight: 900;

      letter-spacing: -.25px;
    }


    .lesson-meta {

      position: relative;

      z-index: 3;

      display: flex;

      flex-wrap: wrap;

      gap: 7px;
    }


    .meta-pill {

      display: inline-flex;

      align-items: center;

      gap: 5px;

      padding:
        7px
        9px;

      border:
        1px solid
        rgba(255,255,255,.06);

      border-radius: 10px;

      color: #aeb6c5;

      background:
        rgba(255,255,255,.045);

      font-size: 10px;

      font-weight: 650;
    }


    .current-badge {

      position: relative;

      z-index: 5;

      flex: 0 0 auto;

      padding:
        6px
        8px;

      border-radius: 9px;

      color: #06140d;

      background:
        var(--green);

      font-size: 9px;

      font-weight: 950;

      letter-spacing: .3px;
    }


    /* =========================================================
       MATHEMATICS
    ========================================================= */

    .lesson.math {

      --accent: #6d8cff;
    }


    .lesson.math .lesson-visual::before {

      content: "∑";

      position: absolute;

      top: -9px;

      right: 17px;

      color:
        rgba(109,140,255,.105);

      font-size: 70px;

      line-height: 1;

      font-weight: 950;
    }


    .lesson.math .lesson-visual::after {

      content: "";

      position: absolute;

      inset: 0;

      opacity: .28;

      background-image:

        linear-gradient(
          rgba(109,140,255,.11) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(109,140,255,.11) 1px,
          transparent 1px
        );

      background-size:
        21px
        21px;

      mask-image:
        linear-gradient(
          135deg,
          transparent 5%,
          black 75%
        );
    }


    .lesson.math::after {

      width: 90px;

      height: 90px;

      right: 35px;

      bottom: -55px;

      border:
        1px solid
        rgba(109,140,255,.18);

      background:
        transparent;

      opacity: 1;

      filter: none;

      box-shadow:
        -55px -28px 0 -42px
        rgba(109,140,255,.7);
    }


    /* =========================================================
       CHINESE
    ========================================================= */

    .lesson.chinese {

      --accent: #e25a61;
    }


    .lesson.chinese .lesson-visual::before {

      content: "中文";

      position: absolute;

      top: -4px;

      right: 13px;

      color:
        rgba(226,90,97,.10);

      font-size: 48px;

      line-height: 1;

      font-weight: 900;

      letter-spacing: 4px;
    }


    .lesson.chinese .lesson-visual::after {

      content: "";

      position: absolute;

      inset: 0;

      opacity: .19;

      background-image:

        radial-gradient(
          circle,
          rgba(230,188,88,.18) 1px,
          transparent 1.5px
        );

      background-size:
        19px
        19px;

      mask-image:
        linear-gradient(
          135deg,
          transparent,
          black
        );
    }


    .lesson.chinese::after {

      width: 180px;

      height: 180px;

      right: -110px;

      bottom: -115px;

      background:
        radial-gradient(
          circle,
          rgba(230,188,88,.32),
          transparent 68%
        );

      opacity: .75;
    }


    /* =========================================================
       DATA / STATISTICS
    ========================================================= */

    .lesson.data {

      --accent: #9b70ff;
    }


    .lesson.data .lesson-visual::before {

      content: "01 10 11";

      position: absolute;

      right: 15px;

      top: 15px;

      color:
        rgba(155,112,255,.18);

      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

      font-size: 11px;

      letter-spacing: 3px;

      font-weight: 700;
    }


    .lesson.data .lesson-visual::after {

      content: "";

      position: absolute;

      right: -5px;

      bottom: 5px;

      width: 170px;

      height: 80px;

      opacity: .36;

      border-left:
        1px solid
        rgba(155,112,255,.25);

      border-bottom:
        1px solid
        rgba(155,112,255,.25);

      background:

        radial-gradient(
          circle at 20% 70%,
          rgba(155,112,255,.65) 2px,
          transparent 3px
        ),

        radial-gradient(
          circle at 42% 48%,
          rgba(155,112,255,.65) 2px,
          transparent 3px
        ),

        radial-gradient(
          circle at 65% 58%,
          rgba(155,112,255,.65) 2px,
          transparent 3px
        ),

        radial-gradient(
          circle at 88% 22%,
          rgba(155,112,255,.65) 2px,
          transparent 3px
        );
    }


    /* =========================================================
       ECONOMICS / FINANCE
    ========================================================= */

    .lesson.finance {

      --accent: #e6bc58;
    }


    .lesson.finance .lesson-visual::before {

      content: "↗";

      position: absolute;

      top: -10px;

      right: 13px;

      color:
        rgba(230,188,88,.11);

      font-size: 70px;

      font-weight: 950;
    }


    .lesson.finance .lesson-visual::after {

      content: "";

      position: absolute;

      right: 0;

      bottom: 0;

      width: 210px;

      height: 100px;

      opacity: .28;

      background:

        linear-gradient(
          150deg,
          transparent 42%,
          rgba(230,188,88,.65) 43%,
          rgba(230,188,88,.65) 44%,
          transparent 45%
        );
    }


    .lesson.finance {

      background:

        linear-gradient(
          145deg,
          rgba(25,24,20,.97),
          rgba(13,14,19,.95)
        );
    }


    /* =========================================================
       MILITARY
    ========================================================= */

    .lesson.military {

      --accent: #45cf8b;
    }


    .lesson.military .lesson-visual::before {

      content: "✦";

      position: absolute;

      top: -4px;

      right: 18px;

      color:
        rgba(69,207,139,.11);

      font-size: 52px;

      font-weight: 950;
    }


    .lesson.military .lesson-visual::after {

      content: "";

      position: absolute;

      inset: 0;

      opacity: .19;

      background:

        repeating-linear-gradient(
          135deg,
          transparent 0,
          transparent 12px,
          rgba(69,207,139,.14) 13px,
          transparent 15px
        );
    }


    /* =========================================================
       SPORT
    ========================================================= */

    .lesson.sport {

      --accent: #43d9ff;
    }


    .lesson.sport .lesson-visual::before {

      content: "↯";

      position: absolute;

      top: -6px;

      right: 17px;

      color:
        rgba(67,217,255,.11);

      font-size: 63px;

      font-weight: 950;
    }


    .lesson.sport .lesson-visual::after {

      content: "";

      position: absolute;

      right: -25px;

      bottom: -25px;

      width: 150px;

      height: 150px;

      border:
        2px solid
        rgba(67,217,255,.12);

      transform:
        rotate(45deg);
    }


    /* =========================================================
       DEFAULT
    ========================================================= */

    .lesson.default {

      --accent: #5b8cff;
    }


    .lesson.default .lesson-visual::before {

      content: "";

      position: absolute;

      width: 200px;

      height: 200px;

      right: -110px;

      top: -120px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(91,140,255,.15),
          transparent 70%
        );
    }


    /* =========================================================
       EXPANDABLE DETAILS
    ========================================================= */

    .lesson-details {

      display: grid;

      grid-template-rows: 0fr;

      margin-top: 0;

      opacity: 0;

      transition:

        grid-template-rows .3s ease,

        opacity .22s ease,

        margin-top .3s ease;
    }


    .lesson-details-inner {

      min-height: 0;

      overflow: hidden;
    }


    .lesson.expanded .lesson-details {

      grid-template-rows: 1fr;

      margin-top: 16px;

      opacity: 1;
    }


    .details-divider {

      height: 1px;

      margin-bottom: 10px;

      background:
        rgba(255,255,255,.08);
    }


    .detail-row {

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 15px;

      padding: 5px 0;

      font-size: 11px;

      line-height: 1.4;
    }


    .detail-label {

      flex: 0 0 auto;

      color:
        var(--muted-2);

      font-weight: 650;
    }


    .detail-value {

      max-width: 70%;

      color:
        #dce1e9;

      text-align: right;

      font-weight: 700;
    }


    .expand-hint {

      margin-top: 11px;

      color:
        #626c7e;

      font-size: 9px;

<script>


/* =========================================================
   STATE
========================================================= */

let schedule = [];

let currentView = "nearest";


/* =========================================================
   HELPERS
========================================================= */

function $(id) {

  return document.getElementById(id);

}


function pad(value) {

  return String(value)
    .padStart(2, "0");

}


function localDateString(
  date = new Date()
) {

  return [

    date.getFullYear(),

    pad(
      date.getMonth() + 1
    ),

    pad(
      date.getDate()
    )

  ].join("-");

}


function addDays(
  date,
  amount
) {

  const result =
    new Date(date);

  result.setDate(
    result.getDate() + amount
  );

  return result;

}


function dateFromString(
  value
) {

  return new Date(
    value + "T00:00:00"
  );

}


function formatDate(
  value
) {

  return dateFromString(
    value
  ).toLocaleDateString(
    "ru-RU",
    {
      day: "numeric",
      month: "long"
    }
  );

}


function formatWeekday(
  value
) {

  return dateFromString(
    value
  ).toLocaleDateString(
    "ru-RU",
    {
      weekday: "long"
    }
  );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   LESSON DATETIME
========================================================= */

function lessonDateTime(
  lesson,
  field
) {

  return new Date(
    `${lesson.date}T${lesson[field]}:00`
  );

}


function isCurrentLesson(
  lesson
) {

  const now =
    new Date();

  const start =
    lessonDateTime(
      lesson,
      "beginLesson"
    );

  const end =
    lessonDateTime(
      lesson,
      "endLesson"
    );

  return (
    now >= start &&
    now < end
  );

}


function hasEnded(
  lesson
) {

  return (
    new Date()
    >=
    lessonDateTime(
      lesson,
      "endLesson"
    )
  );

}


/* =========================================================
   SORT
========================================================= */

function sortLessons(
  lessons
) {

  return [
    ...lessons
  ].sort(
    (
      a,
      b
    ) => {

      const dateCompare =
        (a.date || "")
        .localeCompare(
          b.date || ""
        );


      if(
        dateCompare !== 0
      ) {

        return dateCompare;

      }


      return (
        (a.beginLesson || "")
        .localeCompare(
          b.beginLesson || ""
        )
      );

    }
  );

}


/* =========================================================
   SUBJECT TYPE
========================================================= */

function getSubjectType(
  subject = ""
) {

  const s =
    subject.toLowerCase();


  /*
    МАТЕМАТИКА
  */

  if(
    /математ|матан|алгебр|геометр|мат\.? анализ/.test(s)
  ) {

    return "math";

  }


  /*
    КИТАЙСКИЙ
  */

  if(
    /китай|кит\.?\s*язык|中文|китайск/.test(s)
  ) {

    return "chinese";

  }


  /*
    АНАЛИЗ ДАННЫХ / СТАТИСТИКА
  */

  if(
    /анализ данных|статист|data/.test(s)
  ) {

    return "data";

  }


  /*
    ЭКОНОМИКА / ФИНАНСЫ
  */

  if(
    /эконом|финанс|бухгалтер|учет|учёт|рынок/.test(s)
  ) {

    return "finance";

  }


  /*
    ВОЕННАЯ ПОДГОТОВКА
  */

  if(
    /военн|военная подготовка/.test(s)
  ) {

    return "military";

  }


  /*
    ФИЗКУЛЬТУРА
  */

  if(
    /физкультур|физическая культура|спорт/.test(s)
  ) {

    return "sport";

  }


  return "default";

}


/* =========================================================
   EXTRA FIELDS
========================================================= */

function getAddress(
  lesson
) {

  return (
    lesson.address ||
    lesson.adress ||
    lesson.location ||
    lesson.addressName ||
    lesson.fullAddress ||
    ""
  );

}


function getLessonType(
  lesson
) {

  return (
    lesson.lessonType ||
    lesson.kindOfWork ||
    lesson.kind ||
    lesson.type ||
    lesson.form ||
    ""
  );

}


/* =========================================================
   NEXT LESSON
========================================================= */

function findNextLesson() {

  const sorted =
    sortLessons(
      schedule
    );


  const current =
    sorted.find(
      lesson =>
        isCurrentLesson(
          lesson
        )
    );


  if(
    current
  ) {

    return {

      lesson:
        current,

      current:
        true

    };

  }


  const next =
    sorted.find(
      lesson =>
        !hasEnded(
          lesson
        )
    );


  if(
    next
  ) {

    return {

      lesson:
        next,

      current:
        false

    };

  }


  return null;

}


/* =========================================================
   RENDER NEXT
========================================================= */

function renderNextLesson() {

  const container =
    $("nextLesson");


  const result =
    findNextLesson();


  if(
    !result
  ) {

          </div>

          </div>

      <div class="hero-content">


        ${

          `

          `

            :

          `
          <div class="eyebrow">
            Следующая пара
          </div>
          `

        }


        <div class="hero-time">

          ${escapeHtml(
            lesson.beginLesson
          )}

          –

          ${escapeHtml(
            lesson.endLesson
          )}

        </div>


        <div class="hero-subject">

          ${escapeHtml(
            lesson.discipline ||
            "Предмет не указан"
          )}

        </div>


        <div class="hero-info">


          <span class="hero-chip">

            📅

            ${escapeHtml(
              formatWeekday(
                lesson.date
              )
            )}

            ,

            ${escapeHtml(
              formatDate(
                lesson.date
              )
            )}

          </span>


          ${
            lesson.lecturer

              ?

            `
            <span class="hero-chip">

              👨‍🏫

              ${escapeHtml(
                lesson.lecturer
              )}

            </span>
            `

              :

            ""
          }


          ${
            lesson.auditorium

              ?

            `
            <span class="hero-chip">

              🏫

              ${escapeHtml(
                lesson.auditorium
              )}

            </span>
            `

              :

            ""
          }


          ${
            lesson.building

              ?

            `
            <span class="hero-chip">

              📍

              ${escapeHtml(
                lesson.building
              )}

            </span>
            `

              :

            ""
          }


        </div>


      </div>

    </section>

  `;

}


/* =========================================================
   STATS
========================================================= */

function renderStats() {

  const today =
    localDateString();


  const todayLessons =
    schedule.filter(
      lesson =>
        lesson.date ===
        today
    );


  const totalMinutes =
    todayLessons.reduce(
      (
        total,
        lesson
      ) => {

        const start =
          lessonDateTime(
            lesson,
            "beginLesson"
          );

        const end =
          lessonDateTime(
            lesson,
            "endLesson"
          );


        return (

          total +

          Math.max(
            0,
            (
              end - start
            ) / 60000
          )

        );

      },
      0
    );


  const hours =
    Math.floor(
      totalMinutes / 60
    );


  const minutes =
    Math.round(
      totalMinutes % 60
    );


  const buildings =
    new Set(

      todayLessons

        .map(
          lesson =>
            lesson.building
        )

        .filter(Boolean)

    ).size;


  $("stats").innerHTML = `

    <div class="stat">

      <div class="stat-value">
        ${todayLessons.length}
      </div>

      <div class="stat-label">
        пар сегодня
      </div>

    </div>


    <div class="stat">

      <div class="stat-value">

        ${
          hours > 0

            ?

          `${hours}ч ${minutes}м`

            :

          `${minutes}м`
        }

      </div>

      <div class="stat-label">
        учебного времени
      </div>

    </div>


    <div class="stat">

      <div class="stat-value">
        ${buildings}
      </div>

      <div class="stat-label">
        корпуса сегодня
      </div>

    </div>

  `;

}


/* =========================================================
   LESSON CARD
========================================================= */

function renderLesson(
  lesson
) {

  const current =
    isCurrentLesson(
      lesson
    );


  const type =
    getSubjectType(
      lesson.discipline
    );


  const address =
    getAddress(
      lesson
    );


  const lessonType =
    getLessonType(
      lesson
    );


  return `

    <article

      class="
        lesson
        ${type}
        ${current ? "current" : ""}
      "

      data-lesson-id="${escapeHtml(

        lesson.date +
        "_" +
        lesson.beginLesson +
        "_" +
        lesson.discipline

      )}"

    >


      <div class="lesson-visual"></div>


      <div class="lesson-top">


        <div class="lesson-main">


          <div class="lesson-time">

            ${escapeHtml(
              lesson.beginLesson ||
              ""
            )}

            –

            ${escapeHtml(
              lesson.endLesson ||
              ""
            )}

          </div>


          <div class="lesson-subject">

            ${escapeHtml(
              lesson.discipline ||
              "Предмет не указан"
            )}

          </div>


        </div>


        ${
          current

            ?

          `
          <div class="current-badge">
            СЕЙЧАС
          </div>
          `

            :

          ""
        }


      </div>


      <div class="lesson-meta">


        ${
          lesson.lecturer

            ?

          `
          <span class="meta-pill">

            👨‍🏫

            ${escapeHtml(
              lesson.lecturer
            )}

          </span>
          `

            :

          ""
        }


        ${
          lesson.auditorium

            ?

          `
          <span class="meta-pill">

            🏫

            ${escapeHtml(
              lesson.auditorium
            )}

          </span>
          `

            :

          ""
        }


        ${
          lesson.building

            ?

          `
          <span class="meta-pill">

            📍

            ${escapeHtml(
              lesson.building
            )}

          </span>
          `

            :

          ""
        }


      </div>


      <!--
        РАСКРЫВАЕМАЯ ИНФОРМАЦИЯ
      -->

      <div class="lesson-details">


        <div class="lesson-details-inner">


          <div class="details-divider"></div>


          ${
            lesson.lecturer

              ?

            `
            <div class="detail-row">

              <span class="detail-label">
                Преподаватель
              </span>

              <span class="detail-value">
                ${escapeHtml(
                  lesson.lecturer
                )}
              </span>

            </div>
            `

              :

            ""
          }


          ${
            lesson.auditorium

              ?

            `
            <div class="detail-row">

              <span class="detail-label">
                Аудитория
              </span>

              <span class="detail-value">
                ${escapeHtml(
                  lesson.auditorium
                )}
              </span>

            </div>
            `

              :

            ""
          }


          ${
            lesson.building

              ?

            `
            <div class="detail-row">

              <span class="detail-label">
                Корпус
              </span>

              <span class="detail-value">
                ${escapeHtml(
                  lesson.building
                )}
              </span>

            </div>
            `

              :

            ""
          }


          ${
            address

              ?

            `
            <div class="detail-row">

              <span class="detail-label">
                Адрес
              </span>

              <span class="detail-value">
                ${escapeHtml(
                  address
                )}
              </span>

            </div>
            `

              :

            ""
          }


          ${
            lessonType

              ?

            `
            <div class="detail-row">

              <span class="detail-label">
                Тип занятия
              </span>

              <span class="detail-value">
                ${escapeHtml(
                  lessonType
                )}
              </span>

            </div>
            `

              :

            ""
          }


          <div class="expand-hint">

            Нажмите, чтобы свернуть

          </div>


        </div>


      </div>


    </article>

  `;

}


/* =========================================================
   FILTER
========================================================= */

function getLessons() {

  const today =
    new Date();


  const todayString =
    localDateString(
      today
    );


  /* Сегодня */

  if(
    currentView === "today"
  ) {

    return schedule.filter(
      lesson =>
        lesson.date ===
        todayString
    );

  }


  /* Завтра */

  if(
    currentView === "tomorrow"
  ) {

    const tomorrow =
      localDateString(
        addDays(
          today,
          1
        )
      );


    return schedule.filter(
      lesson =>
        lesson.date ===
        tomorrow
    );

  }


  /* Неделя */

  if(
    currentView === "week"
  ) {

    const end =
      localDateString(
        addDays(
          today,
          6
        )
      );


    return schedule.filter(
      lesson =>

        lesson.date >=
        todayString

        &&

        lesson.date <=
        end

    );

  }


  /* Месяц */

  if(
    currentView === "month"
  ) {

    const end =
      localDateString(
        addDays(
          today,
          29
        )
      );


    return schedule.filter(
      lesson =>

        lesson.date >=
        todayString

        &&

        lesson.date <=
        end

    );

  }


  /*
    БЛИЖАЙШЕЕ
  */

  const futureDates = [

    ...new Set(

      sortLessons(
        schedule
      )

        .filter(
          lesson =>
            lesson.date >=
            todayString
        )

        .map(
          lesson =>
            lesson.date
        )

    )

  ];


  if(
    !futureDates.length
  ) {

    return [];

  }


  return schedule.filter(
    lesson =>
      lesson.date ===
      futureDates[0]
  );

}


/* =========================================================
   EMPTY STATE
========================================================= */

function renderEmptyState() {

  let title =
    "Занятий нет";


  let text =
    "В выбранном периоде занятий не найдено.";


  if(
    currentView === "today"
  ) {

    title =
      "Сегодня свободный день";


    text =
      "На сегодня занятий нет.";

  }


  if(
    currentView === "tomorrow"
  ) {

    title =
      "Завтра занятий нет";


    text =
      "Можно спокойно планировать день.";

  }


  if(
    currentView === "week"
  ) {

    title =
      "Неделя свободна";


    text =
      "На ближайшие 7 дней занятий нет.";

  }


  if(
    currentView === "month"
  ) {

    title =
      "Занятий нет";


    text =
      "На ближайшие 30 дней занятий нет.";

  }


  return `

    <div class="empty">

      <div class="empty-icon">
        ✦
      </div>

      <div class="empty-title">
        ${title}
      </div>

      <div class="empty-text">
        ${text}
      </div>

    </div>

  `;

}


/* =========================================================
   MAIN RENDER
========================================================= */

function renderSchedule() {

  const container =
    $("schedule");


  const lessons =
    getLessons();


  if(
    !lessons.length
  ) {

    container.innerHTML =
      renderEmptyState();

    return;

  }


  const grouped = {};


  lessons.forEach(
    lesson => {

      if(
        !grouped[
          lesson.date
        ]
      ) {

        grouped[
          lesson.date
        ] = [];

      }


      grouped[
        lesson.date
      ].push(
        lesson
      );

    }
  );


  const dates =
    Object.keys(
      grouped
    ).sort();


  container.innerHTML =

    dates

      .map(
        date => {

          const dayLessons =
            sortLessons(
              grouped[date]
            );


          const count =
            dayLessons.length;


          const countText =

            count === 1

              ?

            "пара"

              :

            count < 5

              ?

            "пары"

              :

            "пар";


          return `

            <section class="day">


              <div class="day-heading">


                <div>


                  <div class="weekday">

                    ${escapeHtml(
                      formatWeekday(
                        date
                      )
                    )}

                  </div>


                  <div class="date">

                    ${escapeHtml(
                      formatDate(
                        date
                      )
                    )}

                  </div>


                </div>


                <div class="day-count">

                  ${count}

                  ${countText}

                </div>


              </div>


              <div class="lesson-grid">


                ${dayLessons

                  .map(
                    renderLesson
                  )

                  .join("")

                }


              </div>


            </section>

          `;

        }
      )

      .join("");

}


/* =========================================================
   LOAD SCHEDULE
========================================================= */

async function loadSchedule() {

  const button =
    $("refreshButton");


  const updated =
    $("updated");


  button.classList.add(
    "loading"
  );


  button.textContent =
    "↻ Обновление...";


  try {


    const response =
      await fetch(
        "schedule.json?t=" +
        Date.now()
      );


    if(
      !response.ok
    ) {

      throw new Error(
        "Не удалось загрузить schedule.json"
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data)
    ) {

      throw new Error(
        "schedule.json имеет неверный формат"
      );

    }


    schedule =
      sortLessons(

        data.filter(
          lesson =>
            lesson.date
        )

      );


    updated.textContent =
      "Обновлено в " +

      new Date()
        .toLocaleTimeString(
          "ru-RU",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


    renderNextLesson();

    renderStats();

    renderSchedule();


  }

  catch(error) {


    console.error(
      error
    );


    $("schedule").innerHTML = `

      <div class="error">

        <strong>
          Не удалось загрузить расписание
        </strong>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;


  }

  finally {


    button.classList.remove(
      "loading"
    );


    button.textContent =
      "↻ Обновить";

  }

}


/* =========================================================
   TAB BUTTONS
========================================================= */

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {


      button.addEventListener(
        "click",
        () => {


          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentView =
            button.dataset.view;


          renderSchedule();


          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });


        }
      );


    }
  );


/* =========================================================
   CARD EXPANSION
========================================================= */

document.addEventListener(
  "click",
  event => {


    const card =
      event.target.closest(
        ".lesson"
      );


    if(
      !card
    ) {

      return;

    }


    /*
      Закрываем остальные карточки,
      чтобы одновременно не было
      огромного количества раскрытых
      блоков.
    */

    document
      .querySelectorAll(
        ".lesson.expanded"
      )
      .forEach(
        item => {

          if(
            item !== card
          ) {

            item.classList.remove(
              "expanded"
            );

          }

        }
      );


    card.classList.toggle(
      "expanded"
    );


  }
);


/* =========================================================
   REFRESH BUTTON
========================================================= */

$("refreshButton")
  .addEventListener(
    "click",
    loadSchedule
  );


/* =========================================================
   INITIAL LOAD
========================================================= */

loadSchedule();


/* =========================================================
   LIVE CLOCK / CURRENT LESSON
========================================================= */

setInterval(
  () => {

    renderNextLesson();

    renderStats();

    renderSchedule();

  },
  60 * 1000
);


/* =========================================================
   DATA REFRESH
========================================================= */

setInterval(
  loadSchedule,
  5 * 60 * 1000
);

</script>


</body>

</html>
