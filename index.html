<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Расписание — МеждОт25-2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 20px 50px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 32px;
    }

    .subtitle {
      color: #6e6e73;
      font-size: 16px;
    }

    .updated {
      color: #8e8e93;
      font-size: 13px;
      margin-top: 7px;
    }

    .refresh {
      float: right;
      border: 0;
      background: #007aff;
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .tabs-wrapper {
      overflow-x: auto;
      margin-bottom: 28px;
      scrollbar-width: none;
    }

    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tabs {
      display: flex;
      gap: 4px;
      min-width: max-content;
      background: #e5e5ea;
      border-radius: 14px;
      padding: 3px;
    }

    .tab {
      border: 0;
      background: transparent;
      padding: 11px 17px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 600;
      color: #6e6e73;
      cursor: pointer;
      white-space: nowrap;
    }

    .tab.active {
      background: white;
      color: #1d1d1f;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .day {
      margin-bottom: 30px;
    }

    .date {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: capitalize;
    }

    .lesson {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .time {
      font-size: 15px;
      font-weight: 700;
      color: #007aff;
      margin-bottom: 7px;
    }

    .discipline {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .info {
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.6;
    }

    .today {
      border: 2px solid #007aff;
    }

    .today-label {
      display: inline-block;
      background: #007aff;
      color: white;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 8px;
      vertical-align: middle;
    }

    .empty {
      text-align: center;
      color: #6e6e73;
      padding: 55px 20px;
      font-size: 17px;
    }

    .loading {
      color: #6e6e73;
      text-align: center;
      padding: 40px 0;
    }

    .error {
      background: #fff0f0;
      color: #c00;
      padding: 16px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 14px 40px;
      }

      h1 {
        font-size: 27px;
      }

      .date {
        font-size: 20px;
      }

      .lesson {
        padding: 15px;
      }

      .tab {
        padding: 10px 14px;
        font-size: 14px;
      }

      .refresh {
        padding: 9px 12px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>

    <button class="refresh" onclick="loadSchedule()">
      ↻ Обновить
    </button>

    <h1>Расписание</h1>

    <div class="subtitle">
      МеждОт25-2
    </div>

    <div class="updated" id="updated">
      Загружаем расписание...
    </div>

  </header>


  <div class="tabs-wrapper">

    <div class="tabs">

      <button
        class="tab active"
        data-mode="next"
        onclick="setMode('next')">
        Ближайшее
      </button>

      <button
        class="tab"
        data-mode="today"
        onclick="setMode('today')">
        Сегодня
      </button>

      <button
        class="tab"
        data-mode="tomorrow"
        onclick="setMode('tomorrow')">
        Завтра
      </button>

      <button
        class="tab"
        data-mode="week"
        onclick="setMode('week')">
        Неделя
      </button>

      <button
        class="tab"
        data-mode="month"
        onclick="setMode('month')">
        Месяц
      </button>

    </div>

  </div>


  <main id="schedule">

    <div class="loading">
      Загружаем расписание...
    </div>

  </main>

</div>


<script>

  let allLessons = [];

  let currentMode = "next";


  // Получение локальной даты без проблем с UTC
  function getLocalDateString(date = new Date()) {

    const year = date.getFullYear();

    const month =
      String(date.getMonth() + 1).padStart(2, "0");

    const day =
      String(date.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  // Добавление дней
  function addDays(date, days) {

    const result = new Date(date);

    result.setDate(
      result.getDate() + days
    );

    return result;
  }


  // Красивое отображение даты
  function formatDate(dateString) {

    const date =
      new Date(dateString + "T00:00:00");

    return date.toLocaleDateString(
      "ru-RU",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );
  }


  // Группируем расписание по датам
  function groupLessons() {

    const grouped = {};

    for (const lesson of allLessons) {

      if (!lesson.date) {
        continue;
      }

      if (!grouped[lesson.date]) {
        grouped[lesson.date] = [];
      }

      grouped[lesson.date].push(lesson);
    }


    for (const date in grouped) {

      grouped[date].sort(
        (a, b) =>
          (a.beginLesson || "")
            .localeCompare(
              b.beginLesson || ""
            )
      );

    }


    return grouped;
  }


  // Создание карточки занятия
  function createLessonElement(
    lesson,
    isToday
  ) {

    const element =
      document.createElement("div");

    element.className = "lesson";


    if (isToday) {
      element.classList.add("today");
    }


    const begin =
      lesson.beginLesson || "";

    const end =
      lesson.endLesson || "";

    const discipline =
      lesson.discipline ||
      "Предмет не указан";

    const lecturer =
      lesson.lecturer ||
      "Преподаватель не указан";

    const auditorium =
      lesson.auditorium || "";

    const building =
      lesson.building || "";


    element.innerHTML = `

      <div class="time">
        ${begin}–${end}
      </div>

      <div class="discipline">
        ${discipline}
      </div>

      <div class="info">

        👨‍🏫 ${lecturer}

        ${
          auditorium
            ? `<br>🏫 ${auditorium}`
            : ""
        }

        ${
          building
            ? `<br>📍 ${building}`
            : ""
        }

      </div>

    `;


    return element;
  }


  // Отображение одного дня
  function renderDay(
    date,
    lessons
  ) {

    const container =
      document.getElementById(
        "schedule"
      );


    const today =
      getLocalDateString();


    const day =
      document.createElement(
        "section"
      );

    day.className = "day";


    const dateElement =
      document.createElement(
        "div"
      );

    dateElement.className =
      "date";


    dateElement.innerHTML = `
      ${formatDate(date)}

      ${
        date === today
          ? '<span class="today-label">СЕГОДНЯ</span>'
          : ""
      }
    `;


    day.appendChild(
      dateElement
    );


    for (
      const lesson of lessons
    ) {

      day.appendChild(
        createLessonElement(
          lesson,
          date === today
        )
      );

    }


    container.appendChild(day);
  }


  // Пустой экран
  function showEmpty(text) {

    document.getElementById(
      "schedule"
    ).innerHTML = `

      <div class="empty">
        ${text}
      </div>

    `;
  }


  // Отрисовка расписания
  function renderSchedule() {

    const grouped =
      groupLessons();


    const dates =
      Object.keys(grouped)
        .sort();


    const today =
      new Date();


    const todayString =
      getLocalDateString(
        today
      );


    const tomorrowString =
      getLocalDateString(
        addDays(today, 1)
      );


    const container =
      document.getElementById(
        "schedule"
      );


    container.innerHTML = "";


    // -------------------------
    // БЛИЖАЙШЕЕ
    // -------------------------

    if (
      currentMode === "next"
    ) {

      const futureDates =
        dates.filter(
          date =>
            date >= todayString
        );


      if (
        futureDates.length === 0
      ) {

        showEmpty(
          "Ближайших занятий нет."
        );

        return;
      }


      const nextDate =
        futureDates[0];


      renderDay(
        nextDate,
        grouped[nextDate]
      );


      return;
    }


    // -------------------------
    // СЕГОДНЯ
    // -------------------------

    if (
      currentMode === "today"
    ) {

      if (
        grouped[todayString]
      ) {

        renderDay(
          todayString,
          grouped[todayString]
        );

      } else {

        showEmpty(
          "Сегодня занятий нет."
        );

      }


      return;
    }


    // -------------------------
    // ЗАВТРА
    // -------------------------

    if (
      currentMode === "tomorrow"
    ) {

      if (
        grouped[tomorrowString]
      ) {

        renderDay(
          tomorrowString,
          grouped[tomorrowString]
        );

      } else {

        showEmpty(
          "Завтра занятий нет."
        );

      }


      return;
    }


    // -------------------------
    // НЕДЕЛЯ
    // -------------------------

    if (
      currentMode === "week"
    ) {

      const endDate =
        getLocalDateString(
          addDays(today, 7)
        );


      const weekDates =
        dates.filter(
          date =>
            date >= todayString &&
            date <= endDate
        );


      if (
        weekDates.length === 0
      ) {

        showEmpty(
          "На ближайшие 7 дней занятий нет."
        );

        return;
      }


      for (
        const date of weekDates
      ) {

        renderDay(
          date,
          grouped[date]
        );

      }


      return;
    }


    // -------------------------
    // МЕСЯЦ
    // -------------------------

    if (
      currentMode === "month"
    ) {

      const endDate =
        getLocalDateString(
          addDays(today, 30)
        );


      const monthDates =
        dates.filter(
          date =>
            date >= todayString &&
            date <= endDate
        );


      if (
        monthDates.length === 0
      ) {

        showEmpty(
          "На ближайшие 30 дней занятий нет."
        );

        return;
      }


      for (
        const date of monthDates
      ) {

        renderDay(
          date,
          grouped[date]
        );

      }


      return;
    }

  }


  // Переключение вкладок
  function setMode(mode) {

    currentMode =
      mode;


    document
      .querySelectorAll(".tab")
      .forEach(tab => {

        tab.classList.toggle(
          "active",
          tab.dataset.mode === mode
        );

      });


    renderSchedule();
  }


  // Загрузка schedule.json
  async function loadSchedule() {

    const container =
      document.getElementById(
        "schedule"
      );


    container.innerHTML = `

      <div class="loading">
        Загружаем расписание...
      </div>

    `;


    try {

      const response =
        await fetch(
          "schedule.json?t=" +
          Date.now()
        );


      if (!response.ok) {

        throw new Error(
          "Не удалось загрузить schedule.json"
        );

      }


      const schedule =
        await response.json();


      if (
        !Array.isArray(schedule)
      ) {

        throw new Error(
          "schedule.json имеет неверный формат"
        );

      }


      allLessons =
        schedule;


      const now =
        new Date();


      document.getElementById(
        "updated"
      ).textContent =
        "Актуальное расписание • обновлено в " +
        now.toLocaleTimeString(
          "ru-RU",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      renderSchedule();


    } catch (error) {

      container.innerHTML = `

        <div class="error">

          Ошибка загрузки расписания:<br>

          ${error.message}

        </div>

      `;


      console.error(error);

    }

  }


  // Запуск
  loadSchedule();

</script>

</body>
</html>
