<style>

:root{
  --bg:#07090f;
  --surface:#10131c;
  --surface2:#151925;
  --text:#f7f8fb;
  --muted:#8e96a8;
  --line:rgba(255,255,255,.09);

  --blue:#4f8cff;
  --purple:#9b6cff;
  --green:#27df91;
  --yellow:#ffd166;
  --pink:#ff5ca8;
  --cyan:#42d9ff;

  --shadow:0 25px 70px rgba(0,0,0,.35);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(79,140,255,.22),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 15%,
      rgba(155,108,255,.18),
      transparent 25%
    ),
    var(--bg);

  min-height:100vh;
}

body::before{
  content:"";

  position:fixed;
  inset:0;

  pointer-events:none;

  opacity:.28;

  background-image:
    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px
    );

  background-size:38px 38px;
}

button{
  font:inherit;
}

.container{
  width:min(
    1050px,
    calc(100% - 28px)
  );

  margin:auto;

  padding:
    25px
    0
    80px;
}


/* =========================
   HEADER
========================= */

.header{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;
}

.brand{
  display:flex;

  gap:13px;

  align-items:center;
}


/* Буква R больше не используется */

.logo{
  display:none;
}

.title{
  font-size:30px;

  font-weight:900;

  letter-spacing:-1px;
}

.group{
  color:var(--muted);

  font-weight:650;

  margin-top:3px;
}

.header-right{
  display:flex;

  align-items:center;

  gap:10px;
}

.updated{
  color:var(--muted);

  font-size:12px;
}

.refresh{
  border:0;

  border-radius:14px;

  padding:11px 14px;

  background:#fff;

  color:#080a0f;

  font-weight:800;

  cursor:pointer;

  transition:
    transform .2s,
    opacity .2s;
}

.refresh:active{
  transform:scale(.95);
}

.refresh.loading{
  opacity:.55;
}


/* =========================
   HERO
========================= */

.hero{
  position:relative;

  overflow:hidden;

  border:
    1px solid var(--line);

  border-radius:30px;

  padding:30px;

  margin-bottom:13px;

  background:
    linear-gradient(
      135deg,
      rgba(24,30,47,.96),
      rgba(12,15,25,.92)
    );

  box-shadow:var(--shadow);

  backdrop-filter:blur(20px);
}

.hero::after{
  content:"";

  position:absolute;

  width:360px;
  height:360px;

  border-radius:50%;

  right:-130px;
  top:-170px;

  background:
    radial-gradient(
      circle,
      rgba(79,140,255,.35),
      transparent 65%
    );

  filter:blur(5px);
}

.hero-content{
  position:relative;

  z-index:1;
}

.eyebrow{
  font-size:12px;

  text-transform:uppercase;

  letter-spacing:1.5px;

  color:var(--cyan);

  font-weight:900;

  margin-bottom:12px;
}

.live{
  display:inline-flex;

  align-items:center;

  gap:8px;

  color:#07120d;

  background:var(--green);

  padding:7px 10px;

  border-radius:10px;

  font-size:11px;

  font-weight:900;

  margin-bottom:12px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#07120d;

  box-shadow:
    0 0 0 5px
    rgba(7,18,13,.12);
}

.hero-time{
  font-size:58px;

  line-height:1;

  font-weight:950;

  letter-spacing:-3px;

  margin-bottom:12px;
}

.hero-subject{
  font-size:28px;

  font-weight:900;

  max-width:750px;

  margin-bottom:18px;
}

.chips{
  display:flex;

  flex-wrap:wrap;

  gap:8px;
}

.chip{
  padding:9px 11px;

  border:
    1px solid var(--line);

  background:
    rgba(255,255,255,.055);

  border-radius:12px;

  color:#cbd1dd;

  font-size:13px;

  font-weight:650;
}


/* =========================
   STATS
========================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

  margin-bottom:20px;
}

.stat{
  border:
    1px solid var(--line);

  background:
    rgba(16,19,28,.78);

  border-radius:20px;

  padding:17px;

  box-shadow:
    0 12px 30px
    rgba(0,0,0,.18);
}

.stat-value{
  font-size:25px;

  font-weight:900;
}

.stat-label{
  color:var(--muted);

  font-size:12px;

  margin-top:4px;
}


/* =========================
   TABS / MENU
========================= */

.tabs-wrap{
  position:fixed;

  top:0;
  left:0;

  z-index:100;

  width:320px;
  max-width:85vw;

  height:100vh;

  padding:80px 18px 20px;

  background:
    rgba(12,15,24,.97);

  backdrop-filter:blur(25px);

  border-right:
    1px solid var(--line);

  box-shadow:
    25px 0 70px
    rgba(0,0,0,.35);

  transform:
    translateX(-105%);

  transition:
    transform .25s ease;
}

.tabs-wrap.open{
  transform:
    translateX(0);
}

.tabs{
  display:flex;

  flex-direction:column;

  gap:7px;

  padding:0;

  background:transparent;

  border:0;

  overflow:visible;
}

.tab{
  width:100%;

  border:0;

  background:
    rgba(255,255,255,.045);

  color:var(--muted);

  padding:15px 16px;

  border-radius:14px;

  font-weight:800;

  cursor:pointer;

  text-align:left;

  white-space:nowrap;

  transition:.2s;
}

.tab:hover{
  color:white;
}

.tab.active{
  color:#111;

  background:#fff;

  box-shadow:
    0 4px 18px
    rgba(255,255,255,.12);
}


/* Затемнение */

.menu-overlay{
  position:fixed;

  inset:0;

  z-index:90;

  background:
    rgba(0,0,0,.45);

  opacity:0;

  pointer-events:none;

  transition:.25s;
}

.menu-overlay.open{
  opacity:1;

  pointer-events:auto;
}


/* Кнопка меню */

.menu-button{
  position:fixed;

  top:
    calc(
      env(safe-area-inset-top)
      + 14px
    );

  left:14px;

  z-index:110;

  width:48px;
  height:48px;

  border:
    1px solid var(--line);

  border-radius:15px;

  background:
    rgba(20,24,35,.92);

  color:#fff;

  font-size:23px;

  display:grid;

  place-items:center;

  cursor:pointer;

  backdrop-filter:blur(15px);

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.25);
}


/* =========================
   DAYS
========================= */

.day{
  margin-bottom:34px;
}

.day-heading{
  display:flex;

  justify-content:space-between;

  align-items:end;

  padding:
    0
    4px
    11px;
}

.weekday{
  font-size:23px;

  font-weight:900;

  text-transform:capitalize;
}

.date{
  color:var(--muted);

  font-size:13px;

  margin-top:3px;
}

.count{
  color:#b8c0cf;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid var(--line);

  padding:7px 10px;

  border-radius:12px;

  font-size:11px;

  font-weight:800;
}


/* =========================
   CARDS
========================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:11px;
}

.lesson{
  position:relative;

  overflow:hidden;

  border:
    1px solid var(--line);

  border-radius:22px;

  padding:18px;

  background:
    linear-gradient(
      145deg,
      rgba(20,24,35,.96),
      rgba(12,15,23,.92)
    );

  box-shadow:
    0 14px 35px
    rgba(0,0,0,.2);

  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s;
}

.lesson:hover{
  transform:
    translateY(-3px);

  border-color:
    rgba(255,255,255,.18);

  box-shadow:
    0 20px 45px
    rgba(0,0,0,.3);
}

.lesson::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:4px;

  background:
    var(--accent,var(--blue));
}

.lesson::after{
  content:"";

  position:absolute;

  width:150px;
  height:150px;

  border-radius:50%;

  right:-90px;
  bottom:-100px;

  background:
    var(--accent,var(--blue));

  opacity:.12;

  filter:blur(15px);
}

.lesson.current{
  border-color:
    rgba(39,223,145,.55);

  box-shadow:
    0 0 0 1px
    rgba(39,223,145,.12),

    0 20px 55px
    rgba(39,223,145,.1);
}

.lesson-top{
  display:flex;

  justify-content:space-between;

  gap:12px;
}

.time{
  color:
    var(--accent,var(--blue));

  font-weight:900;

  font-size:15px;
}

.subject{
  font-size:20px;

  font-weight:900;

  line-height:1.18;

  margin:
    9px
    0
    13px;

  max-width:90%;
}

.meta{
  display:flex;

  flex-wrap:wrap;

  gap:7px;
}

.meta span{
  font-size:11px;

  color:#aeb6c5;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid
    rgba(255,255,255,.06);

  padding:7px 9px;

  border-radius:10px;
}

.badge{
  font-size:9px;

  font-weight:950;

  color:#07120d;

  background:
    var(--green);

  height:max-content;

  padding:6px 8px;

  border-radius:9px;
}


/* =========================
   EMPTY / ERROR
========================= */

.empty,
.error{
  padding:
    45px
    20px;

  text-align:center;

  border:

  border-radius:22px;

  background:
    rgba(16,19,28,.75);

  color:var(--muted);
}

.empty strong,
.error strong{
  display:block;

  color:var(--text);

  font-size:19px;

.source{

/* =========================

========================= */

  padding:
  env(safe-area-inset-top)

        80px +

  body{

  }

<body>

<div class="container">


<header class="header">

  <div class="brand">

    <div>

      <div class="title">

  id="stats"

  <div class="empty">

  </div>

<div class="source">

  Автоматически обновляется из РУЗ · МеждОт25-2

</div>

<script>

let schedule = [];

let currentView = "nearest";


const $ = id =>
  document.getElementById(id);


const pad = n =>
  String(n).padStart(2,"0");


function localDateString(
  d = new Date()
){

  return (
    d.getFullYear()
    + "-"
    + pad(d.getMonth()+1)
    + "-"
    + pad(d.getDate())
  );

}


function addDays(
  d,
  n
){

  const x =
    new Date(d);

  x.setDate(
    x.getDate() + n
  );

  return x;

}


function dateFromString(v){

  return new Date(
    v + "T00:00:00"
  );

}


function formatDate(v){

  return dateFromString(v)
    .toLocaleDateString(
      "ru-RU",
      {
        day:"numeric",
        month:"long"
      }
    );

}


function formatWeekday(v){

  return dateFromString(v)
    .toLocaleDateString(
      "ru-RU",
      {
        weekday:"long"
      }
    );

}


function esc(v){

  return String(
    v ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function dt(
  lesson,
  field
){

  return new Date(
    `${lesson.date}T${lesson[field]}:00`
  );

}


function current(lesson){

  const now =
    new Date();

  return (
    now >= dt(
      lesson,
      "beginLesson"
    )
    &&
    now <
    dt(
      lesson,
      "endLesson"
    )
  );

}


function ended(lesson){

  return (
    new Date()
    >=
    dt(
      lesson,
      "endLesson"
    )
  );

}


function sort(lessons){

  return [...lessons].sort(
    (a,b) =>

      (a.date || "")
      .localeCompare(
        b.date || ""
      )

      ||

      (a.beginLesson || "")
      .localeCompare(
        b.beginLesson || ""
      )

  );

}


/* =========================
   ЦВЕТ ПРЕДМЕТА
========================= */

function accent(
  subject = ""
){

  const s =
    subject.toLowerCase();


  if(
    /статист|математ|анализ/.test(s)
  ){

    return "#9b6cff";

  }


  if(
    /китай|кит|язык/.test(s)
  ){

    return "#ff5ca8";

  }


  if(
    /англ|english/.test(s)
  ){

    return "#42d9ff";

  }


  if(
    /бух|учет|финанс/.test(s)
  ){

    return "#ffd166";

  }


  if(
    /военн|физ|спорт/.test(s)
  ){

    return "#27df91";

  }


  return "#4f8cff";

}


/* =========================
   NEXT LESSON
========================= */

function next(){

  const sorted =
    sort(schedule);


  const c =
    sorted.find(
      current
    );


  if(c){

    return {
      lesson:c,
      current:true
    };

  }


  const n =
    sorted.find(
      x =>
        !ended(x)
    );


  return n
    ? {
        lesson:n,
        current:false
      }
    : null;

}


function renderNext(){

  const result =
    next();

  const container =
    $("nextLesson");


  /*
   * Следующая пара показывается
   * только на главной странице
   * «Ближайшее».
   */

  if(
    currentView !== "nearest"
  ){

    container.innerHTML = "";

    return;

  }


  if(!result){

    container.innerHTML = `

      <section class="hero">

        <div class="hero-content">

          <div class="eyebrow">
            Расписание
          </div>

          <div class="hero-subject">
            Ближайших занятий нет ✨
          </div>

        </div>

      </section>

    `;

    return;

  }


  const lesson =
    result.lesson;


  container.innerHTML = `

    <section class="hero">

      <div class="hero-content">

        ${
          result.current

            ?

          `
          <div class="live">

            <span class="dot"></span>

            СЕЙЧАС ИДЁТ

          </div>
          `

            :

          `
          <div class="eyebrow">
            Следующая пара
          </div>
          `
        }


        <div class="hero-time">

          ${esc(
            lesson.beginLesson
          )}

          –

          ${esc(
            lesson.endLesson
          )}

        </div>


        <div class="hero-subject">

          ${esc(
            lesson.discipline ||
            "Предмет не указан"
          )}

        </div>


        <div class="chips">

          <span class="chip">

            📅

            ${esc(
              formatWeekday(
                lesson.date
              )
            )}

            ,

            ${esc(
              formatDate(
                lesson.date
              )
            )}

          </span>


          ${
            lesson.lecturer

              ?

            `
            <span class="chip">

              👨‍🏫

              ${esc(
                lesson.lecturer
              )}

            </span>
            `

              :

            ""
          }


          ${
            lesson.auditorium

              ?

            `
            <span class="chip">

              🏫

              ${esc(
                lesson.auditorium
              )}

            </span>
            `

              :

            ""
          }


          ${
            lesson.building

              ?

            `
            <span class="chip">

              📍

              ${esc(
                lesson.building
              )}

            </span>
            `

              :

            ""
          }

        </div>

      </div>

    </section>

  `;

}


/* =========================
   STATS
========================= */

function renderStats(){

  /*
   * Статистика показывается
   * только на «Ближайшее»
   * и «Сегодня».
   */

  const stats =
    $("stats");


  if(
    currentView !== "nearest"
    &&
    currentView !== "today"
  ){

    stats.innerHTML = "";

    stats.style.display =
      "none";

    return;

  }


  stats.style.display =
    "grid";


  const today =
    localDateString();


  const lessons =
    schedule.filter(
      x =>
        x.date === today
    );


  const minutes =
    lessons.reduce(
      (
        total,
        lesson
      ) =>

        total +

        Math.max(
          0,

          (
            dt(
              lesson,
              "endLesson"
            )
            -
            dt(
              lesson,
              "beginLesson"
            )
          )
          /
          60000
        ),

      0
    );


  const hours =
    Math.floor(
      minutes / 60
    );


  const mins =
    Math.round(
      minutes % 60
    );


  const buildings =
    new Set(

      lessons

        .map(
          x =>
            x.building
        )

        .filter(Boolean)

    ).size;


  $("stats").innerHTML = `

    <div class="stat">

      <div class="stat-value">
        ${lessons.length}
      </div>

      <div class="stat-label">
        пар сегодня
      </div>

    </div>


    <div class="stat">

      <div class="stat-value">

        ${
          hours

            ?

          `${hours}ч ${mins}м`

            :

          `${mins}м`
        }

      </div>

      <div class="stat-label">
        учебного времени
      </div>

    </div>


    <div class="stat">

      <div class="stat-value">
        ${buildings}
      </div>

      <div class="stat-label">
        корпуса сегодня
      </div>

    </div>

  `;

}


/* =========================
   LESSON CARD
========================= */

function lessonCard(
  lesson
){

  const isNow =
    current(lesson);


  const color =
    accent(
      lesson.discipline
    );


  return `

    <article

      class="lesson
      ${isNow ? "current" : ""}"

      style="
        --accent:${color};
      "

    >

      <div class="lesson-top">

        <div>

          <div class="time">

            ${esc(
              lesson.beginLesson
            )}

            –

            ${esc(
              lesson.endLesson
            )}

          </div>


          <div class="subject">

            ${esc(
              lesson.discipline ||
              "Предмет не указан"
            )}

          </div>

        </div>


        ${
          isNow

            ?

          `
          <div class="badge">
            СЕЙЧАС
          </div>
          `

            :

          ""
        }

      </div>


      <div class="meta">

        ${
          lesson.lecturer

            ?

          `
          <span>
            👨‍🏫
            ${esc(
              lesson.lecturer
            )}
          </span>
          `

            :

          ""
        }


        ${
          lesson.auditorium

            ?

          `
          <span>
            🏫
            ${esc(
              lesson.auditorium
            )}
          </span>
          `

            :

          ""
        }


        ${
          lesson.building

            ?

          `
          <span>
            📍
            ${esc(
              lesson.building
            )}
          </span>
          `

            :

          ""
        }

      </div>

    </article>

  `;

}


/* =========================
   FILTER
========================= */

function getLessons(){

  const today =
    new Date();


  const todayString =
    localDateString(
      today
    );


  if(
    currentView === "today"
  ){

    return schedule.filter(
      x =>
        x.date ===
        todayString
    );

  }


  if(
    currentView === "tomorrow"
  ){

    const tomorrow =
      localDateString(
        addDays(
          today,
          1
        )
      );


    return schedule.filter(
      x =>
        x.date ===
        tomorrow
    );

  }


  if(
    currentView === "week"
  ){

    const end =
      localDateString(
        addDays(
          today,
          6
        )
      );


    return schedule.filter(
      x =>
        x.date >=
        todayString
        &&
        x.date <=
        end
    );

  }


  if(
    currentView === "month"
  ){

    const end =
      localDateString(
        addDays(
          today,
          29
        )
      );


    return schedule.filter(
      x =>
        x.date >=
        todayString
        &&
        x.date <=
        end
    );

  }


  const futureDates = [

    ...new Set(

      sort(schedule)

        .filter(
          x =>
            x.date >=
            todayString
        )

        .map(
          x =>
            x.date
        )

    )

  ];


  if(
    !futureDates.length
  ){

    return [];

  }


  return schedule.filter(
    x =>
      x.date ===
      futureDates[0]
  );

}


/* =========================
   RENDER
========================= */

function renderSchedule(){

  const lessons =
    getLessons();


  const container =
    $("schedule");


  if(
    !lessons.length
  ){

    container.innerHTML = `

      <div class="empty">

        <strong>
          Занятий нет
        </strong>

        В выбранном периоде
        расписание свободно.

      </div>

    `;

    return;

  }


  const grouped = {};


  lessons.forEach(
    lesson => {

      if(
        !grouped[
          lesson.date
        ]
      ){

        grouped[
          lesson.date
        ] = [];

      }


      grouped[
        lesson.date
      ].push(
        lesson
      );

    }
  );


  const dates =
    Object.keys(
      grouped
    ).sort();


  container.innerHTML =

    dates

      .map(
        date => `

          <section class="day">

            <div class="day-heading">

              <div>

                <div class="weekday">

                  ${esc(
                    formatWeekday(
                      date
                    )
                  )}

                </div>


                <div class="date">

                  ${esc(
                    formatDate(
                      date
                    )
                  )}

                </div>

              </div>


              <div class="count">

                ${grouped[date].length}

                ${
                  grouped[date].length === 1
                    ? "пара"
                    : grouped[date].length < 5
                      ? "пары"
                      : "пар"
                }

              </div>

            </div>


            <div class="grid">

              ${sort(
                grouped[date]
              )
              .map(
                lessonCard
              )
              .join("")}

            </div>

          </section>

        `
      )

      .join("");

}


/* =========================
   LOAD
========================= */

async function loadSchedule(){

  const button =
    $("refreshButton");


  button.classList.add(
    "loading"
  );


  button.textContent =
    "↻ Обновление...";


  try{

    const response =
      await fetch(
        "schedule.json?t=" +
        Date.now()
      );


    if(
      !response.ok
    ){

      throw new Error(
        "Не удалось загрузить schedule.json"
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data)
    ){

      throw new Error(
        "Неверный формат schedule.json"
      );

    }


    schedule =
      sort(

        data.filter(
          x =>
            x.date
        )

      );


    $("updated").textContent =
      "Обновлено в " +

      new Date()
        .toLocaleTimeString(
          "ru-RU",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );


    renderNext();

    renderStats();

    renderSchedule();

  }


  catch(error){

    $("schedule").innerHTML = `

      <div class="error">

        <strong>
          Не удалось загрузить расписание
        </strong>

        ${esc(
          error.message
        )}

      </div>

    `;

  }


  finally{

    button.classList.remove(
      "loading"
    );


    button.textContent =
      "↻ Обновить";

  }

}


/* =========================
   MENU
========================= */

const menuButton =
  $("menuButton");

const tabsWrap =
  $("tabsWrap");

const menuOverlay =
  $("menuOverlay");


function openMenu(){

  tabsWrap.classList.add(
    "open"
  );

  menuOverlay.classList.add(
    "open"
  );

}


function closeMenu(){

  tabsWrap.classList.remove(
    "open"
  );

  menuOverlay.classList.remove(
    "open"
  );

}


menuButton.addEventListener(
  "click",
  () => {

    if(
      tabsWrap.classList.contains(
        "open"
      )
    ){

      closeMenu();

    }else{

      openMenu();

    }

  }
);


menuOverlay.addEventListener(
  "click",
  closeMenu
);


/* =========================
   TABS
========================= */

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentView =
            button.dataset.view;


          /*
           * Ближайшее —
           * домашняя страница.
           */

          renderNext();

          renderStats();

          renderSchedule();

          closeMenu();

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }
      );

    }
);


/* =========================
   REFRESH
========================= */

$("refreshButton")
  .addEventListener(
    "click",
    loadSchedule
  );


/* =========================
   START
========================= */

loadSchedule();


/*
Проверяем текущую пару
каждую минуту.
*/

setInterval(
  () => {

    renderNext();

    renderStats();

    renderSchedule();

  },
  60000
);


/*
Проверяем новые данные
каждые 5 минут.
*/

setInterval(
  loadSchedule,
  5 * 60 * 1000
);

</script>
