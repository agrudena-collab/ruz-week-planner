<style>

:root{

  --bg:#07090f;
  --surface:#10131c;
  --surface2:#151925;

  --text:#f7f8fb;
  --muted:#8e96a8;

  --line:rgba(255,255,255,.09);

  --blue:#4f8cff;
  --purple:#9b6cff;
  --green:#27df91;
  --yellow:#ffd166;
  --pink:#ff5ca8;
  --cyan:#42d9ff;

  --shadow:
    0 25px 70px rgba(0,0,0,.35);

}


*{
  box-sizing:border-box;
}


html{
  scroll-behavior:smooth;
}


body{

  margin:0;

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

  background:

    radial-gradient(
      circle at 15% 0%,
      rgba(79,140,255,.22),
      transparent 28%
    ),

    radial-gradient(
      circle at 90% 15%,
      rgba(155,108,255,.18),
      transparent 25%

    var(--bg);

  padding-top:
    env(safe-area-inset-top);

}


body::before{

  content:"";

  position:fixed;

  inset:0;

  pointer-events:none;

  opacity:.28;

  background-image:

    linear-gradient(
      rgba(255,255,255,.025) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(255,255,255,.025) 1px,
      transparent 1px

}


button{

}


/* =================================
   MENU
================================= */

.menu-overlay{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.48);

  backdrop-filter:blur(4px);

  z-index:90;

  opacity:0;

  visibility:hidden;

  transition:.25s;

}


.menu-overlay.open{

  opacity:1;

  visibility:visible;

}


.side-menu{

  position:fixed;

  z-index:100;

  left:0;

  top:0;

  bottom:0;

  width:min(
    330px,
    86vw
  );

  padding:

    calc(
      20px + env(safe-area-inset-top)
    )

    18px

    calc(
      25px + env(safe-area-inset-bottom)
    );

  background:

    linear-gradient(
      145deg,
      rgba(18,22,34,.98),
      rgba(8,11,18,.99)
    );

  border-right:
    1px solid
    var(--line);

  box-shadow:
    25px 0 70px
    rgba(0,0,0,.45);

  transform:
    translateX(-105%);

  transition:
    transform .28s
    cubic-bezier(.2,.8,.2,1);

}


.side-menu.open{

  transform:

}


.menu-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:25px;

}


.menu-title{

  font-size:22px;

  font-weight:900;

}


.menu-close{

  width:42px;

  height:42px;

  border:0;

  border-radius:14px;

  background:
    rgba(255,255,255,.07);

  color:white;

  font-size:23px;

  cursor:pointer;

}


.menu-list{

  display:flex;

  flex-direction:column;

  gap:7px;

}


.menu-item{

  width:100%;

  border:0;

  border-radius:16px;

  padding:15px;

  text-align:left;

  color:#cbd1dd;

  background:transparent;

  font-weight:800;

  cursor:pointer;

  transition:.2s;

}


.menu-item:hover{

  background:
    rgba(255,255,255,.06);

  color:white;

}


.menu-item.active{

  color:#111;

  background:white;

}


.menu-item-icon{

  display:inline-block;

  width:28px;

  font-size:18px;

}


.menu-divider{

  height:1px;

  margin:10px 0;

/* =================================
   CONTAINER
================================= */

.container{

    1050px,
    calc(100% - 28px)
  );

  padding:

    80px;

}


/* =================================
   HEADER
================================= */

.header{

  justify-content:space-between;

  margin-bottom:20px;

}


.brand{

  display:flex;

  align-items:center;

  gap:12px;

}


.menu-button{

  width:48px;

    rgba(255,255,255,.07);

  color:white;

  display:grid;

  flex-shrink:0;

}


.title{

}


.group{

}


.header-right{

  gap:10px;

}


.updated{

}


.refresh{

  padding:11px 14px;

  color:#080a0f;

  font-weight:800;

  cursor:pointer;

}


.refresh.loading{

}


/* =================================
   HERO
================================= */

.hero{

  position:relative;

  overflow:hidden;

  border:
    1px solid var(--line);

  border-radius:30px;

  padding:30px;

  margin-bottom:13px;

  background:

    linear-gradient(
      135deg,

      rgba(12,15,25,.92)

}


.hero::after{

  content:"";

  position:absolute;

  width:360px;

  height:360px;

  right:-130px;

  top:-170px;

    radial-gradient(

}

}


.eyebrow{

.live{

.day-heading{

================================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

}


.lesson{

    0 14px 35px

.lesson::before{

  content:"";

  left:0;

  top:0;

  bottom:0;

    var(--accent,var(--blue));

}


.lesson::after{

  content:"";

  position:absolute;

  width:150px;

  height:150px;

  border-radius:50%;

  right:-90px;

  bottom:-100px;

  background:
    var(--accent,var(--blue));

}


.lesson.current{

.subject{

.meta{

  background:

}


.badge{

/* =================================

================================= */

.archive-header{

.archive-header h1{

.archive-count{

.empty,

<script>


let schedule = [];

let archive = [];

let currentView = "nearest";


const $ = id =>
  document.getElementById(id);


/* =================================
   DATE
================================= */

function pad(n){

  return String(n).padStart(
    2,
    "0"
  );

}


function localDateString(
  d = new Date()
){

  return (

    d.getFullYear()
    + "-"
    + pad(d.getMonth()+1)
    + "-"
    + pad(d.getDate())

  );

}


function addDays(
  d,
  n
){

  const x =
    new Date(d);

  x.setDate(
    x.getDate() + n
  );

  return x;

}


function dateFromString(v){

  return new Date(
    v + "T00:00:00"
  );

}


function formatDate(v){

  return dateFromString(v)
    .toLocaleDateString(
      "ru-RU",
      {
        day:"numeric",
        month:"long"
      }
    );

}


function formatWeekday(v){

  return dateFromString(v)
    .toLocaleDateString(
      "ru-RU",
      {
        weekday:"long"
      }
    );

}


/* =================================
   SECURITY
================================= */

function esc(v){

  return String(
    v ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =================================
   TIME
================================= */

function dt(
  lesson,
  field
){

  return new Date(

    `${lesson.date}T${lesson[field]}:00`

  );

}


function current(lesson){

  const now =
    new Date();

  return (

    now >=
    dt(
      lesson,
      "beginLesson"
    )

    &&

    now <
    dt(
      lesson,
      "endLesson"
    )

  );

}


function ended(lesson){

  return (

    new Date()
    >=
    dt(
      lesson,
      "endLesson"
    )

  );

}


/* =================================
   SORT
================================= */

function sort(lessons){

  return [...lessons].sort(

    (a,b) =>

      (a.date || "")
      .localeCompare(
        b.date || ""
      )

      ||

      (a.beginLesson || "")
      .localeCompare(
        b.beginLesson || ""
      )

  );

}


/* =================================
   ACCENT
================================= */

function accent(
  subject = ""
){

  const s =
    subject.toLowerCase();


  if(
    /статист|математ|анализ/.test(s)
  ){

    return "#9b6cff";

  }


  if(
    /китай|кит|язык/.test(s)
  ){

    return "#ff5ca8";

  }


  if(
    /англ|english/.test(s)
  ){

    return "#42d9ff";

  }


  if(
    /бух|учет|финанс/.test(s)
  ){

    return "#ffd166";

  }


  if(
    /военн|физ|спорт/.test(s)
  ){

    return "#27df91";

  }


  return "#4f8cff";

}


/* =================================
   NEXT
================================= */

function next(){

  const sorted =
    sort(schedule);


  const c =
    sorted.find(
      current
    );


  if(c){

    return {
      lesson:c,
      current:true
    };

  }


  const n =
    sorted.find(
      x =>
        !ended(x)
    );


  return n

    ? {
        lesson:n,
        current:false
      }

    : null;

}


/* =================================
   HERO
================================= */

function renderNext(){

  const result =
    next();


  if(!result){

    return `

      <section class="hero">

        <div class="hero-content">

          <div class="eyebrow">
            Расписание
          </div>

          <div class="hero-subject">
            Ближайших занятий нет ✨
          </div>

        </div>

      </section>

    `;

  }


  const lesson =
    result.lesson;


  return `

    <section class="hero">

      <div class="hero-content">


        ${
          result.current

          ?

          `
          <div class="live">

            <span class="dot"></span>

            СЕЙЧАС ИДЁТ

          </div>
          `

          :

          `
          <div class="eyebrow">
            Следующая пара
          </div>
          `
        }


        <div class="hero-time">

          ${esc(
            lesson.beginLesson
          )}

          –

          ${esc(
            lesson.endLesson
          )}

        </div>


        <div class="hero-subject">

          ${esc(
            lesson.discipline ||
            "Предмет не указан"
          )}

        </div>


        <div class="chips">


          <span class="chip">

            📅

            ${esc(
              formatWeekday(
                lesson.date
              )
            )}

            ,

            ${esc(
              formatDate(
                lesson.date
              )
            )}

          </span>


          ${
            lesson.lecturer

            ?

            `
            <span class="chip">

              👨‍🏫

              ${esc(
                lesson.lecturer
              )}

            </span>
            `

            :

            ""
          }


          ${
            lesson.auditorium

            ?

            `
            <span class="chip">

              🏫

              ${esc(
                lesson.auditorium
              )}

            </span>
            `

            :

            ""
          }


          ${
            lesson.building

            ?

            `
            <span class="chip">

              📍

              ${esc(
                lesson.building
              )}

            </span>
            `

            :

            ""
          }


        </div>

      </div>

    </section>

  `;

}


/* =================================
   STATS
================================= */

function renderStats(){

  const today =
    localDateString();


  const lessons =
    schedule.filter(
      x =>
        x.date === today
    );


  const minutes =
    lessons.reduce(

      (
        total,
        lesson
      ) =>

        total +

        Math.max(

          0,

          (

            dt(
              lesson,
              "endLesson"
            )

            -

            dt(
              lesson,
              "beginLesson"
            )

          )

          /

          60000

        ),

      0

    );


  const hours =
    Math.floor(
      minutes / 60
    );


  const mins =
    Math.round(
      minutes % 60
    );


  const buildings =
    new Set(

      lessons

        .map(
          x =>
            x.building
        )

        .filter(Boolean)

    ).size;


  return `

    <div class="stats">


      <div class="stat">

        <div class="stat-value">
          ${lessons.length}
        </div>

        <div class="stat-label">
          пар сегодня
        </div>

      </div>


      <div class="stat">

        <div class="stat-value">

          ${
            hours

            ?

            `${hours}ч ${mins}м`

            :

            `${mins}м`
          }

        </div>

        <div class="stat-label">
          учебного времени
        </div>

      </div>


      <div class="stat">

        <div class="stat-value">
          ${buildings}
        </div>

        <div class="stat-label">
          корпуса сегодня
        </div>

      </div>


    </div>

  `;

}


/* =================================
   LESSON CARD
================================= */

function lessonCard(
  lesson
){

  const isNow =
    current(lesson);


  const color =
    accent(
      lesson.discipline
    );


  return `

    <article

      class="lesson
      ${isNow ? "current" : ""}"

      style="
        --accent:${color};
      "

    >


      <div class="lesson-top">


        <div>


          <div class="time">

            ${esc(
              lesson.beginLesson
            )}

            –

            ${esc(
              lesson.endLesson
            )}

          </div>


          <div class="subject">

            ${esc(
              lesson.discipline ||
              "Предмет не указан"
            )}

          </div>


        </div>


        ${
          isNow

          ?

          `
          <div class="badge">
            СЕЙЧАС
          </div>
          `

          :

          ""
        }


      </div>


      <div class="meta">


        ${
          lesson.lecturer

          ?

          `
          <span>

            👨‍🏫

            ${esc(
              lesson.lecturer
            )}

          </span>
          `

          :

          ""
        }


        ${
          lesson.auditorium

          ?

          `
          <span>

            🏫

            ${esc(
              lesson.auditorium
            )}

          </span>
          `

          :

          ""
        }


        ${
          lesson.building

          ?

          `
          <span>

            📍

            ${esc(
              lesson.building
            )}

          </span>
          `

          :

          ""
        }


      </div>


    </article>

  `;

}


/* =================================
   GROUP DAYS
================================= */

function renderDays(
  lessons
){

  if(
    !lessons.length
  ){

    return `

      <div class="empty">

        <strong>
          Занятий нет
        </strong>

        В выбранном периоде
        расписание свободно.

      </div>

    `;

  }


  const grouped = {};


  lessons.forEach(
    lesson => {

      if(
        !grouped[
          lesson.date
        ]
      ){

        grouped[
          lesson.date
        ] = [];

      }


      grouped[
        lesson.date
      ].push(
        lesson
      );

    }
  );


  const dates =
    Object.keys(
      grouped
    ).sort();


  return dates

    .map(

      date => `

        <section class="day">


          <div class="day-heading">


            <div>


              <div class="weekday">

                ${esc(
                  formatWeekday(
                    date
                  )
                )}

              </div>


              <div class="date">

                ${esc(
                  formatDate(
                    date
                  )
                )}

              </div>


            </div>


            <div class="count">

              ${grouped[date].length}

              ${
                grouped[date].length === 1

                ?

                "пара"

                :

                grouped[date].length < 5

                ?

                "пары"

                :

                "пар"
              }

            </div>


          </div>


          <div class="grid">

            ${sort(
              grouped[date]
            )

            .map(
              lessonCard
            )

            .join("")}

          </div>


        </section>

      `

    )

    .join("");

}


/* =================================
   FILTER
================================= */

function getLessons(){

  const today =
    new Date();


  const todayString =
    localDateString(
      today
    );


  if(
    currentView === "today"
  ){

    return schedule.filter(
      x =>
        x.date ===
        todayString
    );

  }


  if(
    currentView === "tomorrow"
  ){

    const tomorrow =
      localDateString(
        addDays(
          today,
          1
        )
      );


    return schedule.filter(
      x =>
        x.date ===
        tomorrow
    );

  }


  if(
    currentView === "week"
  ){

    const end =
      localDateString(
        addDays(
          today,
          6
        )
      );


    return schedule.filter(
      x =>

        x.date >=
        todayString

        &&

        x.date <=
        end

    );

  }


  if(
    currentView === "month"
  ){

    const end =
      localDateString(
        addDays(
          today,
          29
        )
      );


    return schedule.filter(
      x =>

        x.date >=
        todayString

        &&

        x.date <=
        end

    );

  }


  const futureDates = [

    ...new Set(

      sort(schedule)

        .filter(
          x =>
            x.date >=
            todayString
        )

        .map(
          x =>
            x.date
        )

    )

  ];


  if(
    !futureDates.length
  ){

    return [];

  }


  return schedule.filter(
    x =>
      x.date ===
      futureDates[0]
  );

}


/* =================================
   ARCHIVE
================================= */

function renderArchive(){

  const sorted =
    sort(archive);


  if(
    !sorted.length
  ){

    return `

      <div class="archive-header">

        <div>

          <h1>
            Архив
          </h1>

          <p>
            Прошедшие пары
          </p>

        </div>

      </div>


      <div class="archive-empty">

        <strong>
          Архив пока пуст
        </strong>

        После прохождения занятий
        они будут автоматически
        появляться здесь.

      </div>

    `;

  }


  return `

    <div class="archive-header">

      <div>

        <h1>
          Архив
        </h1>

        <p>
          Прошедшие пары
        </p>

      </div>


      <div class="archive-count">

        ${sorted.length}

        ${
          sorted.length === 1
          ? "пара"
          : sorted.length < 5
          ? "пары"
          : "пар"
        }

      </div>

    </div>


    ${renderDays(sorted)}

  `;

}


/* =================================
   RENDER PAGE
================================= */

function render(){

  const container =
    $("appContent");


  if(
    currentView === "nearest"
  ){

    container.innerHTML =

      renderNext()

      +

      renderStats()

      +

      renderDays(
        getLessons()
      );

    return;

  }


  if(
    currentView === "today"
  ){

    container.innerHTML =

      renderStats()

      +

      renderDays(
        getLessons()
      );

    return;

  }


  if(
    currentView === "archive"
  ){

    container.innerHTML =
      renderArchive();

    return;

  }


  container.innerHTML =
    renderDays(
      getLessons()
    );

}


/* =================================
   LOAD SCHEDULE
================================= */

async function loadSchedule(){

  const button =
    $("refreshButton");


  button.classList.add(
    "loading"
  );


  button.textContent =
    "↻ Обновление...";


  try{

    const response =
      await fetch(
        "schedule.json?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "Не удалось загрузить schedule.json"
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data)
    ){

      throw new Error(
        "Неверный формат schedule.json"
      );

    }


    schedule =
      sort(

        data.filter(
          x =>
            x.date
        )

      );


    $("updated").textContent =

      "Обновлено в "

      +

      new Date()

        .toLocaleTimeString(

          "ru-RU",

          {
            hour:"2-digit",
            minute:"2-digit"
          }

        );


    render();

  }


  catch(error){

    $("appContent").innerHTML = `

      <div class="error">

        <strong>
          Не удалось загрузить расписание
        </strong>

        ${esc(
          error.message
        )}

      </div>

    `;

  }


  finally{

    button.classList.remove(
      "loading"
    );


    button.textContent =
      "↻ Обновить";

  }

}


/* =================================
   LOAD ARCHIVE
================================= */

async function loadArchive(){

  try{

    const response =
      await fetch(

        "archive.json?t=" +
        Date.now(),

        {
          cache:"no-store"
        }

      );


    if(
      !response.ok
    ){

      throw new Error(
        "archive.json not found"
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data)
    ){

      throw new Error(
        "Invalid archive format"
      );

    }


    archive =
      sort(

        data.filter(
          x =>
            x.date
        )

      );


    if(
      currentView === "archive"
    ){

      render();

    }

  }


  catch(error){

    console.log(
      "Archive:",
      error.message
    );

  }

}


/* =================================
   MENU
================================= */

const sideMenu =
  $("sideMenu");

const menuOverlay =
  $("menuOverlay");


function openMenu(){

  sideMenu.classList.add(
    "open"
  );

  menuOverlay.classList.add(
    "open"
  );

}


function closeMenu(){

  sideMenu.classList.remove(
    "open"
  );

  menuOverlay.classList.remove(
    "open"
  );

}


$("menuOpen")
  .addEventListener(
    "click",
    openMenu
  );


$("menuClose")
  .addEventListener(
    "click",
    closeMenu
  );


menuOverlay
  .addEventListener(
    "click",
    closeMenu
  );


/* =================================
   MENU ITEMS
================================= */

document
  .querySelectorAll(
    ".menu-item"
  )
  .forEach(

    button => {

      button.addEventListener(

        "click",

        () => {

          document
            .querySelectorAll(
              ".menu-item"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentView =
            button.dataset.view;


          closeMenu();

          render();

          window.scrollTo({
            top:0,
            behavior:"smooth"
          });

        }

      );

    }

  );


/* =================================
   REFRESH
================================= */

$("refreshButton")
  .addEventListener(
    "click",
    async () => {

      await loadSchedule();

      await loadArchive();

    }
  );


/* =================================
   START
================================= */

loadSchedule();

loadArchive();


/*
   Проверяем текущее занятие
   каждую минуту.
*/

setInterval(

  () => {

    render();

  },

  60000

);


/*
   Проверяем новые данные
   каждые 5 минут.
*/

setInterval(

  async () => {

    await loadSchedule();

    await loadArchive();

  },

  5 * 60 * 1000

);


</script>
