<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#f4f7fb">

  <title>РУЗ · МеждОт25-2</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --text: #11141a;
      --muted: #747b88;
      --line: rgba(15, 23, 42, .07);

      --blue: #1677ff;
      --purple: #7958ff;
      --green: #18b66a;
      --orange: #f27d35;
      --pink: #e65088;
      --cyan: #08a8c8;

      --shadow: 0 20px 60px rgba(30, 45, 70, .10);
      --shadow-soft: 0 8px 30px rgba(30, 45, 70, .07);

      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 8% 2%,
          rgba(22,119,255,.14),
          transparent 27%
        ),
        radial-gradient(
          circle at 95% 12%,
          rgba(121,88,255,.13),
          transparent 25%
        ),
        radial-gradient(
          circle at 55% 105%,
          rgba(24,182,106,.09),
          transparent 30%
        ),
        var(--bg);

      min-height: 100vh;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      opacity: .25;

      background-image:
        radial-gradient(
          rgba(20,35,60,.14) .7px,
          transparent .7px
        );

      background-size: 18px 18px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );
    }

    button {
      font: inherit;
    }

    .container {
      width: min(
        1020px,
        calc(100% - 28px)
      );

      margin: 0 auto;

      padding:
        28px
        0
        75px;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 18px;

      margin-bottom: 18px;
    }

    .brand {
      display: flex;

      align-items: center;

      gap: 13px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;

      border-radius: 17px;

      display: grid;
      place-items: center;

      color: white;

      font-size: 22px;
      font-weight: 900;

      background:
        linear-gradient(
          145deg,
          #1677ff,
          #7958ff 70%,
          #9a76ff
        );

      box-shadow:
        0 12px 30px
        rgba(71,91,255,.25);

      transform: rotate(-3deg);
    }

    .title {
      font-size: 31px;

      font-weight: 900;

      letter-spacing: -1.2px;

      line-height: 1;
    }

    .group {
      margin-top: 6px;

      color: var(--muted);

      font-size: 14px;

      font-weight: 700;
    }

    .header-right {
      display: flex;

      align-items: center;

      gap: 10px;
    }

    .update-status {
      color: var(--muted);

      font-size: 11px;
    }

    .refresh {
      border: 1px solid
        rgba(255,255,255,.8);

      color: white;

      background: #11141a;

      border-radius: 14px;

      padding:
        11px
        14px;

      font-size: 13px;

      font-weight: 800;

      cursor: pointer;

      box-shadow:
        0 7px 20px
        rgba(0,0,0,.12);

      transition:
        transform .18s ease,
        opacity .18s ease;
    }

    .refresh:active {
      transform: scale(.96);
    }

    .refresh.loading {
      opacity: .55;

      pointer-events: none;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      overflow: hidden;

      border-radius: 32px;

      padding: 27px;

      margin-bottom: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.94),
          rgba(235,244,255,.80)
        );

      border:
        1px solid
        rgba(255,255,255,.95);

      box-shadow: var(--shadow);

      backdrop-filter: blur(22px);
    }

    .hero::before {
      content: "";

      position: absolute;

      width: 340px;
      height: 340px;

      right: -140px;
      top: -180px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(22,119,255,.20),
          rgba(121,88,255,.05) 55%,
          transparent 70%
        );
    }

    .hero::after {
      content: "";

      position: absolute;

      width: 190px;
      height: 190px;

      left: -120px;
      bottom: -125px;

      border-radius: 50%;

      background:
        rgba(121,88,255,.10);
    }

    .hero-content {
      position: relative;

      z-index: 1;
    }

    .hero-label {
      color: var(--blue);

      font-size: 11px;

      font-weight: 900;

      letter-spacing: 1.2px;

      text-transform: uppercase;

      margin-bottom: 10px;
    }

    .live-label {
      display: inline-flex;

      align-items: center;

      gap: 7px;

      color: #087b48;

      background: #e8faf1;

      border:
        1px solid
        rgba(24,182,106,.12);

      border-radius: 999px;

      padding:
        7px
        10px;

      font-size: 11px;

      font-weight: 900;

      letter-spacing: .5px;

      margin-bottom: 10px;
    }

    .live-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 0 5px
        rgba(24,182,106,.12);
    }

    .hero-time {
      font-size: 48px;

      font-weight: 950;

      letter-spacing: -2px;

      line-height: 1;

      margin-bottom: 9px;
    }

    .hero-subject {
      max-width: 720px;

      font-size: 24px;

      font-weight: 850;

      line-height: 1.18;

      margin-bottom: 17px;

      letter-spacing: -.4px;
    }

    .hero-info {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;
    }

    .info-pill {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding:
        8px
        10px;

      border-radius: 12px;

      background:
        rgba(255,255,255,.72);

      border:
        1px solid
        rgba(17,20,26,.055);

      color: var(--muted);

      font-size: 12px;

      font-weight: 700;

      box-shadow:
        0 3px 10px
        rgba(30,45,70,.03);
    }


    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 9px;

      margin-bottom: 18px;
    }

    .stat {
      position: relative;

      overflow: hidden;

      background:
        rgba(255,255,255,.72);

      border:
        1px solid
        rgba(255,255,255,.95);

      border-radius: 20px;

      padding: 15px;

      box-shadow:
        var(--shadow-soft);

      backdrop-filter: blur(18px);
    }

    .stat::after {
      content: "";

      position: absolute;

      width: 80px;
      height: 80px;

      right: -32px;
      bottom: -42px;

      border-radius: 50%;

      background:
        rgba(22,119,255,.08);
    }

    .stat:nth-child(2)::after {
      background:
        rgba(121,88,255,.08);
    }

    .stat:nth-child(3)::after {
      background:
        rgba(24,182,106,.08);
    }

    .stat-value {
      position: relative;

      z-index: 1;

      font-size: 23px;

      font-weight: 900;

      letter-spacing: -.6px;
    }

    .stat-label {
      position: relative;

      z-index: 1;

      margin-top: 3px;

      color: var(--muted);

      font-size: 11px;

      font-weight: 700;
    }


    /* =========================
       NAVIGATION
    ========================= */

    .tabs-wrap {
      position: sticky;

      top: 7px;

      z-index: 30;

      margin-bottom: 25px;
    }

    .tabs {
      display: flex;

      gap: 4px;

      padding: 5px;

      background:
        rgba(224,229,238,.78);

      border:
        1px solid
        rgba(255,255,255,.9);

      border-radius: 17px;

      box-shadow:
        0 7px 22px
        rgba(30,45,70,.08);

      backdrop-filter:
        blur(20px);

      overflow-x: auto;

      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 1;

      min-width: 105px;

      border: 0;

      background: transparent;

      color: #717784;

      padding:
        10px
        13px;

      border-radius: 13px;

      font-size: 13px;

      font-weight: 800;

      cursor: pointer;

      white-space: nowrap;

      transition:
        .18s ease;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--text);

      background: white;

      box-shadow:
        0 4px 13px
        rgba(0,0,0,.08);
    }


    /* =========================
       DAY
    ========================= */

    .day {
      margin-bottom: 31px;
    }

    .day-heading {
      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

      gap: 15px;

      padding:
        0 4px;

      margin-bottom: 11px;
    }

    .weekday {
      font-size: 21px;

      font-weight: 900;

      letter-spacing: -.4px;

      text-transform: capitalize;
    }

    .date {
      color: var(--muted);

      font-size: 12px;

      margin-top: 3px;

      font-weight: 600;
    }

    .day-count {
      color: #555d69;

      background:
        rgba(255,255,255,.62);

      border:
        1px solid
        rgba(255,255,255,.9);

      padding:
        6px
        9px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 800;

      white-space: nowrap;
    }


    /* =========================
       TIMELINE
    ========================= */

    .timeline {
      position: relative;

      padding-left: 20px;
    }

    .timeline::before {
      content: "";

      position: absolute;

      left: 6px;

      top: 14px;
      bottom: 14px;

      width: 2px;

      background:
        linear-gradient(
          to bottom,
          #d9e1ec,
          #cfd8e6
        );

      border-radius: 10px;
    }


    /* =========================
       LESSON CARD
    ========================= */

    .lesson {
      --accent: var(--blue);

      --accent-bg: #edf5ff;

      position: relative;

      overflow: hidden;

      background:
        rgba(255,255,255,.86);

      border:
        1px solid
        rgba(17,20,26,.055);

      border-radius: 21px;

      padding:
        17px
        17px
        16px;

      margin-bottom: 10px;

      box-shadow:
        var(--shadow-soft);

      backdrop-filter:
        blur(15px);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .lesson:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 13px 34px
        rgba(34,49,76,.10);
    }

    .lesson::after {
      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 4px;

      background:
        var(--accent);
    }

    .lesson::before {
      content: "";

      position: absolute;

      left: -20px;

      top: 22px;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: white;

      border:
        3px solid
        var(--accent);

      box-shadow:
        0 0 0 3px
        var(--bg);
    }

    .lesson.current {
      --accent: var(--green);

      --accent-bg: #e8faf1;

      border:
        2px solid
        rgba(24,182,106,.55);

      background:
        rgba(249,255,252,.96);

      box-shadow:
        0 12px 35px
        rgba(24,182,106,.14);
    }

    .lesson.current::before {
      background:
        var(--green);

      border-color:
        var(--green);

      box-shadow:
        0 0 0 3px var(--bg),
        0 0 0 7px
        rgba(24,182,106,.10);
    }

    .lesson-top {
      display: flex;

      justify-content:
        space-between;

      align-items:
        flex-start;

      gap: 12px;
    }

    .lesson-time {
      color:
        var(--accent);

      font-size: 14px;

      font-weight: 900;

      margin-bottom: 7px;
    }

    .lesson-subject {
      font-size: 18px;

      font-weight: 880;

      line-height: 1.22;

      margin-bottom: 12px;

      letter-spacing: -.2px;
    }

    .lesson-info {
      display: flex;

      flex-wrap: wrap;

      gap: 6px;
    }

    .lesson-chip {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      padding:
        6px
        8px;

      border-radius: 10px;

      background:
        var(--accent-bg);

      color: #656d7a;

      font-size: 11px;

      font-weight: 700;
    }

    .current-badge {
      color: #087b48;

      background:
        #e5f9ef;

      border-radius: 999px;

      padding:
        6px
        9px;

      font-size: 9px;

      font-weight: 900;

      white-space: nowrap;
    }


    /* =========================
       SUBJECT THEMES
    ========================= */

    .theme-blue {
      --accent: #1677ff;
      --accent-bg: #edf5ff;
    }

    .theme-purple {
      --accent: #7958ff;
      --accent-bg: #f1edff;
    }

    .theme-orange {
      --accent: #f27d35;
      --accent-bg: #fff2e9;
    }

    .theme-pink {
      --accent: #e65088;
      --accent-bg: #ffedf4;
    }

    .theme-cyan {
      --accent: #08a8c8;
      --accent-bg: #e8f9fc;
    }

    .theme-indigo {
      --accent: #5267d9;
      --accent-bg: #eef0ff;
    }

    .theme-green {
      --accent: #18a865;
      --accent-bg: #e9f9f0;
    }


    /* =========================
       EMPTY / ERROR
    ========================= */

    .empty {
      background:
        rgba(255,255,255,.78);

      border:
        1px solid
        rgba(255,255,255,.9);

      border-radius: 24px;

      padding:
        46px
        20px;

      text-align: center;

      box-shadow:
        var(--shadow);

      backdrop-filter:
        blur(15px);
    }

    .empty-icon {
      font-size: 34px;

      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 18px;

      font-weight: 850;

      margin-bottom: 5px;
    }

    .empty-text {
      color: var(--muted);

      font-size: 13px;
    }

    .error {
      padding: 17px;

      border-radius: 17px;

      background: #fff1f1;

      color: #bd2525;

      border:
        1px solid
        #ffd3d3;

      line-height: 1.5;
    }

    .source {
      margin-top: 35px;

      text-align: center;

      color: #9ba1aa;

      font-size: 10px;

      font-weight: 600;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      .container {
        width:
          calc(100% - 20px);

        padding-top: 17px;
      }

      .header {
        align-items:
          flex-start;
      }

      .brand-icon {
        width: 43px;
        height: 43px;

        border-radius: 14px;

        font-size: 18px;
      }

      .title {
        font-size: 26px;
      }

      .group {
        font-size: 13px;
      }

      .header-right {
        gap: 5px;
      }

      .update-status {
        display: none;
      }

      .refresh {
        padding:
          9px
          11px;

        font-size: 12px;
      }

      .hero {
        padding: 20px;

        border-radius: 23px;
      }

      .hero-time {
        font-size: 36px;
      }

      .hero-subject {
        font-size: 19px;
      }

      .stats {
        gap: 7px;
      }

      .stat {
        padding: 12px;

        border-radius: 16px;
      }

      .stat-value {
        font-size: 19px;
      }

      .stat-label {
        font-size: 10px;
      }

      .tabs-wrap {
        top: 5px;
      }

      .tabs {
        border-radius: 15px;
      }

      .tab {
        min-width: 92px;

        font-size: 12px;

        padding:
          10px
          8px;
      }

      .weekday {
        font-size: 19px;
      }

      .day-count {
        font-size: 10px;
      }

      .timeline {
        padding-left: 14px;
      }

      .lesson {
        padding: 14px;

        border-radius: 18px;
      }

      .lesson::before {
        left: -14px;

        width: 9px;
        height: 9px;
      }

      .lesson-subject {
        font-size: 16px;
      }

      .lesson-info {
        gap: 5px;
      }

      .lesson-chip {
        font-size: 10px;

        padding:
          5px
          7px;
      }
    }

  </style>
</head>


<body>

  <div class="container">


    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          R
        </div>

        <div>

          <div class="title">
            Расписание
          </div>

          <div class="group">
            МеждОт25-2
          </div>

        </div>

      </div>


      <div class="header-right">

        <div
          class="update-status"
          id="updated"
        >
          Загрузка...
        </div>

        <button
          class="refresh"
          id="refreshButton"
        >
          ↻ Обновить
        </button>

      </div>

    </header>


    <!-- HERO -->

    <div id="nextLesson"></div>


    <!-- STATS -->

    <div
      class="stats"
      id="stats"
    ></div>


    <!-- NAVIGATION -->

    <div class="tabs-wrap">

      <nav class="tabs">

        <button
          class="tab active"
          data-view="nearest"
        >
          Ближайшее
        </button>

        <button
          class="tab"
          data-view="today"
        >
          Сегодня
        </button>

        <button
          class="tab"
          data-view="tomorrow"
        >
          Завтра
        </button>

        <button
          class="tab"
          data-view="week"
        >
          Неделя
        </button>

        <button
          class="tab"
          data-view="month"
        >
          Месяц
        </button>

      </nav>

    </div>


    <!-- SCHEDULE -->

    <main id="schedule">

      <div class="empty">
        Загрузка расписания...
      </div>

    </main>


    <div class="source">
      Автоматически обновляется из РУЗ
    </div>

  </div>


  <script>

    let schedule = [];

    let currentView = "nearest";


    /* ==========================
       DATE
    ========================== */

    function pad(value) {

      return String(value)
        .padStart(2, "0");

    }


    function localDateString(
      date = new Date()
    ) {

      return [

        date.getFullYear(),

        pad(
          date.getMonth() + 1
        ),

        pad(
          date.getDate()
        )

      ].join("-");

    }


    function addDays(
      date,
      amount
    ) {

      const result =
        new Date(date);

      result.setDate(
        result.getDate() + amount
      );

      return result;

    }


    function dateFromString(
      value
    ) {

      return new Date(
        value + "T00:00:00"
      );

    }


    function formatDate(
      value
    ) {

      return dateFromString(
        value
      ).toLocaleDateString(
        "ru-RU",
        {
          day: "numeric",
          month: "long"
        }
      );

    }


    function formatWeekday(
      value
    ) {

      return dateFromString(
        value
      ).toLocaleDateString(
        "ru-RU",
        {
          weekday: "long"
        }
      );

    }


    /* ==========================
       HTML SAFETY
    ========================== */

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ==========================
       TIME
    ========================== */

    function lessonDateTime(
      lesson,
      field
    ) {

      return new Date(
        `${lesson.date}T${lesson[field]}:00`
      );

    }


    function isCurrentLesson(
      lesson
    ) {

      const now =
        new Date();

      const start =
        lessonDateTime(
          lesson,
          "beginLesson"
        );

      const end =
        lessonDateTime(
          lesson,
          "endLesson"
        );

      return (
        now >= start &&
        now < end
      );

    }


    function hasEnded(
      lesson
    ) {

      return (
        new Date() >=
        lessonDateTime(
          lesson,
          "endLesson"
        )
      );

    }


    function sortLessons(
      lessons
    ) {

      return [
        ...lessons
      ].sort(
        (a, b) => {

          const date =
            (a.date || "")
              .localeCompare(
                b.date || ""
              );

          if (
            date !== 0
          ) {

            return date;

          }

          return (
            (a.beginLesson || "")
              .localeCompare(
                b.beginLesson || ""
              )
          );

        }
      );

    }


    /* ==========================
       SUBJECT STYLE
    ========================== */

    function subjectTheme(
      name
    ) {

      const text =
        String(
          name || ""
        ).toLowerCase();


      if (
        /китай|кит|chinese|中文/.test(
          text
        )
      ) {

        return "theme-orange";

      }


      if (
        /математ|math|статист/.test(
          text
        )
      ) {

        return "theme-purple";

      }


      if (
        /англ|english|иностран/.test(
          text
        )
      ) {

        return "theme-pink";

      }


      if (
        /эконом|финанс|эконометр|анализ/.test(
          text
        )
      ) {

        return "theme-blue";

      }


      if (
        /истор|прав|государ|полит/.test(
          text
        )
      ) {

        return "theme-indigo";

      }


      if (
        /физ|спорт|воен/.test(
          text
        )
      ) {

        return "theme-green";

      }


      if (
        /информ|программ|данн|it/.test(
          text
        )
      ) {

        return "theme-cyan";

      }


      const palette = [

        "theme-blue",
        "theme-purple",
        "theme-orange",
        "theme-pink",
        "theme-cyan",
        "theme-indigo"

      ];


      let hash = 0;


      for (
        let i = 0;
        i < text.length;
        i++
      ) {

        hash =
          (
            hash * 31 +
            text.charCodeAt(i)
          ) >>> 0;

      }


      return palette[
        hash % palette.length
      ];

    }


    /* ==========================
       NEXT LESSON
    ========================== */

    function findNextLesson() {

      const sorted =
        sortLessons(
          schedule
        );


      const current =
        sorted.find(
          lesson =>
            isCurrentLesson(
              lesson
            )
        );


      if (
        current
      ) {

        return {

          lesson: current,

          current: true

        };

      }


      const next =
        sorted.find(
          lesson =>
            !hasEnded(
              lesson
            )
        );


      if (
        next
      ) {

        return {

          lesson: next,

          current: false

        };

      }


      return null;

    }


    function renderNextLesson() {

      const container =
        document.getElementById(
          "nextLesson"
        );


      const result =
        findNextLesson();


      if (
        !result
      ) {

        container.innerHTML = `

          <section class="hero">

            <div class="hero-content">

              <div class="hero-label">
                Расписание
              </div>

              <div class="hero-subject">
                Ближайших занятий нет
              </div>

              <div class="hero-info">

                <div class="info-pill">
                  ✨ Расписание свободно
                </div>

              </div>

            </div>

          </section>

        `;

        return;

      }


      const lesson =
        result.lesson;


      container.innerHTML = `

        <section class="hero">

          <div class="hero-content">

            ${
              result.current

                ? `

                  <div class="live-label">

                    <span class="live-dot"></span>

                    СЕЙЧАС ИДЁТ

                  </div>

                `

                : `

                  <div class="hero-label">

                    Следующая пара

                  </div>

                `
            }


            <div class="hero-time">

              ${escapeHtml(
                lesson.beginLesson
              )}

              –

              ${escapeHtml(
                lesson.endLesson
              )}

            </div>


            <div class="hero-subject">

              ${escapeHtml(
                lesson.discipline ||
                "Предмет не указан"
              )}

            </div>


            <div class="hero-info">

              <div class="info-pill">

                📅

                ${escapeHtml(
                  formatWeekday(
                    lesson.date
                  )
                )}

                ,

                ${escapeHtml(
                  formatDate(
                    lesson.date
                  )
                )}

              </div>


              ${
                lesson.lecturer

                  ? `

                    <div class="info-pill">

                      👨‍🏫

                      ${escapeHtml(
                        lesson.lecturer
                      )}

                    </div>

                  `

                  : ""
              }


              ${
                lesson.auditorium

                  ? `

                    <div class="info-pill">

                      🏫

                      ${escapeHtml(
                        lesson.auditorium
                      )}

                    </div>

                  `

                  : ""
              }


              ${
                lesson.building

                  ? `

                    <div class="info-pill">

                      📍

                      ${escapeHtml(
                        lesson.building
                      )}

                    </div>

                  `

                  : ""
              }

            </div>

          </div>

        </section>

      `;

    }


    /* ==========================
       STATS
    ========================== */

    function renderStats() {

      const container =
        document.getElementById(
          "stats"
        );


      const today =
        localDateString();


      const todayLessons =
        schedule.filter(
          lesson =>
            lesson.date ===
            today
        );


      const totalMinutes =
        todayLessons.reduce(
          (
            total,
            lesson
          ) => {

            const start =
              lessonDateTime(
                lesson,
                "beginLesson"
              );

            const end =
              lessonDateTime(
                lesson,
                "endLesson"
              );

            return (

              total +

              Math.max(
                0,
                (
                  end - start
                ) / 60000
              )

            );

          },
          0
        );


      const hours =
        Math.floor(
          totalMinutes / 60
        );


      const minutes =
        Math.round(
          totalMinutes % 60
        );


      const buildings =
        new Set(

          todayLessons

            .map(
              lesson =>
                lesson.building
            )

            .filter(
              Boolean
            )

        ).size;


      container.innerHTML = `

        <div class="stat">

          <div class="stat-value">

            ${todayLessons.length}

          </div>

          <div class="stat-label">

            пар сегодня

          </div>

        </div>


        <div class="stat">

          <div class="stat-value">

            ${
              hours > 0

                ? `${hours}ч ${minutes}м`

                : `${minutes}м`
            }

          </div>

          <div class="stat-label">

            учебного времени

          </div>

        </div>


        <div class="stat">

          <div class="stat-value">

            ${buildings}

          </div>

          <div class="stat-label">

            корпуса сегодня

          </div>

        </div>

      `;

    }


    /* ==========================
       LESSON CARD
    ========================== */

    function renderLesson(
      lesson
    ) {

      const current =
        isCurrentLesson(
          lesson
        );


      const theme =
        subjectTheme(
          lesson.discipline
        );


      return `

        <article
          class="
            lesson
            ${theme}
            ${current ? "current" : ""}
          "
        >

          <div class="lesson-top">

            <div>

              <div class="lesson-time">

                ${escapeHtml(
                  lesson.beginLesson || ""
                )}

                –

                ${escapeHtml(
                  lesson.endLesson || ""
                )}

              </div>


              <div class="lesson-subject">

                ${escapeHtml(
                  lesson.discipline ||
                  "Предмет не указан"
                )}

              </div>

            </div>


            ${
              current

                ? `

                  <div class="current-badge">

                    СЕЙЧАС

                  </div>

                `

                : ""
            }

          </div>


          <div class="lesson-info">

            ${
              lesson.lecturer

                ? `

                  <div class="lesson-chip">

                    👨‍🏫

                    ${escapeHtml(
                      lesson.lecturer
                    )}

                  </div>

                `

                : ""
            }


            ${
              lesson.auditorium

                ? `

                  <div class="lesson-chip">

                    🏫

                    ${escapeHtml(
                      lesson.auditorium
                    )}

                  </div>

                `

                : ""
            }


            ${
              lesson.building

                ? `

                  <div class="lesson-chip">

                    📍

                    ${escapeHtml(
                      lesson.building
                    )}

                  </div>

                `

                : ""
            }

          </div>

        </article>

      `;

    }


    /* ==========================
       DAY
    ========================== */

    function renderDay(
      date,
      lessons
    ) {

      const sorted =
        sortLessons(
          lessons
        );


      const count =
        sorted.length;


      const word =
        count === 1
          ? "пара"
          : count < 5
            ? "пары"
            : "пар";


      return `

        <section class="day">

          <div class="day-heading">

            <div>

              <div class="weekday">

                ${escapeHtml(
                  formatWeekday(
                    date
                  )
                )}

              </div>

              <div class="date">

                ${escapeHtml(
                  formatDate(
                    date
                  )
                )}

              </div>

            </div>


            <div class="day-count">

              ${count} ${word}

            </div>

          </div>


          <div class="timeline">

            ${sorted
              .map(
                lesson =>
                  renderLesson(
                    lesson
                  )
              )
              .join("")
            }

          </div>

        </section>

      `;

    }


    /* ==========================
       FILTER
    ========================== */

    function getLessons() {

      const today =
        new Date();


      const todayString =
        localDateString(
          today
        );


      if (
        currentView ===
        "today"
      ) {

        return schedule.filter(
          lesson =>
            lesson.date ===
            todayString
        );

      }


      if (
        currentView ===
        "tomorrow"
      ) {

        const tomorrow =
          localDateString(
            addDays(
              today,
              1
            )
          );


        return schedule.filter(
          lesson =>
            lesson.date ===
            tomorrow
        );

      }


      if (
        currentView ===
        "week"
      ) {

        const end =
          localDateString(
            addDays(
              today,
              6
            )
          );


        return schedule.filter(
          lesson =>
            lesson.date >=
              todayString &&

            lesson.date <=
              end
        );

      }


      if (
        currentView ===
        "month"
      ) {

        const end =
          localDateString(
            addDays(
              today,
              29
            )
          );


        return schedule.filter(
          lesson =>
            lesson.date >=
              todayString &&

            lesson.date <=
              end
        );

      }


      /*
        БЛИЖАЙШЕЕ
      */

      const futureDates =
        [
          ...new Set(

            sortLessons(
              schedule
            )

              .filter(
                lesson =>
                  lesson.date >=
                  todayString
              )

              .map(
                lesson =>
                  lesson.date
              )

          )
        ];


      if (
        !futureDates.length
      ) {

        return [];

      }


      return schedule.filter(
        lesson =>
          lesson.date ===
          futureDates[0]
      );

    }


    /* ==========================
       MAIN RENDER
    ========================== */

    function renderSchedule() {

      const container =
        document.getElementById(
          "schedule"
        );


      const lessons =
        getLessons();


      if (
        !lessons.length
      ) {

        let title =
          "Занятий нет";


        let text =
          "В выбранном периоде занятий не найдено.";


        if (
          currentView ===
          "today"
        ) {

          title =
            "Сегодня свободный день";


          text =
            "На сегодня занятий нет.";

        }


        if (
          currentView ===
          "tomorrow"
        ) {

          title =
            "Завтра занятий нет";


          text =
            "Можно спокойно планировать день.";

        }


        if (
          currentView ===
          "week"
        ) {

          title =
            "Неделя свободна";


          text =
            "На ближайшие 7 дней занятий нет.";

        }


        if (
          currentView ===
          "month"
        ) {

          title =
            "Занятий нет";


          text =
            "На ближайшие 30 дней занятий нет.";

        }


        container.innerHTML = `

          <div class="empty">

            <div class="empty-icon">

              ✨

            </div>


            <div class="empty-title">

              ${title}

            </div>


            <div class="empty-text">

              ${text}

            </div>

          </div>

        `;

        return;

      }


      const grouped = {};


      for (
        const lesson
        of lessons
      ) {

        if (
          !grouped[
            lesson.date
          ]
        ) {

          grouped[
            lesson.date
          ] = [];

        }


        grouped[
          lesson.date
        ].push(
          lesson
        );

      }


      const dates =
        Object.keys(
          grouped
        ).sort();


      container.innerHTML =

        dates

          .map(
            date =>
              renderDay(
                date,
                grouped[date]
              )
          )

          .join("");

    }


    /* ==========================
       LOAD
    ========================== */

    async function loadSchedule() {

      const button =
        document.getElementById(
          "refreshButton"
        );


      const updated =
        document.getElementById(
          "updated"
        );


      button.classList.add(
        "loading"
      );


      button.textContent =
        "↻ Обновление...";


      try {

        const response =
          await fetch(
            "schedule.json?t=" +
            Date.now()
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "Не удалось загрузить schedule.json"
          );

        }


        const data =
          await response.json();


        if (
          !Array.isArray(
            data
          )
        ) {

          throw new Error(
            "schedule.json имеет неверный формат"
          );

        }


        schedule =
          sortLessons(
            data.filter(
              lesson =>
                lesson.date
            )
          );


        updated.textContent =
          "Обновлено в " +

          new Date()
            .toLocaleTimeString(
              "ru-RU",
              {
                hour:
                  "2-digit",

                minute:
                  "2-digit"
              }
            );


        renderNextLesson();

        renderStats();

        renderSchedule();


      } catch (
        error
      ) {

        document.getElementById(
          "schedule"
        ).innerHTML = `

          <div class="error">

            <strong>

              Не удалось загрузить расписание

            </strong>

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;


        console.error(
          error
        );

      } finally {

        button.classList.remove(
          "loading"
        );


        button.textContent =
          "↻ Обновить";

      }

    }


    /* ==========================
       TABS
    ========================== */

    document
      .querySelectorAll(
        ".tab"
      )

      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".tab"
                )

                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              currentView =
                button.dataset.view;


              renderSchedule();

            }
          );

        }
      );


    /* ==========================
       REFRESH
    ========================== */

    document
      .getElementById(
        "refreshButton"
      )

      .addEventListener(
        "click",
        loadSchedule
      );


    /* ==========================
       START
    ========================== */

    loadSchedule();


    setInterval(
      () => {

        renderNextLesson();

        renderStats();

        renderSchedule();

      },
      60 * 1000
    );


    setInterval(
      loadSchedule,
      5 * 60 * 1000
    );

  </script>
