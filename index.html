<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Расписание — МеждОт25-2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 50px;
    }

    header {
      margin-bottom: 30px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      color: #6e6e73;
      font-size: 16px;
    }

    .day {
      margin-bottom: 28px;
    }

    .date {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .lesson {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .time {
      font-size: 15px;
      font-weight: 700;
      color: #007aff;
      margin-bottom: 7px;
    }

    .discipline {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .info {
      color: #6e6e73;
      font-size: 14px;
      line-height: 1.6;
    }

    .today {
      border: 2px solid #007aff;
    }

    .today-label {
      display: inline-block;
      background: #007aff;
      color: white;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 8px;
      vertical-align: middle;
    }

    .loading {
      color: #6e6e73;
      text-align: center;
      padding: 40px 0;
    }

    .error {
      background: #fff0f0;
      color: #c00;
      padding: 16px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 14px 40px;
      }

      h1 {
        font-size: 27px;
      }

      .date {
        font-size: 20px;
      }

      .lesson {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Расписание</h1>
      <div class="subtitle">МеждОт25-2</div>
    </header>

    <main id="schedule">
      <div class="loading">
        Загружаем расписание...
      </div>
    </main>

  </div>

  <script>
    async function loadSchedule() {
      const container = document.getElementById("schedule");

      try {
        const response = await fetch("schedule.json");

        if (!response.ok) {
          throw new Error("Не удалось загрузить schedule.json");
        }

        const schedule = await response.json();

        if (!Array.isArray(schedule) || schedule.length === 0) {
          container.innerHTML = `
            <div class="error">
              Расписание пока пустое.
            </div>
          `;
          return;
        }

        const grouped = {};

        for (const lesson of schedule) {
          const date = lesson.date || "Без даты";

          if (!grouped[date]) {
            grouped[date] = [];
          }

          grouped[date].push(lesson);
        }

        const dates = Object.keys(grouped).sort();

        const today = new Date().toISOString().split("T")[0];

        container.innerHTML = "";

        for (const date of dates) {

          grouped[date].sort((a, b) => {
            return (a.beginLesson || "").localeCompare(
              b.beginLesson || ""
            );
          });

          const day = document.createElement("section");
          day.className = "day";

          const dateObject = new Date(date + "T00:00:00");

          const formattedDate = dateObject.toLocaleDateString(
            "ru-RU",
            {
              weekday: "long",
              day: "numeric",
              month: "long"
            }
          );

          const isToday = date === today;

          day.innerHTML = `
            <div class="date">
              ${formattedDate}
              ${isToday ? '<span class="today-label">СЕГОДНЯ</span>' : ""}
            </div>
          `;

          for (const lesson of grouped[date]) {

            const lessonElement = document.createElement("div");
            lessonElement.className = "lesson";

            if (isToday) {
              lessonElement.classList.add("today");
            }

            const begin = lesson.beginLesson || "";
            const end = lesson.endLesson || "";

            const discipline =
              lesson.discipline || "Предмет не указан";

            const lecturer =
              lesson.lecturer || "Преподаватель не указан";

            const auditorium =
              lesson.auditorium || "";

            const building =
              lesson.building || "";

            lessonElement.innerHTML = `
              <div class="time">
                ${begin}–${end}
              </div>

              <div class="discipline">
                ${discipline}
              </div>

              <div class="info">
                👨‍🏫 ${lecturer}
                ${auditorium ? `<br>🏫 ${auditorium}` : ""}
                ${building ? `<br>📍 ${building}` : ""}
              </div>
            `;

            day.appendChild(lessonElement);
          }

          container.appendChild(day);
        }

      } catch (error) {

        container.innerHTML = `
          <div class="error">
            Ошибка загрузки расписания:<br>
            ${error.message}
          </div>
        `;

        console.error(error);
      }
    }

    loadSchedule();
  </script>

</body>
</html>
