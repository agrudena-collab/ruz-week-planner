<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>РУЗ · МеждОт25-2</title>

  <style>
    :root {
      --bg: #eef2f7;
      --card: rgba(255,255,255,.78);
      --card-solid: #ffffff;
      --text: #17191d;
      --muted: #747983;
      --line: rgba(0,0,0,.07);
      --blue: #087cff;
      --blue-light: #e8f2ff;
      --green: #20a464;
      --green-light: #e9f8f0;
      --purple: #7657ff;
      --shadow: 0 12px 35px rgba(30,45,70,.08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(0,122,255,.13),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(118,87,255,.10),
          transparent 25%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(0,180,255,.08),
          transparent 30%
        ),
        var(--bg);
      min-height: 100vh;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(960px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 70px;
    }

    /* HEADER */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 22px;
      font-weight: 800;
      background:
        linear-gradient(
          135deg,
          var(--blue),
          var(--purple)
        );
      box-shadow:
        0 8px 20px rgba(58,100,255,.25);
    }

    .title {
      font-size: 31px;
      font-weight: 850;
      letter-spacing: -1px;
      line-height: 1.05;
    }

    .group {
      margin-top: 4px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .update-status {
      color: var(--muted);
      font-size: 12px;
    }

    .refresh {
      border: 0;
      color: white;
      background: var(--text);
      border-radius: 13px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    .refresh:active {
      transform: scale(.96);
    }

    .refresh.loading {
      opacity: .6;
      pointer-events: none;
    }

    /* HERO */

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      padding: 25px;
      margin-bottom: 14px;
      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.92),
          rgba(239,246,255,.80)
        );
      border: 1px solid rgba(255,255,255,.8);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      right: -90px;
      top: -110px;
      background: rgba(0,122,255,.08);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      left: -80px;
      bottom: -100px;
      background: rgba(118,87,255,.07);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-label {
      color: var(--blue);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .9px;
      text-transform: uppercase;
      margin-bottom: 9px;
    }

    .hero-time {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1.7px;
      line-height: 1;
      margin-bottom: 10px;
    }

    .hero-subject {
      max-width: 650px;
      font-size: 23px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 17px;
    }

    .hero-info {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .info-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 11px;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(0,0,0,.05);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .live-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--green);
      background: var(--green-light);
      border-radius: 10px;
      padding: 7px 10px;
      width: fit-content;
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .3px;
      margin-bottom: 10px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(32,164,100,.12);
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 18px;
      padding: 15px;
      box-shadow: 0 5px 18px rgba(30,45,70,.05);
      backdrop-filter: blur(14px);
    }

    .stat-value {
      font-size: 23px;
      font-weight: 850;
      letter-spacing: -.5px;
    }

    .stat-label {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    /* NAVIGATION */

    .tabs-wrap {
      position: sticky;
      top: 8px;
      z-index: 30;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 5px;
      background: rgba(225,229,237,.82);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(30,45,70,.07);
      backdrop-filter: blur(18px);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 1;
      min-width: 105px;
      border: 0;
      background: transparent;
      color: #686d77;
      padding: 10px 13px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      white-space: nowrap;
      transition: all .18s ease;
    }

    .tab.active {
      color: var(--text);
      background: white;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    /* DAY */

    .day {
      margin-bottom: 30px;
    }

    .day-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 15px;
      padding: 0 4px;
      margin-bottom: 11px;
    }

    .weekday {
      font-size: 21px;
      font-weight: 850;
      text-transform: capitalize;
      letter-spacing: -.35px;
    }

    .date {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }

    .day-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* TIMELINE */

    .timeline {
      position: relative;
      padding-left: 16px;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 5px;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: #dce1e8;
      border-radius: 10px;
    }

    .lesson {
      position: relative;
      background: rgba(255,255,255,.84);
      border: 1px solid rgba(0,0,0,.055);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 5px 18px rgba(30,45,70,.055);
      backdrop-filter: blur(12px);
    }

    .lesson::before {
      content: "";
      position: absolute;
      left: -16px;
      top: 21px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      border: 3px solid var(--blue);
      box-shadow: 0 0 0 3px var(--bg);
    }

    .lesson.current {
      border: 2px solid var(--green);
      background: rgba(249,255,252,.95);
      box-shadow: 0 7px 22px rgba(32,164,100,.12);
    }

    .lesson.current::before {
      background: var(--green);
      border-color: var(--green);
      box-shadow:
        0 0 0 3px var(--bg),
        0 0 0 7px rgba(32,164,100,.10);
    }

    .lesson-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .lesson-time {
      color: var(--blue);
      font-size: 15px;
      font-weight: 850;
      margin-bottom: 6px;
    }

    .lesson.current .lesson-time {
      color: var(--green);
    }

    .lesson-subject {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.28;
      margin-bottom: 9px;
    }

    .lesson-info {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .current-badge {
      color: var(--green);
      background: var(--green-light);
      border-radius: 9px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 850;
      white-space: nowrap;
    }

    /* EMPTY */

    .empty {
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(0,0,0,.05);
      border-radius: 20px;
      padding: 42px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .empty-text {
      color: var(--muted);
      font-size: 14px;
    }

    .error {
      padding: 17px;
      border-radius: 16px;
      background: #fff1f1;
      color: #bd2525;
      border: 1px solid #ffd3d3;
      line-height: 1.5;
    }

    .source {
      margin-top: 35px;
      text-align: center;
      color: #999ea8;
      font-size: 11px;
    }

    /* MOBILE */

    @media (max-width: 650px) {

      .container {
        width: calc(100% - 20px);
        padding-top: 17px;
      }

      .header {
        align-items: flex-start;
      }

      .brand-icon {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        font-size: 19px;
      }

      .title {
        font-size: 27px;
      }

      .group {
        font-size: 14px;
      }

      .header-right {
        gap: 5px;
      }

      .update-status {
        display: none;
      }

      .refresh {
        padding: 9px 11px;
        font-size: 12px;
      }

      .hero {
        padding: 19px;
        border-radius: 21px;
      }

      .hero-time {
        font-size: 35px;
      }

      .hero-subject {
        font-size: 19px;
      }

      .stats {
        gap: 7px;
      }

      .stat {
        padding: 12px;
        border-radius: 15px;
      }

      .stat-value {
        font-size: 20px;
      }

      .stat-label {
        font-size: 11px;
      }

      .tabs-wrap {
        top: 5px;
      }

      .tabs {
        border-radius: 14px;
      }

      .tab {
        min-width: 92px;
        font-size: 12px;
        padding: 10px 8px;
      }

      .weekday {
        font-size: 19px;
      }

      .day-count {
        font-size: 11px;
      }

      .timeline {
        padding-left: 13px;
      }

      .lesson {
        padding: 14px;
        border-radius: 16px;
      }

      .lesson::before {
        left: -13px;
        width: 9px;
        height: 9px;
      }

      .lesson-subject {
        font-size: 16px;
      }

      .lesson-info {
        font-size: 12px;
      }

      .current-badge {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->

    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          R
        </div>

        <div>
          <div class="title">
            Расписание
          </div>

          <div class="group">
            МеждОт25-2
          </div>
        </div>

      </div>


      <div class="header-right">

        <div
          class="update-status"
          id="updated"
        >
          Загрузка...
        </div>

        <button
          class="refresh"
          id="refreshButton"
        >
          ↻ Обновить
        </button>

      </div>

    </header>


    <!-- HERO -->

    <div id="nextLesson"></div>


    <!-- STATS -->

    <div
      class="stats"
      id="stats"
    ></div>


    <!-- NAVIGATION -->

    <div class="tabs-wrap">

      <nav class="tabs">

        <button
          class="tab active"
          data-view="nearest"
        >
          Ближайшее
        </button>

        <button
          class="tab"
          data-view="today"
        >
          Сегодня
        </button>

        <button
          class="tab"
          data-view="tomorrow"
        >
          Завтра
        </button>

        <button
          class="tab"
          data-view="week"
        >
          Неделя
        </button>

        <button
          class="tab"
          data-view="month"
        >
          Месяц
        </button>

      </nav>

    </div>


    <!-- SCHEDULE -->

    <main id="schedule">

      <div class="empty">
        Загрузка расписания...
      </div>

    </main>


    <div class="source">
      Автоматически обновляется из РУЗ
    </div>

  </div>


  <script>

    let schedule = [];

    let currentView = "nearest";


    /* ==========================
       DATE
    ========================== */

    function pad(value) {
      return String(value).padStart(2, "0");
    }


    function localDateString(
      date = new Date()
    ) {

      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join("-");
    }


    function addDays(
      date,
      amount
    ) {

      const result =
        new Date(date);

      result.setDate(
        result.getDate() + amount
      );

      return result;
    }


    function dateFromString(
      value
    ) {

      return new Date(
        value + "T00:00:00"
      );
    }


    function formatDate(
      value
    ) {

      return dateFromString(
        value
      ).toLocaleDateString(
        "ru-RU",
        {
          day: "numeric",
          month: "long"
        }
      );
    }


    function formatWeekday(
      value
    ) {

      return dateFromString(
        value
      ).toLocaleDateString(
        "ru-RU",
        {
          weekday: "long"
        }
      );
    }


    /* ==========================
       HTML SAFETY
    ========================== */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* ==========================
       LESSON TIME
    ========================== */

    function lessonDateTime(
      lesson,
      field
    ) {

      return new Date(
        `${lesson.date}T${lesson[field]}:00`
      );
    }


    function isCurrentLesson(
      lesson
    ) {

      const now =
        new Date();

      const start =
        lessonDateTime(
          lesson,
          "beginLesson"
        );

      const end =
        lessonDateTime(
          lesson,
          "endLesson"
        );

      return (
        now >= start &&
        now < end
      );
    }


    function hasEnded(
      lesson
    ) {

      return (
        new Date() >=
        lessonDateTime(
          lesson,
          "endLesson"
        )
      );
    }


    function sortLessons(
      lessons
    ) {

      return [...lessons].sort(
        (a, b) => {

          const date =
            (a.date || "")
              .localeCompare(
                b.date || ""
              );

          if (date !== 0) {
            return date;
          }

          return (
            (a.beginLesson || "")
              .localeCompare(
                b.beginLesson || ""
              )
          );
        }
      );
    }


    /* ==========================
       NEXT LESSON
    ========================== */

    function findNextLesson() {

      const sorted =
        sortLessons(schedule);


      const current =
        sorted.find(
          lesson =>
            isCurrentLesson(
              lesson
            )
        );


      if (current) {

        return {
          lesson: current,
          current: true
        };

      }


      const next =
        sorted.find(
          lesson =>
            !hasEnded(
              lesson
            )
        );


      if (next) {

        return {
          lesson: next,
          current: false
        };

      }


      return null;
    }


    function renderNextLesson() {

      const container =
        document.getElementById(
          "nextLesson"
        );


      const result =
        findNextLesson();


      if (!result) {

        container.innerHTML = `
          <section class="hero">

            <div class="hero-content">

              <div class="hero-label">
                Расписание
              </div>

              <div class="hero-subject">
                Ближайших занятий нет
              </div>

              <div class="hero-info">

                <div class="info-pill">
                  ✨ Расписание свободно
                </div>

              </div>

            </div>

          </section>
        `;

        return;
      }


      const lesson =
        result.lesson;


      const current =
        result.current;


      container.innerHTML = `

        <section class="hero">

          <div class="hero-content">

            ${
              current
                ? `
                  <div class="live-label">
                    <span class="live-dot"></span>
                    СЕЙЧАС ИДЁТ
                  </div>
                `
                : `
                  <div class="hero-label">
                    Следующая пара
                  </div>
                `
            }

            <div class="hero-time">

              ${escapeHtml(
                lesson.beginLesson
              )}

              –

              ${escapeHtml(
                lesson.endLesson
              )}

            </div>


            <div class="hero-subject">

              ${escapeHtml(
                lesson.discipline ||
                "Предмет не указан"
              )}

            </div>


            <div class="hero-info">

              <div class="info-pill">
                📅
                ${escapeHtml(
                  formatWeekday(
                    lesson.date
                  )
                )},
                ${escapeHtml(
                  formatDate(
                    lesson.date
                  )
                )}
              </div>


              ${
                lesson.lecturer
                  ? `
                    <div class="info-pill">
                      👨‍🏫
                      ${escapeHtml(
                        lesson.lecturer
                      )}
                    </div>
                  `
                  : ""
              }


              ${
                lesson.auditorium
                  ? `
                    <div class="info-pill">
                      🏫
                      ${escapeHtml(
                        lesson.auditorium
                      )}
                    </div>
                  `
                  : ""
              }


              ${
                lesson.building
                  ? `
                    <div class="info-pill">
                      📍
                      ${escapeHtml(
                        lesson.building
                      )}
                    </div>
                  `
                  : ""
              }

            </div>

          </div>

        </section>

      `;
    }


    /* ==========================
       STATS
    ========================== */

    function renderStats() {

      const container =
        document.getElementById(
          "stats"
        );


      const today =
        localDateString();


      const todayLessons =
        schedule.filter(
          lesson =>
            lesson.date === today
        );


      const totalMinutes =
        todayLessons.reduce(
          (total, lesson) => {

            const start =
              lessonDateTime(
                lesson,
                "beginLesson"
              );

            const end =
              lessonDateTime(
                lesson,
                "endLesson"
              );

            return (
              total +
              Math.max(
                0,
                (end - start) /
                60000
              )
            );

          },
          0
        );


      const hours =
        Math.floor(
          totalMinutes / 60
        );

      const minutes =
        Math.round(
          totalMinutes % 60
        );


      const buildings =
        new Set(
          todayLessons
            .map(
              lesson =>
                lesson.building
            )
            .filter(Boolean)
        ).size;


      container.innerHTML = `

        <div class="stat">

          <div class="stat-value">
            ${todayLessons.length}
          </div>

          <div class="stat-label">
            пар сегодня
          </div>

        </div>


        <div class="stat">

          <div class="stat-value">

            ${
              hours > 0
                ? `${hours}ч ${minutes}м`
                : `${minutes}м`
            }

          </div>

          <div class="stat-label">
            учебного времени
          </div>

        </div>


        <div class="stat">

          <div class="stat-value">
            ${buildings}
          </div>

          <div class="stat-label">
            корпуса сегодня
          </div>

        </div>

      `;
    }


    /* ==========================
       LESSON CARD
    ========================== */

    function renderLesson(
      lesson
    ) {

      const current =
        isCurrentLesson(
          lesson
        );


      return `

        <article
          class="lesson
          ${current ? "current" : ""}"
        >

          <div class="lesson-top">

            <div>

              <div class="lesson-time">

                ${escapeHtml(
                  lesson.beginLesson ||
                  ""
                )}

                –

                ${escapeHtml(
                  lesson.endLesson ||
                  ""
                )}

              </div>


              <div class="lesson-subject">

                ${escapeHtml(
                  lesson.discipline ||
                  "Предмет не указан"
                )}

              </div>

            </div>


            ${
              current
                ? `
                  <div class="current-badge">
                    СЕЙЧАС
                  </div>
                `
                : ""
            }

          </div>


          <div class="lesson-info">

            ${
              lesson.lecturer
                ? `
                  <div>
                    👨‍🏫
                    ${escapeHtml(
                      lesson.lecturer
                    )}
                  </div>
                `
                : ""
            }


            ${
              lesson.auditorium
                ? `
                  <div>
                    🏫
                    ${escapeHtml(
                      lesson.auditorium
                    )}
                  </div>
                `
                : ""
            }


            ${
              lesson.building
                ? `
                  <div>
                    📍
                    ${escapeHtml(
                      lesson.building
                    )}
                  </div>
                `
                : ""
            }

          </div>

        </article>

      `;
    }


    /* ==========================
       DAY
    ========================== */

    function renderDay(
      date,
      lessons
    ) {

      const sorted =
        sortLessons(
          lessons
        );


      return `

        <section class="day">

          <div class="day-heading">

            <div>

              <div class="weekday">
                ${escapeHtml(
                  formatWeekday(
                    date
                  )
                )}
              </div>

              <div class="date">
                ${escapeHtml(
                  formatDate(
                    date
                  )
                )}
              </div>

            </div>


            <div class="day-count">

              ${sorted.length}
              ${
                sorted.length === 1
                  ? "пара"
                  : sorted.length < 5
                    ? "пары"
                    : "пар"
              }

            </div>

          </div>


          <div class="timeline">

            ${sorted
              .map(
                lesson =>
                  renderLesson(
                    lesson
                  )
              )
              .join("")
            }

          </div>

        </section>

      `;
    }


    /* ==========================
       FILTER
    ========================== */

    function getLessons() {

      const today =
        new Date();

      const todayString =
        localDateString(
          today
        );


      if (
        currentView === "today"
      ) {

        return schedule.filter(
          lesson =>
            lesson.date ===
            todayString
        );

      }


      if (
        currentView === "tomorrow"
      ) {

        const tomorrow =
          localDateString(
            addDays(
              today,
              1
            )
          );


        return schedule.filter(
          lesson =>
            lesson.date ===
            tomorrow
        );

      }


      if (
        currentView === "week"
      ) {

        const end =
          localDateString(
            addDays(
              today,
              6
            )
          );


        return schedule.filter(
          lesson =>
            lesson.date >=
              todayString &&
            lesson.date <=
              end
        );

      }


      if (
        currentView === "month"
      ) {

        const end =
          localDateString(
            addDays(
              today,
              29
            )
          );


        return schedule.filter(
          lesson =>
            lesson.date >=
              todayString &&
            lesson.date <=
              end
        );

      }


      /*
        БЛИЖАЙШЕЕ
      */

      const futureDates = [
        ...new Set(
          sortLessons(schedule)
            .filter(
              lesson =>
                lesson.date >=
                todayString
            )
            .map(
              lesson =>
                lesson.date
            )
        )
      ];


      if (
        !futureDates.length
      ) {

        return [];

      }


      return schedule.filter(
        lesson =>
          lesson.date ===
          futureDates[0]
      );
    }


    /* ==========================
       MAIN RENDER
    ========================== */

    function renderSchedule() {

      const container =
        document.getElementById(
          "schedule"
        );


      const lessons =
        getLessons();


      if (
        !lessons.length
      ) {

        let title =
          "Занятий нет";

        let text =
          "В выбранном периоде занятий не найдено.";


        if (
          currentView === "today"
        ) {

          title =
            "Сегодня свободный день";

          text =
            "На сегодня занятий нет.";

        }


        if (
          currentView === "tomorrow"
        ) {

          title =
            "Завтра занятий нет";

          text =
            "Можно спокойно планировать день.";

        }


        if (
          currentView === "week"
        ) {

          title =
            "Неделя свободна";

          text =
            "На ближайшие 7 дней занятий нет.";

        }


        if (
          currentView === "month"
        ) {

          title =
            "Занятий нет";

          text =
            "На ближайшие 30 дней занятий нет.";

        }


        container.innerHTML = `

          <div class="empty">

            <div class="empty-icon">
              ✨
            </div>

            <div class="empty-title">
              ${title}
            </div>

            <div class="empty-text">
              ${text}
            </div>

          </div>

        `;

        return;
      }


      const grouped =
        {};


      for (
        const lesson
        of lessons
      ) {

        if (
          !grouped[
            lesson.date
          ]
        ) {

          grouped[
            lesson.date
          ] = [];

        }


        grouped[
          lesson.date
        ].push(
          lesson
        );

      }


      const dates =
        Object.keys(
          grouped
        ).sort();


      container.innerHTML =
        dates
          .map(
            date =>
              renderDay(
                date,
                grouped[date]
              )
          )
          .join("");
    }


    /* ==========================
       LOAD
    ========================== */

    async function loadSchedule() {

      const button =
        document.getElementById(
          "refreshButton"
        );


      const updated =
        document.getElementById(
          "updated"
        );


      button.classList.add(
        "loading"
      );

      button.textContent =
        "↻ Обновление...";


      try {

        const response =
          await fetch(
            "schedule.json?t=" +
            Date.now()
          );


        if (!response.ok) {

          throw new Error(
            "Не удалось загрузить schedule.json"
          );

        }


        const data =
          await response.json();


        if (
          !Array.isArray(data)
        ) {

          throw new Error(
            "schedule.json имеет неверный формат"
          );

        }


        schedule =
          sortLessons(
            data.filter(
              lesson =>
                lesson.date
            )
          );


        updated.textContent =
          "Обновлено в " +
          new Date()
            .toLocaleTimeString(
              "ru-RU",
              {
                hour: "2-digit",
                minute: "2-digit"
              }
            );


        renderNextLesson();
        renderStats();
        renderSchedule();


      } catch (error) {

        document.getElementById(
          "schedule"
        ).innerHTML = `

          <div class="error">

            <strong>
              Не удалось загрузить расписание
            </strong>

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;

        console.error(error);

      } finally {

        button.classList.remove(
          "loading"
        );

        button.textContent =
          "↻ Обновить";
      }
    }


    /* ==========================
       TABS
    ========================== */

    document
      .querySelectorAll(
        ".tab"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".tab"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              button.classList.add(
                "active"
              );


              currentView =
                button.dataset.view;


              renderSchedule();

            }
          );

        }
      );


    /* ==========================
       REFRESH
    ========================== */

    document
      .getElementById(
        "refreshButton"
      )
      .addEventListener(
        "click",
        loadSchedule
      );


    /* ==========================
       START
    ========================== */

    loadSchedule();


    /*
      Обновляем текущую пару
      каждую минуту.
    */

    setInterval(
      () => {

        renderNextLesson();
        renderStats();
        renderSchedule();

      },
      60 * 1000
    );


    /*
      Проверяем новые данные
      каждые 5 минут.
    */

    setInterval(
      loadSchedule,
      5 * 60 * 1000
    );

  </script>

</body>
</html>
