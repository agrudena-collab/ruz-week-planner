<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">

<title>Расписание — МеждОт25-2</title>

<style>

:root {
  --bg: #080b14;
  --panel: #0d1220;
  --panel-2: #111827;
  --line: rgba(255,255,255,.09);

  --text: #f5f7fb;
  --muted: #8993a7;
  --soft: #b9c1d0;

  --radius: 24px;

  --shadow:
    0 18px 55px rgba(0,0,0,.28);
}


/* =========================
   BASE
========================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;

  color: var(--text);

  background:
    radial-gradient(
      circle at 20% -10%,
      rgba(91,107,255,.12),
      transparent 32%
    ),
    radial-gradient(
      circle at 100% 0%,
      rgba(44,211,153,.06),
      transparent 28%
    ),
    var(--bg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Inter,
    "Segoe UI",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  color: inherit;
}


/* =========================
   APP
========================= */

.app {
  width: min(1100px, calc(100% - 24px));

  margin: 0 auto;

  padding:
    18px
    0
    60px;
}


/* =========================
   TOP
========================= */

.top {
  position: sticky;

  top: 0;

  z-index: 20;

  padding:
    8px
    0
    14px;

  background:
    linear-gradient(
      var(--bg) 72%,
      transparent
    );

  backdrop-filter:
    blur(12px);
}


/* =========================
   HEADER
========================= */

.header {
  display: flex;

  align-items: flex-end;

  justify-content: space-between;

  gap: 18px;

  margin-bottom: 16px;
}


.brand {
  display: flex;

  align-items: center;

  gap: 13px;
}


.logo {
  width: 50px;
  height: 50px;

  border-radius: 16px;

  display: grid;

  place-items: center;

  font-weight: 900;

  font-size: 22px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #6d72ff,
      #8b5cf6
    );

  box-shadow:
    0 10px 30px
    rgba(104,91,255,.25);
}


h1 {
  margin: 0 0 5px;

  font-size: 28px;

  line-height: 1.05;

  letter-spacing: -.8px;
}


.subtitle {
  color: var(--muted);

  font-size: 14px;
}


.updated {
  color: var(--muted);

  font-size: 13px;

  text-align: right;
}


.refresh {
  margin-top: 6px;

  border:
    1px solid var(--line);

  background:
    #121827;

  padding:
    9px 13px;

  border-radius: 13px;

  cursor: pointer;

  font-weight: 700;
}

.refresh:active {
  transform: scale(.98);
}


/* =========================
   TABS
========================= */

.tabs {
  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 5px;

  padding: 5px;

  background:
    rgba(255,255,255,.055);

  border:
    1px solid var(--line);

  border-radius: 17px;
}


.tab {
  border: 0;

  background: transparent;

  color: var(--muted);

  padding:
    11px 8px;

  border-radius: 12px;

  cursor: pointer;

  font-weight: 750;

  font-size: 14px;
}


.tab.active {
  background: #f7f8fb;

  color: #111827;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.2);
}


/* =========================
   CONTENT
========================= */

.content {
  padding-top: 8px;
}


/* =========================
   DAY
========================= */

.day {
  margin: 24px 0 0;
}


.day-head {
  display: flex;

  align-items: center;

  justify-content: space-between;

  margin:
    0 4px
    11px;
}


.day-title {
  font-size: 20px;

  font-weight: 850;

  letter-spacing: -.35px;
}


.day-date {
  color: var(--muted);

  font-size: 13px;

  margin-top: 3px;
}


.count {
  color: var(--muted);

  font-size: 12px;

  border:
    1px solid var(--line);

  padding:
    6px 9px;

  border-radius: 999px;
}


.cards {
  display: grid;

  gap: 11px;
}


/* =========================
   LESSON CARD
========================= */

.card {

  --accent: #7c83ff;
  --accent2: #9aa0ff;

  position: relative;

  overflow: hidden;

  border:
    1px solid var(--line);

  border-radius: 22px;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );

  box-shadow:
    0 8px 26px
    rgba(0,0,0,.16);

  cursor: pointer;

  transition:
    transform .22s ease,
    border-color .22s ease,
    background .22s ease;
}


.card:hover {
  transform:
    translateY(-2px);

  border-color:
    color-mix(
      in srgb,
      var(--accent) 38%,
      transparent
    );
}


.card.open {
  border-color:
    color-mix(
      in srgb,
      var(--accent) 50%,
      transparent
    );

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );
}


/* цветная линия слева */

.card::before {

  content: "";

  position: absolute;

  inset:
    0 auto 0 0;

  width: 4px;

  background:
    var(--accent);
}


/* =========================
   CARD MAIN
========================= */

.card-main {

  padding:
    18px
    18px
    16px
    21px;

  position: relative;

  min-height: 132px;
}


.time {

  font-size: 16px;

  font-weight: 850;

  color: var(--accent2);

  letter-spacing: .2px;
}


.subject {

  font-size: 21px;

  line-height: 1.13;

  font-weight: 850;

  letter-spacing: -.45px;

  margin:
    8px 0
    14px;

  max-width: 75%;
}


/* =========================
   META
========================= */

.meta {

  display: flex;

  flex-wrap: wrap;

  gap: 7px;
}


.pill {

  border:
    1px solid
    rgba(255,255,255,.085);

  background:
    rgba(0,0,0,.16);

  color:
    #aeb7c7;

  border-radius: 10px;

  padding:
    6px 9px;

  font-size: 12px;

  white-space: nowrap;
}


.pill b {

  color:
    #dce1eb;

  font-weight: 700;
}


/* =========================
   DECORATIVE SVG
========================= */

.motif {

  position: absolute;

  right: 15px;

  top: 15px;

  width: 150px;

  height: 95px;

  opacity: .46;

  pointer-events: none;
}


/* =========================
   EXPANDED DETAILS
========================= */

.card-details {

  display: grid;

  grid-template-rows:
    0fr;

  transition:
    grid-template-rows
    .28s ease;
}


.card.open .card-details {

  grid-template-rows:
    1fr;
}


.details-inner {

  overflow: hidden;
}


.details {

  border-top:
    1px solid
    var(--line);

  padding:
    15px
    18px
    17px
    21px;

  display: grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:
    11px 20px;
}


.detail-label {

  font-size: 11px;

  color: #737e92;

  text-transform: uppercase;

  letter-spacing: .8px;

  margin-bottom: 3px;
}


.detail-value {

  font-size: 13px;

  color: #e2e6ed;

  line-height: 1.35;
}


/* =========================
   EMPTY
========================= */

.empty {

  border:
    1px dashed
    var(--line);

  border-radius: 20px;

  padding:
    34px 20px;

  color: var(--muted);

  text-align: center;
}


.loading {

  text-align: center;

  color: var(--muted);

  padding:
    60px 0;
}


.error {

  border:
    1px solid
    rgba(255,90,90,.28);

  background:
    rgba(255,80,80,.07);

  padding: 18px;

  border-radius: 18px;

  color: #ffb5b5;
}


/* =========================
   MOBILE
========================= */

@media (max-width:650px) {

  .app {

    width:
      calc(100% - 20px);

    padding:
      12px
      0
      45px;
  }


  .header {

    align-items:
      flex-start;
  }


  .updated {

    display: none;
  }


  h1 {

    font-size: 25px;
  }


  .tabs {

    grid-template-columns:
      repeat(
        5,
        minmax(0,1fr)
      );

    overflow: auto;
  }


  .tab {

    font-size: 12px;

    padding:
      10px 4px;
  }


  .subject {

    font-size: 19px;

    max-width: 82%;
  }


  .details {

    grid-template-columns:
      1fr;
  }


  .motif {

    right: 5px;

    opacity: .30;

    width: 125px;
  }

}


@media (prefers-reduced-motion: reduce) {

  * {

    scroll-behavior:
      auto !important;

    transition:
      none !important;
  }

}

</style>
</head>


<body>


<div class="app">


  <!-- =====================
       TOP
  ====================== -->

  <div class="top">


    <!-- HEADER -->

    <div class="header">


      <div class="brand">


        <div class="logo">
          R
        </div>


        <div>

          <h1>
            Расписание
          </h1>

          <div class="subtitle">
            МеждОт25-2
          </div>

        </div>


      </div>


      <div class="updated">

        <div id="updatedText">
          Загрузка…
        </div>


        <button
          class="refresh"

      </button>

    </div>


  </div>


  <!-- CONTENT -->

  <main
    class="content"
    id="content"
  >

      Загружаю расписание…

  </main>


</div>


<script>


/* =========================
   STATE
========================= */

const state = {

/* =========================

========================= */

const RU_DAYS = [

  "августа",

  "сентября",

  "октября",

  "ноября",

  "декабря"

];


/* =========================
   SUBJECT THEMES
========================= */

const THEMES = {


  "Военная подготовка": {

    a: "#32d69b",

    b: "#65efbf",

    icon: "military"

  },

    a: "#4fcf87",

    icon: "economy"

/* =========================
   FALLBACK THEME
========================= */

function themeFor(subject) {

  return (

    THEMES[subject] ||

    {

      a: "#8b93ff",

      b: "#b3b9ff",

      icon: "default"

    }

  );

}


/* =========================
   HTML ESCAPE
========================= */

function esc(value) {

  return String(value ?? "")

    .replace(
      /[&<>"']/g,
      function(match) {

        return {

          "&": "&amp;",

          "<": "&lt;",

          ">": "&gt;",

          '"': "&quot;",

          "'": "&#039;"

        }[match];

      }
    );

}


/* =========================
   DATE HELPERS
========================= */

function parseDate(value) {

  const parts =
    value
      .split("-")
      .map(Number);


  return new Date(

    parts[0],

    parts[1] - 1,

    parts[2]

  );

}


function dateKey(date) {

  const y =
    date.getFullYear();


  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");


  const d =
    String(
      date.getDate()
    ).padStart(2, "0");


  return `${y}-${m}-${d}`;

}


function dateText(date) {

  return (

    date.getDate() +

    " " +

    RU_MONTHS[
      date.getMonth()
    ]

  );

}


function formatUpdated() {

  return (

    "Обновлено в " +

    new Date()
      .toLocaleTimeString(
        "ru-RU",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      )

  );

}

========================= */

        r="2.5"
      />

      <path
        d="M36 64l22-10 21-12 24-11"
      />

    `,


    /* Анализ данных */

    data: `

    default: `

      <circle

      />

        d="M72 20v56"

  };


  return `

    <svg

/* =========================
   CARD
========================= */

function cardTemplate(lesson) {


  const theme =
    themeFor(
      lesson.discipline
    );


  const id =

    `${lesson.date}-` +

    `${lesson.beginLesson}-` +

    `${Math.random()
      .toString(36)
      .slice(2)}`;


  return `

    <article

      class="card"

      style="

        --accent:${theme.a};

        --accent2:${theme.b};

      "

      data-id="${id}"

    >


      <div class="card-main">


        <div class="motif">

          ${motif(theme.icon)}

        </div>


        <div class="time">

          ${esc(
            lesson.beginLesson
          )}

          —

          ${esc(
            lesson.endLesson

                )}

              </div>

}


/* =========================
   CARD CLICK
========================= */

function attachCards() {


  document
    .querySelectorAll(".card")
    .forEach(
      card => {


        card.addEventListener(
          "click",
          () => {

            card.classList.toggle(
              "open"
            );

          }
        );


      }
    );

}


/* =========================
   GROUP BY DATE
========================= */

function groupByDate(items) {


  const groups =
    new Map();


  items
    .sort(
      (a,b) =>

        (
          a.date +
          a.beginLesson
        )
        .localeCompare(
          b.date +
          b.beginLesson
        )

    )
    .forEach(
      lesson => {


        if (
          !groups.has(
            lesson.date
          )
        ) {

          groups.set(
            lesson.date,
            []
          );

        }


        groups
          .get(
            lesson.date
          )
          .push(
            lesson
          );


      }
    );


  return groups;

}


/* =========================
   DAY
========================= */

function dayBlock(
  date,
  lessons
) {


  const d =
    parseDate(date);


  return `

    <section class="day">


      <div class="day-head">


        <div>


          <div class="day-title">

            ${RU_DAYS[
              d.getDay()
            ]}

          </div>


          <div class="day-date">

            ${dateText(d)}

          </div>


        </div>


        <div class="count">

          ${lessons.length}

          ${
            lessons.length === 1
              ? "пара"
              : lessons.length < 5
                ? "пары"
                : "пар"
          }

        </div>


      </div>


      <div class="cards">

        ${lessons
          .map(cardTemplate)
          .join("")}

      </div>


    </section>

  `;

}


/* =========================
   RENDER
========================= */

function render(items) {


  const content =
    document.getElementById(
      "content"
    );


  if (
    !items.length
  ) {

    content.innerHTML = `

      <div class="empty">

        На этот период
        занятий нет.

      </div>

    `;

    return;

  }


  const groups =
    groupByDate(items);


  content.innerHTML =

    [...groups]

      .map(
        ([date, lessons]) =>

          dayBlock(
            date,
            lessons
          )

      )

      .join("");


  attachCards();

}


/* =========================
   TODAY
========================= */

function nowDate() {


  const date =
    new Date();


  date.setHours(
    0,
    0,
    0,
    0
  );


  return date;

}


/* =========================
   TOMORROW
========================= */

function tomorrow() {


  const date =
    nowDate();


  date.setDate(
    date.getDate() + 1
  );


  return date;

}


/* =========================
   WEEK END
========================= */

function weekEnd(
  date
) {


  const end =
    new Date(date);


  end.setDate(
    end.getDate() + 6
  );


  return end;

}


/* =========================
   FILTER
========================= */

function viewItems() {


  const all =

    state.data
      .slice()
      .sort(
        (a,b) =>

          (
            a.date +
            a.beginLesson
          )
          .localeCompare(
            b.date +
            b.beginLesson
          )
      );


  const today =
    nowDate();


  const todayKey =
    dateKey(today);


  const tomorrowKey =
    dateKey(
      tomorrow()
    );


  /* TODAY */

  if (
    state.view === "today"
  ) {

    return all.filter(
      lesson =>

        lesson.date ===
        todayKey
    );

  }


  /* TOMORROW */

  if (
    state.view === "tomorrow"
  ) {

    return all.filter(
      lesson =>

        lesson.date ===
        tomorrowKey
    );

  }


  /* WEEK */

  if (
    state.view === "week"
  ) {


    const end =
      weekEnd(today);


    return all.filter(
      lesson => {


        const date =
          parseDate(
            lesson.date
          );


        return (

          date >= today &&

          date <= end

        );

      }
    );

  }


  /* MONTH */

  if (
    state.view === "month"
  ) {


    return all.filter(
      lesson => {


        const date =
          parseDate(
            lesson.date
          );


        return (

          date.getFullYear() ===
          today.getFullYear()

          &&

          date.getMonth() ===
          today.getMonth()

        );

      }
    );

  }


  /* =====================
     NEAREST
  ===================== */


  return all

    .filter(
      lesson =>

        parseDate(
          lesson.date
        ) >= today
    )

    .slice(
      0,
      8
    );

}


/* =========================
   RENDER CURRENT VIEW
========================= */

function renderCurrent() {


  document
    .querySelectorAll(".tab")
    .forEach(
      button => {


        button.classList.toggle(

          "active",

          button.dataset.view ===
          state.view

        );


      }
    );


  render(
    viewItems()
  );

}


/* =========================
   LOAD
========================= */

async function load() {


  const content =
    document.getElementById(
      "content"
    );


  content.innerHTML = `

    <div class="loading">

      Загружаю расписание…

    </div>

  `;


  try {


    const response =

      await fetch(

        "./schedule.json?ts=" +
        Date.now(),

        {

          cache:
            "no-store"

        }

      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !Array.isArray(data)
    ) {

      throw new Error(
        "schedule.json должен содержать массив"
      );

    }


    state.data =
      data;


    document
      .getElementById(
        "updatedText"
      )
      .textContent =
      formatUpdated();


    renderCurrent();


  }

  catch(error) {


    content.innerHTML = `

      <div class="error">


        <b>

          Не удалось
          загрузить расписание.

        </b>


        <br>
        <br>


        Проверь, что

        <code>
          index.html
        </code>

        и

        <code>
          schedule.json
        </code>

        лежат в одной папке
        GitHub Pages.


        <br>
        <br>


        Ошибка:

        ${esc(
          error.message
        )}


      </div>

    `;


  }

}


/* =========================
   TAB CLICK
========================= */

document
  .getElementById(
    "tabs"
  )
  .addEventListener(
    "click",
    event => {


      const button =
        event.target.closest(
          ".tab"
        );


      if (
        !button
      ) return;


      state.view =
        button.dataset.view;


      renderCurrent();

    }
  );


/* =========================
   REFRESH
========================= */

document
  .getElementById(
    "refresh"
  )
  .addEventListener(
    "click",
    load
  );


/* =========================
   START
========================= */

load();


</script>
