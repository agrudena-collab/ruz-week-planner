<script>


let schedule = [];

let currentView = "nearest";


const $ =
  id =>
    document.getElementById(id);


/* =========================
   DATE
========================= */

function pad(n){

  return String(n).padStart(
    2,
    "0"
  );

}


function localDateString(
  d = new Date()
){

  return (

    d.getFullYear()

    + "-"

    + pad(
      d.getMonth() + 1
    )

    + "-"

    + pad(
      d.getDate()
    )

  );

}


function addDays(
  d,
  n
){

  const x =
    new Date(d);

  x.setDate(
    x.getDate() + n
  );

  return x;

}


function dateFromString(v){

  return new Date(
    v + "T00:00:00"
  );

}


function formatDate(v){

  return dateFromString(v)
    .toLocaleDateString(
      "ru-RU",
      {
        day:"numeric",
        month:"long"
      }
    );

}


function formatWeekday(v){

  return dateFromString(v)
    .toLocaleDateString(
      "ru-RU",
      {
        weekday:"long"
      }
    );

}


/* =========================
   SECURITY
========================= */

function esc(v){

  return String(
    v ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================
   DATETIME
========================= */

function dt(
  lesson,
  field
){

  return new Date(
    `${lesson.date}T${lesson[field]}:00`
  );

}


function current(lesson){

  const now =
    new Date();

  return (

    now >= dt(
      lesson,
      "beginLesson"
    )

    &&

    now <
    dt(
      lesson,
      "endLesson"
    )

  );

}


function ended(lesson){

  return (

    new Date()
    >=
    dt(
      lesson,
      "endLesson"
    )

  );

}


/* =========================
   SORT
========================= */

function sort(lessons){

  return [...lessons].sort(

    (a,b) =>

      (a.date || "")
        .localeCompare(
          b.date || ""
        )

      ||

      (a.beginLesson || "")
        .localeCompare(
          b.beginLesson || ""
        )

  );

}


/* =========================
   SUBJECT COLOR
========================= */

function accent(
  subject = ""
){

  const s =
    subject.toLowerCase();


  if(
    /статист|математ|анализ/.test(s)
  ){

    return "#9b6cff";

  }


  if(
    /китай|кит|язык/.test(s)
  ){

    return "#ff5ca8";

  }


  if(
    /англ|english/.test(s)
  ){

    return "#42d9ff";

  }


  if(
    /бух|учет|финанс/.test(s)
  ){

    return "#ffd166";

  }


  if(
    /военн|физ|спорт/.test(s)
  ){

    return "#27df91";

  }


  return "#4f8cff";

}


/* =========================
   NEXT LESSON
========================= */

function next(){

  const sorted =
    sort(schedule);


  const c =
    sorted.find(
      current
    );


  if(c){

    return {
      lesson:c,
      current:true
    };

  }


  const n =
    sorted.find(
      x =>
        !ended(x)
    );


  return n
    ? {
        lesson:n,
        current:false
      }
    : null;

}


/* =========================
   RENDER NEXT
========================= */

function renderNext(){

  const result =
    next();


  const container =
    $("nextLesson");


  if(!result){

    container.innerHTML = `

      <section class="hero">

        <div class="hero-content">

          <div class="eyebrow">
            Расписание
          </div>

          <div class="hero-subject">
            Ближайших занятий нет ✨
          </div>

        </div>

      </section>

    `;

    return;

  }


  const lesson =
    result.lesson;


  container.innerHTML = `

    <section class="hero">

      <div class="hero-content">


        ${
          result.current

          ?

          `
          <div class="live">

            <span class="dot"></span>

            СЕЙЧАС ИДЁТ

          </div>
          `

          :

          `
          <div class="eyebrow">
            Следующая пара
          </div>
          `
        }


        <div class="hero-time">

          ${esc(
            lesson.beginLesson
          )}

          –

          ${esc(
            lesson.endLesson
          )}

        </div>


        <div class="hero-subject">

          ${esc(
            lesson.discipline ||
            "Предмет не указан"
          )}

        </div>


        <div class="chips">


          <span class="chip">

            📅

            ${esc(
              formatWeekday(
                lesson.date
              )
            )}

            ,

            ${esc(
              formatDate(
                lesson.date
              )
            )}

          </span>


          ${
            lesson.lecturer

            ?

            `
            <span class="chip">

              👨‍🏫

              ${esc(
                lesson.lecturer
              )}

            </span>
            `

            :

            ""
          }


          ${
            lesson.auditorium

            ?

            `
            <span class="chip">

              🏫

              ${esc(
                lesson.auditorium
              )}

            </span>
            `

            :

            ""
          }


          ${
            lesson.building

            ?

            `
            <span class="chip">

              📍

              ${esc(
                lesson.building
              )}

            </span>
            `

            :

            ""
          }


        </div>

      </div>

    </section>

  `;

}


/* =========================
   STATS
========================= */

function renderStats(){

  const today =
    localDateString();


  const lessons =
    schedule.filter(
      x =>
        x.date === today
    );


  const minutes =
    lessons.reduce(
      (
        total,
        lesson
      ) =>

        total +

        Math.max(

          0,

          (

            dt(
              lesson,
              "endLesson"
            )

            -

            dt(
              lesson,
              "beginLesson"
            )

          )

          /

          60000

        ),

      0

    );


  const hours =
    Math.floor(
      minutes / 60
    );


  const mins =
    Math.round(
      minutes % 60
    );


  const buildings =
    new Set(

      lessons

        .map(
          x =>
            x.building
        )

        .filter(Boolean)

    ).size;


  $("stats").innerHTML = `

    <div class="stat">

      <div class="stat-value">
        ${lessons.length}
      </div>

      <div class="stat-label">
        пар сегодня
      </div>

    </div>


    <div class="stat">

      <div class="stat-value">

        ${
          hours

          ?

          `${hours}ч ${mins}м`

          :

          `${mins}м`
        }

      </div>

      <div class="stat-label">
        учебного времени
      </div>

    </div>


    <div class="stat">

      <div class="stat-value">
        ${buildings}
      </div>

      <div class="stat-label">
        корпуса сегодня
      </div>

    </div>

  `;

}


/* =========================
   LESSON CARD
========================= */

function lessonCard(
  lesson
){

  const isNow =
    current(lesson);


  const color =
    accent(
      lesson.discipline
    );


  return `

    <article

      class="lesson
      ${isNow ? "current" : ""}"

      style="
        --accent:${color};
      "

    >


      <div class="lesson-top">


        <div>


          <div class="time">

            ${esc(
              lesson.beginLesson
            )}

            –

            ${esc(
              lesson.endLesson
            )}

          </div>


          <div class="subject">

            ${esc(
              lesson.discipline ||
              "Предмет не указан"
            )}

          </div>


        </div>


        ${
          isNow

          ?

          `
          <div class="badge">
            СЕЙЧАС
          </div>
          `

          :

          ""
        }


      </div>


      <div class="meta">


        ${
          lesson.lecturer

          ?

          `
          <span>

            👨‍🏫

            ${esc(
              lesson.lecturer
            )}

          </span>
          `

          :

          ""
        }


        ${
          lesson.auditorium

          ?

          `
          <span>

            🏫

            ${esc(
              lesson.auditorium
            )}

          </span>
          `

          :

          ""
        }


        ${
          lesson.building

          ?

          `
          <span>

            📍

            ${esc(
              lesson.building
            )}

          </span>
          `

          :

          ""
        }


      </div>


    </article>

  `;

}


/* =========================
   FILTER
========================= */

function getLessons(){

  const today =
    new Date();


  const todayString =
    localDateString(
      today
    );


  if(
    currentView === "today"
  ){

    return schedule.filter(
      x =>
        x.date ===
        todayString
    );

  }


  if(
    currentView === "tomorrow"
  ){

    const tomorrow =
      localDateString(
        addDays(
          today,
          1
        )
      );


    return schedule.filter(
      x =>
        x.date ===
        tomorrow
    );

  }


  if(
    currentView === "week"
  ){

    const end =
      localDateString(
        addDays(
          today,
          6
        )
      );


    return schedule.filter(
      x =>

        x.date >=
        todayString

        &&

        x.date <=
        end

    );

  }


  if(
    currentView === "month"
  ){

    const end =
      localDateString(
        addDays(
          today,
          29
        )
      );


    return schedule.filter(
      x =>

        x.date >=
        todayString

        &&

        x.date <=
        end

    );

  }


  /*
   Ближайшее:
   показываем ближайший
   учебный день.
  */

  const futureDates = [

    ...new Set(

      sort(schedule)

        .filter(
          x =>
            x.date >=
            todayString
        )

        .map(
          x =>
            x.date
        )

    )

  ];


  if(
    !futureDates.length
  ){

    return [];

  }


  return schedule.filter(
    x =>
      x.date ===
      futureDates[0]
  );

}


/* =========================
   RENDER SCHEDULE
========================= */

function renderSchedule(){

  const lessons =
    getLessons();


  const container =
    $("schedule");


  if(
    !lessons.length
  ){

    container.innerHTML = `

      <div class="empty">

        <strong>
          Занятий нет
        </strong>

        В выбранном периоде
        расписание свободно.

      </div>

    `;

    return;

  }


  const grouped = {};


  lessons.forEach(
    lesson => {

      if(
        !grouped[
          lesson.date
        ]
      ){

        grouped[
          lesson.date
        ] = [];

      }


      grouped[
        lesson.date
      ].push(
        lesson
      );

    }
  );


  const dates =
    Object.keys(
      grouped
    ).sort();


  container.innerHTML =

    dates

      .map(
        date => `

          <section class="day">


            <div class="day-heading">


              <div>


                <div class="weekday">

                  ${esc(
                    formatWeekday(
                      date
                    )
                  )}

                </div>


                <div class="date">

                  ${esc(
                    formatDate(
                      date
                    )
                  )}

                </div>


              </div>


              <div class="count">

                ${grouped[date].length}

                ${
                  grouped[date].length === 1

                  ? "пара"

                  : grouped[date].length < 5

                    ? "пары"

                    : "пар"
                }

              </div>


            </div>


            <div class="grid">

              ${sort(
                grouped[date]
              )

              .map(
                lessonCard
              )

              .join("")}

            </div>


          </section>

        `
      )

      .join("");

}


/* =========================
   MAIN RENDER
========================= */

function render(){

  /*
   Статистика только:
   - Ближайшее
   - Сегодня
  */

  if(
    currentView === "nearest" ||
    currentView === "today"
  ){

    $("stats").style.display =
      "grid";

  }else{

    $("stats").style.display =
      "none";

  }


  /*
   Следующая пара только:
   - Ближайшее
  */

  if(
    currentView === "nearest"
  ){

    $("nextLesson").style.display =
      "block";

    renderNext();

  }else{

    $("nextLesson").style.display =
      "none";

  }


  renderStats();

  renderSchedule();

}


/* =========================
   LOAD SCHEDULE
========================= */

async function loadSchedule(){

  const button =
    $("refreshButton");


  button.classList.add(
    "loading"
  );


  button.textContent =
    "↻ Обновление...";


  try{

    const response =
      await fetch(
        "schedule.json?t=" +
        Date.now()
      );


    if(
      !response.ok
    ){

      throw new Error(
        "Не удалось загрузить schedule.json"
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data)
    ){

      throw new Error(
        "Неверный формат schedule.json"
      );

    }


    schedule =
      sort(

        data.filter(
          x =>
            x.date
        )

      );


    $("updated").textContent =

      "Обновлено в "

      +

      new Date()
        .toLocaleTimeString(
          "ru-RU",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );


    render();

  }


  catch(error){

    $("schedule").innerHTML = `

      <div class="error">

        <strong>
          Не удалось загрузить расписание
        </strong>

        ${esc(
          error.message
        )}

      </div>

    `;

  }


  finally{

    button.classList.remove(
      "loading"
    );


    button.textContent =
      "↻ Обновить";

  }

}


/* =========================
   MENU
========================= */

const menuButton =
  $("menuButton");

const menuClose =
  $("menuClose");

const sideMenu =
  $("sideMenu");

const menuOverlay =
  $("menuOverlay");


function openMenu(){

  sideMenu.classList.add(
    "open"
  );

  menuOverlay.classList.add(
    "open"
  );

  document.body.style.overflow =
    "hidden";

}


function closeMenu(){

  sideMenu.classList.remove(
    "open"
  );

  menuOverlay.classList.remove(
    "open"
  );

  document.body.style.overflow =
    "";

}


menuButton.addEventListener(
  "click",
  openMenu
);


menuClose.addEventListener(
  "click",
  closeMenu
);


menuOverlay.addEventListener(
  "click",
  closeMenu
);


/* =========================
   MENU ITEMS
========================= */

document
  .querySelectorAll(
    ".menu-item"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".menu-item"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentView =
            button.dataset.view;


          render();

          closeMenu();


          window.scrollTo({

            top:0,

            behavior:"smooth"

          });

        }
      );

    }
);


/* =========================
   REFRESH
========================= */

$("refreshButton")
  .addEventListener(
    "click",
    loadSchedule
  );


/* =========================
   PWA SERVICE WORKER
========================= */

if(
  "serviceWorker" in navigator
){

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./sw.js"
        )

        .then(
          registration => {

            console.log(
              "PWA Service Worker зарегистрирован:",
              registration.scope
            );

          }
        )

        .catch(
          error => {

            console.error(
              "Ошибка Service Worker:",
              error
            );

          }
        );

    }
  );

}


/* =========================
   START
========================= */

currentView =
  "nearest";


loadSchedule();


/*
 Проверяем текущую пару
 каждую минуту.
*/

setInterval(
  () => {

    render();

  },
  60000
);


/*
 Проверяем новые данные
 каждые 5 минут.
*/

setInterval(
  loadSchedule,
  5 * 60 * 1000
);


/*
 Escape закрывает меню.
*/

document.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Escape"
    ){

      closeMenu();

    }

  }
);

</script>
