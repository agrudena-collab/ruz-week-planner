<script>

/* =========================
   DATA
========================= */

let schedule = [];

let archive = [];

let currentView = "nearest";

let lastHeroLessonKey = "";


/* =========================
   HELPERS
========================= */

const $ = id =>
  document.getElementById(id);


const pad = n =>
  String(n).padStart(2,"0");


function localDateString(
  d = new Date()
){

  return (
    d.getFullYear()
    + "-"
    + pad(d.getMonth()+1)
    + "-"
    + pad(d.getDate())
  );

}


function addDays(d,n){

  const x =
    new Date(d);

  x.setDate(
    x.getDate()+n
  );

  return x;
}


function dateFromString(v){

  return new Date(
    v + "T00:00:00"
  );

}


function formatDate(v){

  return dateFromString(v)
    .toLocaleDateString(
      "ru-RU",
      {
        day:"numeric",
        month:"long"
      }
    );

}


function formatWeekday(v){

  return dateFromString(v)
    .toLocaleDateString(
      "ru-RU",
      {
        weekday:"long"
      }
    );

}


function esc(v){

  return String(
    v ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


function dt(
  lesson,
  field
){

  return new Date(
    `${lesson.date}T${lesson[field]}:00`
  );

}


function current(lesson){

  const now =
    new Date();

  return (
    now >=
    dt(
      lesson,
      "beginLesson"
    )

    &&

    now <
    dt(
      lesson,
      "endLesson"
    )
  );

}


function ended(lesson){

  return (
    new Date()
    >=
    dt(
      lesson,
      "endLesson"
    )
  );

}


function sort(lessons){

  return [...lessons].sort(

    (a,b) =>

      (a.date || "")
        .localeCompare(
          b.date || ""
        )

      ||

      (a.beginLesson || "")
        .localeCompare(
          b.beginLesson || ""
        )

  );

}


/* =========================
   COUNTDOWN
========================= */

function countdown(
  milliseconds
){

  const totalSeconds =
    Math.max(
      0,
      Math.floor(
        milliseconds / 1000
      )
    );


  const days =
    Math.floor(
      totalSeconds /
      86400
    );


  const hours =
    Math.floor(
      (totalSeconds % 86400) /
      3600
    );


  const minutes =
    Math.floor(
      (totalSeconds % 3600) /
      60
    );


  const seconds =
    totalSeconds % 60;


  if(days > 0){

    return (
      `${days}д ` +
      `${pad(hours)}ч ` +
      `${pad(minutes)}м`
    );

  }


  if(hours > 0){

    return (
      `${pad(hours)}ч ` +
      `${pad(minutes)}м ` +
      `${pad(seconds)}с`
    );

  }


  return (
    `${pad(minutes)}м ` +
    `${pad(seconds)}с`
  );

}


/* =========================
   TYPE OF LESSON
========================= */

function lessonType(lesson){

  const value =
    String(
      lesson.kindOfWork || ""
    ).trim();


  if(!value){
    return null;
  }


  const lower =
    value.toLowerCase();


  if(
    lower === "лекции" ||
    lower === "лекция"
  ){

    return {
      text:"Лекция",
      className:"lecture"
    };

  }


  if(
    lower ===
    "практические (семинарские) занятия"
    ||
    lower === "семинар"
  ){

    return {
      text:"Семинар",
      className:"seminar"
    };

  }


  if(
    lower ===
    "военная подготовка"
  ){

    return {
      text:"Военная подготовка",
      className:"military"
    };

  }


  return {
    text:value,
    className:""
  };

}


/* =========================
   ACCENT
========================= */

function accent(
  subject=""
){

  const s =
    subject.toLowerCase();


  if(
    /статист|математ|анализ/.test(s)
  ){

    return "#9b6cff";

  }


  if(
    /китай|кит|язык/.test(s)
  ){

    return "#ff5ca8";

  }


  if(
    /англ|english/.test(s)
  ){

    return "#42d9ff";

  }


  if(
    /бух|учет|финанс/.test(s)
  ){

    return "#ffd166";

  }


  if(
    /военн|физ|спорт/.test(s)
  ){

    return "#27df91";

  }


  return "#4f8cff";

}


/* =========================
   FIND NEXT / CURRENT
========================= */

function next(){

  const sorted =
    sort(schedule);


  const currentLesson =
    sorted.find(
      current
    );


  if(currentLesson){

    return {
      lesson:currentLesson,
      current:true
    };

  }


  const nextLesson =
    sorted.find(
      lesson =>
        !ended(lesson)
    );


  if(nextLesson){

    return {
      lesson:nextLesson,
      current:false
    };

  }


  return null;

}

/* =========================
   STATS
========================= */

function renderStats(){

  const today =
    localDateString();


  const lessons =
    schedule.filter(
      lesson =>
        lesson.date ===
        today
    );


  const minutes =
    lessons.reduce(

      (
        total,
        lesson
      ) =>

        total +

        Math.max(
          0,

          (
            dt(
              lesson,
              "endLesson"
            )

            -

            dt(
              lesson,
              "beginLesson"
            )
          )

          / 60000
        ),

      0

    );


  const hours =
    Math.floor(
      minutes / 60
    );


  const mins =
    Math.round(
      minutes % 60
    );


  const buildings =
    new Set(

      lessons
        .map(
          lesson =>
            lesson.building
        )
        .filter(Boolean)

    ).size;


  $("stats").innerHTML = `

    <div class="stat">

      <div class="stat-value">
        ${lessons.length}
      </div>

      <div class="stat-label">
        пар сегодня
      </div>

    </div>


    <div class="stat">

      <div class="stat-value">

        ${
          hours
          ? `${hours}ч ${mins}м`
          : `${mins}м`
        }

      </div>

      <div class="stat-label">
        учебного времени
      </div>

    </div>


    <div class="stat">

      <div class="stat-value">
        ${buildings}
      </div>

      <div class="stat-label">
        корпуса сегодня
      </div>

    </div>

  `;

}

/* =========================
   GROUP LESSONS
========================= */

function renderGroupedLessons(
  lessons
){

  const container =
    $("schedule");


  if(!lessons.length){

    container.innerHTML = `

      <div class="empty">

        <strong>
          Занятий нет
        </strong>

        В выбранном периоде
        расписание свободно.

      </div>

    `;

    return;

  }


  const grouped = {};


  lessons.forEach(
    lesson => {

      if(
        !grouped[
          lesson.date
        ]
      ){

        grouped[
          lesson.date
        ] = [];

      }


      grouped[
        lesson.date
      ].push(lesson);

    }
  );


  const dates =
    Object.keys(
      grouped
    ).sort();


  container.innerHTML =

    dates.map(

      date => `

        <section class="day">

          <div class="day-heading">

            <div>

              <div class="weekday">

                ${esc(
                  formatWeekday(
                    date
                  )
                )}

              </div>


              <div class="date">

                ${esc(
                  formatDate(
                    date
                  )
                )}

              </div>

            </div>


            <div class="count">

              ${
                grouped[date].length
              }

              ${
                grouped[date].length === 1
                ? "пара"
                : grouped[date].length < 5
                ? "пары"
                : "пар"
              }

            </div>

          </div>


          <div class="grid">

            ${sort(
              grouped[date]
            )
            .map(
              lessonCard
            )
            .join("")}

          </div>

        </section>

      `

    ).join("");

}


/* =========================
   FILTERS
========================= */

function getLessons(){

  const today =
    new Date();


  const todayString =
    localDateString(
      today
    );


  if(
    currentView === "today"
  ){

    return schedule.filter(
      lesson =>
        lesson.date ===
        todayString
    );

  }


  if(
    currentView === "tomorrow"
  ){

    const tomorrow =
      localDateString(
        addDays(
          today,
          1
        )
      );


    return schedule.filter(
      lesson =>
        lesson.date ===
        tomorrow
    );

  }


  if(
    currentView === "week"
  ){

    const end =
      localDateString(
        addDays(
          today,
          6
        )
      );


    return schedule.filter(
      lesson =>

        lesson.date >=
        todayString

        &&

        lesson.date <=
        end

    );

  }


  if(
    currentView === "month"
  ){

    const end =
      localDateString(
        addDays(
          today,
          29
        )
      );


    return schedule.filter(
      lesson =>

        lesson.date >=
        todayString

        &&

        lesson.date <=
        end

    );

  }


  /* =====================
     БЛИЖАЙШЕЕ
  ===================== */

  const futureDates = [

    ...new Set(

      sort(schedule)

        .filter(
          lesson =>
            lesson.date >=
            todayString
        )

        .map(
          lesson =>
            lesson.date
        )

    )

  ];


  if(
    !futureDates.length
  ){

    return [];

  }


  return schedule.filter(
    lesson =>
      lesson.date ===
      futureDates[0]
  );

}


/* =========================
   ARCHIVE
========================= */

    $("schedule");


  if(
    !Array.isArray(archive)
    ||
    !archive.length
  ){

    container.innerHTML = `

      <section class="archive-header">

        <div class="archive-title">
          Архив
        </div>

        <div class="archive-subtitle">
          Прошедшие занятия
        </div>

        <strong>
          Архив пока пуст
        </strong>

        После завершения занятий
        GitHub Action автоматически
        добавит их сюда.

    `;

    return;

  }


  const sorted =
    sort(archive);


  const grouped = {};


  sorted.forEach(
    lesson => {

      if(
        !grouped[

        ]
      ){

        grouped[
          lesson.date
        ] = [];

      }


      grouped[
        lesson.date
      ].push(lesson);

  );


  const dates =

  container.innerHTML = `

              <div class="weekday">

                ${esc(
                  formatWeekday(
                    date

                )}

              </div>


              <div class="date">

                ${esc(
                  formatDate(
                    date
                  )
                )}

              </div>

            </div>


            <div class="count">

              ${
                grouped[date].length
              }

              ${
                grouped[date].length === 1
                ? "пара"
                : grouped[date].length < 5
                ? "пары"
                : "пар"
              }

            </div>

          </div>


          <div class="grid">

            ${sort(
              grouped[date]
            )
            .map(

            )
            .join("")}

          </div>

        </section>

      `

    ).join("");


  container.insertAdjacentHTML(
    "beforeend",
    html
  );

}


/* =========================
   RENDER VIEW
========================= */

function renderSchedule(){

  if(
    currentView ===
    "archive"
  ){

    renderArchive();

    return;

  }


  if(
    currentView ===
    "nearest"
  ){

    $("nextLesson")
      .style.display =
      "block";

    $("stats")
      .style.display =
      "grid";

    renderNext();
    renderStats();

  }


  else if(
    currentView ===
    "today"
  ){

    $("nextLesson")
      .style.display =
      "none";

    $("stats")
      .style.display =
      "grid";

    renderStats();

  }


  else{

    $("nextLesson")
      .style.display =
      "none";

    $("stats")
      .style.display =
      "none";

  }


  renderGroupedLessons(
    getLessons()
  );

}


/* =========================
   LOAD SCHEDULE
========================= */

async function loadSchedule(){

  const button =
    $("refreshButton");


  button.classList.add(
    "loading"
  );


  button.textContent =
    "↻ Обновление...";


  try{

    const response =
      await fetch(
        "schedule.json?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "Не удалось загрузить schedule.json"
      );

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data)
    ){

      throw new Error(
        "Неверный формат schedule.json"
      );

    }


    schedule =
      sort(

        data.filter(
          lesson =>
            lesson.date
        )

      );


    $("updated").textContent =
      "Обновлено в " +

      new Date()
        .toLocaleTimeString(
          "ru-RU",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        );


    renderSchedule();

  }

  catch(error){

    if(
      currentView !==
      "archive"
    ){

      $("schedule").innerHTML = `

        <div class="error">

          <strong>
            Не удалось загрузить расписание
          </strong>

          ${esc(
            error.message
          )}

        </div>

      `;

    }

  }

  finally{

    button.classList.remove(
      "loading"
    );

    button.textContent =
      "↻ Обновить";

  }

}


/* =========================
   LOAD ARCHIVE
========================= */

async function loadArchive(){

  try{

    const response =
      await fetch(
        "archive.json?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      archive = [];

      return;

    }


    const data =
      await response.json();


    if(
      !Array.isArray(data)
    ){

      archive = [];

      return;

    }


    archive =
      sort(

        data.filter(
          lesson =>
            lesson.date
        )

      );

  }

  catch(error){

    console.error(
      "Archive loading error:",
      error
    );

    archive = [];

  }

}


/* =========================
   LOAD EVERYTHING
========================= */

async function loadAll(){

  await Promise.all([

    loadSchedule(),

    loadArchive()

  ]);


  renderSchedule();


  lastHeroLessonKey =
    heroLessonKey();

}


/* =========================
   MENU
========================= */

function openMenu(){

  $("sideMenu")
    .classList
    .add("open");


  $("menuOverlay")
    .classList
    .add("open");


  document.body.style.overflow =
    "hidden";

}


function closeMenu(){

  $("sideMenu")
    .classList
    .remove("open");


  $("menuOverlay")
    .classList
    .remove("open");


  document.body.style.overflow =
    "";

}


$("menuOpen")
  .addEventListener(
    "click",
    openMenu
  );


$("menuClose")
  .addEventListener(
    "click",
    closeMenu
  );


$("menuOverlay")
  .addEventListener(
    "click",
    closeMenu
  );


/* =========================
   MENU ITEMS
========================= */

document
  .querySelectorAll(
    ".menu-item"
  )
  .forEach(

    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".menu-item"
            )
            .forEach(
              item =>
                item.classList
                  .remove(
                    "active"
                  )
            );


          button.classList.add(
            "active"
          );


          currentView =
            button.dataset.view;


          closeMenu();


          renderSchedule();

        }
      );

    }

  );


/* =========================
   REFRESH
========================= */

$("refreshButton")
  .addEventListener(
    "click",
    async () => {

      await loadAll();

    }
  );


/* =========================
   TIMER
========================= */

function heroLessonKey(){

  const result =
    next();


  if(!result){

    return "";

  }


  const lesson =
    result.lesson;


  return [

    lesson.date,

    lesson.beginLesson,

    lesson.endLesson,

    result.current
      ? "current"
      : "next"

  ].join("|");

}


function updateHeroCountdown(){

  if(
    currentView !==
    "nearest"
  ){

    return;

  }


  const result =
    next();


  if(!result){

    if(
      lastHeroLessonKey !==
      ""
    ){

      renderNext();

      lastHeroLessonKey =
        "";

    }

    return;

  }


  const key =
    heroLessonKey();


  if(
    key !==
    lastHeroLessonKey
  ){

    renderNext();

    lastHeroLessonKey =
      key;

    return;

  }


  const lesson =
    result.lesson;


  const target =
    result.current

      ? dt(
          lesson,
          "endLesson"
        )

      : dt(
          lesson,
          "beginLesson"
        );


  const countdownElement =
    $("heroCountdown");


  if(
    countdownElement
  ){

    countdownElement.textContent =
      countdown(
        target - new Date()
      );

  }

}


/* =========================
   START
========================= */

loadAll();


/* =========================
   LIVE UPDATE
========================= */

setInterval(

  () => {

    updateHeroCountdown();


    if(
      currentView ===
      "nearest"
      ||
      currentView ===
      "today"
    ){

      renderStats();

    }


    if(
      currentView !==
      "archive"
    ){

      renderGroupedLessons(
        getLessons()
      );

    }

  },

  1000

);


/* =========================
   UPDATE SCHEDULE
   EVERY 5 MINUTES
========================= */

setInterval(

  loadAll,

  5 * 60 * 1000

);

</script>
